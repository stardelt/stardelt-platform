# A reference row, never applied (platform#966, #967).
#
# `Trino Gold` is created from the Catalog `gold` by scripts/superset-group-roles.py, which
# gives it the UUID below on every install (uuid5 of `stardelt.io/superset/database/gold`).
# The importer looks the row up by that UUID and leaves an existing one untouched, and step
# 10 of scripts/public-demo.sh refuses to import while the row is missing — so this file is
# read for the UUID, never written. The URI is the shape the sync gives the row; the
# connection itself (host, service account, impersonation) stays with that row.
database_name: Trino Gold
sqlalchemy_uri: trino://superset@trino.alpha.dev.stardelt.io:443/gold
cache_timeout: null
expose_in_sqllab: true
allow_run_async: false
allow_ctas: false
allow_cvas: false
allow_dml: false
allow_file_upload: false
impersonate_user: true
extra:
  allow_multi_catalog: true
  allows_virtual_table_explore: true
  metadata_params: {}
  engine_params: {}
  metadata_cache_timeout: {}
  schemas_allowed_for_csv_upload: []
uuid: bbb03e90-0c81-5c87-838a-0497064b6381
version: 1.0.0
