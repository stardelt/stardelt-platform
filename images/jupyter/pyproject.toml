[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Project root is images/jupyter/ (this file's directory); the installable
# package is ./stardelt/. `pip install images/jupyter/` is what the Dockerfile
# runs, so `import stardelt` works in every notebook with no sys.path tweak.
[project]
name = "stardelt"
version = "0.1.0"
description = "Small helper between a stardelt notebook and the warehouse (sql, write_df, spark)"
readme = "stardelt/README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pandas", "trino"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stardelt"]
