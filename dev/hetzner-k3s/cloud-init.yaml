#cloud-config
# Installs a single-node k3s server. Traefik ingress, ServiceLB and local-path
# storage stay enabled. The public IP is added as a TLS SAN so the cluster is
# reachable through the firewall from outside.
package_update: true
packages:
  - curl
  - ca-certificates

runcmd:
  - |
    PUBLIC_IP="$(curl -fsS https://ifconfig.me || true)"
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644 --tls-san ${PUBLIC_IP}" \
      sh -
  - mkdir -p /root/.kube
  - cp /etc/rancher/k3s/k3s.yaml /root/.kube/config
  - chmod 600 /root/.kube/config

final_message: "stardelt dev node ready after $UPTIME seconds"
