# Let's Encrypt over DNS-01 (Cloudflare), for a cluster behind a home router.
#
# HTTP-01 needs Let's Encrypt to reach http://<host>/.well-known/acme-challenge/…;
# behind a router that depends on a port forward (and on port 80 being free), so
# this issuer proves control of the zone instead. It also covers the wildcard in
# one order.
#
# Apply after cert-manager, and after the token Secret exists in the cert-manager
# namespace (the account key and every challenge are read from there):
#
#   kubectl -n cert-manager create secret generic cloudflare-api-token \
#     --from-literal=api-token="$CLOUDFLARE_API_TOKEN"
#   kubectl apply -f dev/home-k3s/clusterissuer-cloudflare.yaml
#
# The token needs exactly Zone → DNS → Edit on the zone. It is a credential:
# create the Secret from a shell that has it, never from a file in this repository.
#
# SET YOUR OWN ADDRESS before applying — Let's Encrypt sends expiry warnings
# there and ignores the placeholder.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com   # ← change this
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
