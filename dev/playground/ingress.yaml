# Playground ingresses. The wildcard A record (*.alpha.dev.stardelt.io) points at
# the node, and ingress-nginx binds :80/:443 there, so each host only needs a
# certificate.
#
# Not every backend exists in every profile (e.g. Superset/Airflow/JupyterHub are
# not in `install-core`). An Ingress to a Service without endpoints simply 503s —
# harmless. Nova's Apps page probes the services and shows what is actually up.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nova
  namespace: stardelt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [alpha.dev.stardelt.io]
      secretName: nova-tls
  rules:
    - host: alpha.dev.stardelt.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nova
                port:
                  number: 8080
