# Let's Encrypt issuer using HTTP-01 (works with ingress-nginx and Traefik's
# default ingress class). Requires cert-manager (see dev/playground/README.md).
#
# SET YOUR OWN ADDRESS before applying — Let's Encrypt sends expiry warnings
# there and ignores the placeholder.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
