# The dev seed's three warehouses (platform#313): the compute classes people land in.
#
# `SqlWarehouse` is the query-serving plug (master spec §5, design
# `design/multitenant-catalogs.md` §4.3, §7.2 P2b): one named class inside the one
# Trino, with its size, its caps and the groups that may use it. CronJob `access-sync`
# renders every object into a resource group of ConfigMap `trino-warehouses` and one
# `wh-<name>` line of ConfigMap `trino-group-file`, and the coordinator restarts on the
# first change (the file manager loads the file once).
#
# Who is in which class — the group is the only input, never a header a client sends:
#
#   small   every member of `stardelt-users` (that is: everybody, `dev-outsider`
#           included) and the administrators, who actually land in the `admin` root
#           group because that selector is read first. The one class marked
#           `default: true`, so it is also the catch-all: a principal that matches no
#           group at all (a throwaway Keycloak user outside `stardelt-users`) still
#           runs here instead of hitting `Too many queued queries for "no-warehouse"`.
#   medium  `finops` only — the seeded `dev-finops`.
#   large   `analytics` only — the seeded `dev-analytics` and the pre-existing `analyst`.
#
# A person in more than one of those groups lands in the largest class they match: the
# selectors are rendered largest first and the first match wins.
#
# The classes do not add hardware. `small` is 10 running / 100 queued / 20 % of the
# engine's memory, `medium` 5/50/40 %, `large` 6/70/70 %, scheduling `fair` (the class
# defaults of platform#312). On a one-node cluster that means a `large` query gets a
# bigger share and fewer concurrent peers — not more CPU or RAM.
#
# Written for people who want to exercise the classes; it is applied by
# `make seed-dev-access YES=1` and removed by `make unseed-dev-access YES=1`, which
# deletes `medium` and `large` and keeps `small` (the default class is part of the
# install, not of the seed's people).
apiVersion: stardelt.io/v1alpha1
kind: SqlWarehouse
metadata:
  name: small
  namespace: stardelt
spec:
  lakehouseRef: { name: main }
  displayName: "Small"
  size: small
  default: true
  grants:
    - { group: stardelt-users }
    - { group: stardelt-admins }
---
apiVersion: stardelt.io/v1alpha1
kind: SqlWarehouse
metadata:
  name: medium
  namespace: stardelt
spec:
  lakehouseRef: { name: main }
  displayName: "Medium"
  size: medium
  grants:
    - { group: finops }
---
apiVersion: stardelt.io/v1alpha1
kind: SqlWarehouse
metadata:
  name: large
  namespace: stardelt
spec:
  lakehouseRef: { name: main }
  displayName: "Large"
  size: large
  grants:
    - { group: analytics }
