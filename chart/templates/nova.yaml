{{- if .Values.nova.enabled }}
# stardelt Nova — UI + backend in one pod.
# Image published by CI from the nova repo (ghcr.io/stardelt/nova).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nova
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: nova, app.kubernetes.io/part-of: stardelt }
---
# Nova's only cluster permission: read the workloads in its own namespace, so the
# UI can show what is actually deployed — including digest pins. It writes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nova-workload-reader
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-workload-reader
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nova-workload-reader
subjects:
  - kind: ServiceAccount
    name: nova
    namespace: {{ .Release.Namespace }}
{{- if .Values.nova.secretStore.url }}
---
# Only when a secret store is configured: Nova creates and deletes `Connection`
# resources in its own namespace for group and managed connections, and patches
# one annotation onto them for the break-glass notice (stardelt-nova#151). No
# update, no Secrets — the connection secret itself is written by the store.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nova-connections
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["stardelt.io"]
    resources: ["connections"]
    verbs: ["get", "list", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-connections
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nova-connections
subjects:
  - kind: ServiceAccount
    name: nova
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.nova.airflow.url }}
---
# Only when Airflow is configured: Nova lists `Pipeline` resources to show what
# is scheduled and which runs belong to them (J1). Read-only — the Schedule
# ticket adds create and delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nova-pipelines
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["stardelt.io"]
    resources: ["pipelines"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-pipelines
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nova-pipelines
subjects:
  - kind: ServiceAccount
    name: nova
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nova
    app.kubernetes.io/part-of: stardelt
spec:
  replicas: {{ .Values.nova.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: nova }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nova, app.kubernetes.io/part-of: stardelt }
    spec:
      serviceAccountName: nova
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      {{- $pullSecrets := .Values.nova.imagePullSecrets | default .Values.images.pullSecrets }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nova
          image: "{{ .Values.nova.image.repository }}:{{ .Values.nova.image.tag }}"
          imagePullPolicy: {{ .Values.nova.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: internal
          env:
            - name: NOVA_TRINO_URL
              value: {{ tpl .Values.nova.trinoURL . | quote }}
            - name: NOVA_LAKEKEEPER_URL
              value: {{ tpl .Values.nova.lakekeeperURL . | quote }}
            - name: NOVA_WAREHOUSE_NAME
              value: {{ .Values.nova.warehouseName | quote }}
            - name: NOVA_DEV_USER
              value: {{ .Values.nova.devUser | quote }}
            # Send the signed-in user's own token to Trino (master spec §7). Only
            # meaningful with an IdP configured; Trino must trust audience
            # `trino` for that token (realm mapper `aud-trino` on client `nova`).
            - name: NOVA_FORWARD_IDENTITY
              value: "1"
            {{- $authMode := .Values.nova.auth.mode | default "dev" }}
            {{- if not (has $authMode (list "dev" "oidc")) }}
            {{- fail (printf "nova.auth.mode must be dev or oidc, got %q" $authMode) }}
            {{- end }}
            {{- if eq $authMode "oidc" }}
            {{- $issuer := include "stardelt.issuerUrl" . }}
            {{- if or (eq (include "stardelt.identityMode" .) "none") (not $issuer) }}
            {{- fail "nova.auth.mode=oidc needs an identity provider: set identity.mode=platform (deploys Keycloak) or identity.mode=external with identity.issuerUrl — otherwise Nova cannot validate a single token" }}
            {{- end }}
            {{- $publicUrl := .Values.nova.auth.publicUrl }}
            {{- if not $publicUrl }}
            {{- $publicUrl = printf "https://%s" (include "stardelt.appHost" (list . "nova" "")) }}
            {{- end }}
            - name: NOVA_AUTH_MODE
              value: "oidc"
            # Redirect URI is <publicUrl>/api/auth/callback — register it at the IdP.
            - name: NOVA_PUBLIC_URL
              value: {{ $publicUrl | quote }}
            - name: NOVA_OIDC_ISSUER
              value: {{ $issuer | quote }}
            - name: NOVA_OIDC_CLIENT_ID
              value: {{ .Values.nova.auth.clientId | quote }}
            - name: NOVA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nova.auth.clientSecret.name }}
                  key: {{ .Values.nova.auth.clientSecret.key }}
            - name: NOVA_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nova.auth.sessionSecret.name }}
                  key: {{ .Values.nova.auth.sessionSecret.key }}
            - name: NOVA_OIDC_SCOPES
              value: {{ .Values.nova.auth.scopes | quote }}
            - name: NOVA_OIDC_GROUP_CLAIM
              value: {{ .Values.identity.groupClaim | quote }}
            - name: NOVA_OIDC_ADMIN_GROUP
              value: {{ .Values.identity.adminGroup | quote }}
            {{- else }}
            - name: NOVA_AUTH_MODE
              value: "dev"
            {{- end }}
            # Namespace whose workloads Nova reports (downward API).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # External base domain for deep-linking platform apps in Nova.
            # Empty = no links. Defaults to platform.baseDomain.
            - name: NOVA_BASE_DOMAIN
              value: {{ .Values.nova.baseDomain | default .Values.platform.baseDomain | quote }}
            {{- if .Values.nova.database.enabled }}
            # The state store: CloudNative-PG generates Secret `nova-pg-app` for the
            # Cluster in templates/nova-pg.yaml; `uri` is a complete postgresql:// URL.
            # Not optional on purpose: until the Secret exists the pod waits in
            # CreateContainerConfigError instead of starting without its database.
            - name: NOVA_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: nova-pg-app, key: uri }
            {{- end }}
            {{- if .Values.nova.secretStore.url }}
            - name: NOVA_SECRET_STORE_URL
              value: {{ .Values.nova.secretStore.url | quote }}
            - name: NOVA_SECRET_STORE_ROLE
              value: {{ .Values.nova.secretStore.role | quote }}
            - name: NOVA_SECRET_STORE_MOUNT
              value: {{ .Values.nova.secretStore.mount | quote }}
            {{- end }}
            {{- if .Values.nova.airflow.url }}
            # Airflow REST API for pipeline runs and logs, with the service user's
            # credential from the Secret the spike (#243) created. Empty url = off.
            - name: NOVA_AIRFLOW_URL
              value: {{ .Values.nova.airflow.url | quote }}
            - name: NOVA_AIRFLOW_USER
              value: {{ .Values.nova.airflow.user | quote }}
            - name: NOVA_AIRFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nova.airflow.passwordSecret.name }}
                  key: {{ .Values.nova.airflow.passwordSecret.key }}
            {{- end }}
            # Query-log collector (stardelt-nova#116): a second listener that no Ingress
            # routes, reachable inside the cluster only (Service port `internal`). The bearer
            # token is Secret `nova-events` (scripts/nova-events-token.sh), shared with Trino's
            # event listener; optional, so without it the collector stays off.
            - name: NOVA_INTERNAL_ADDR
              value: "0.0.0.0:8081"
            - name: NOVA_EVENTS_TOKEN
              valueFrom: { secretKeyRef: { name: nova-events, key: token, optional: true } }
            - name: RUST_LOG
              value: {{ .Values.nova.logLevel | quote }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.nova.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: nova
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: nova }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: nova }
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: internal
      port: 8081
      targetPort: internal
{{- end }}
