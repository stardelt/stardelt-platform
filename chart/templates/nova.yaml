{{- if .Values.nova.enabled }}
# stardelt Nova — UI + backend in one pod.
# Image published by CI from the nova repo (ghcr.io/stardelt/nova).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nova
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: nova, app.kubernetes.io/part-of: stardelt }
---
# Nova's only cluster permission: read the workloads in its own namespace, so the
# UI can show what is actually deployed — including digest pins. It writes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nova-workload-reader
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-workload-reader
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nova-workload-reader
subjects:
  - kind: ServiceAccount
    name: nova
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nova
    app.kubernetes.io/part-of: stardelt
spec:
  replicas: {{ .Values.nova.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: nova }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nova, app.kubernetes.io/part-of: stardelt }
    spec:
      serviceAccountName: nova
      {{- $pullSecrets := .Values.nova.imagePullSecrets | default .Values.images.pullSecrets }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nova
          image: "{{ .Values.nova.image.repository }}:{{ .Values.nova.image.tag }}"
          imagePullPolicy: {{ .Values.nova.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NOVA_TRINO_URL
              value: {{ tpl .Values.nova.trinoURL . | quote }}
            - name: NOVA_LAKEKEEPER_URL
              value: {{ tpl .Values.nova.lakekeeperURL . | quote }}
            - name: NOVA_WAREHOUSE_NAME
              value: {{ .Values.nova.warehouseName | quote }}
            - name: NOVA_DEV_USER
              value: {{ .Values.nova.devUser | quote }}
            # Namespace whose workloads Nova reports (downward API).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # External base domain for deep-linking platform apps in Nova.
            # Empty = no links. Defaults to platform.baseDomain.
            - name: NOVA_BASE_DOMAIN
              value: {{ .Values.nova.baseDomain | default .Values.platform.baseDomain | quote }}
            - name: RUST_LOG
              value: {{ .Values.nova.logLevel | quote }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.nova.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nova
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: nova }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: nova }
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
