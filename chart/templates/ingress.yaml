{{- if .Values.ingress.enabled }}
{{- /*
  One Ingress per installed component, so an administrator gets reachability
  without hand-writing YAML. Deliberately generic: the class, the host pattern
  and TLS are all settings, and nothing here assumes a particular controller.

  Components without a sign-in of their own (trino, lakekeeper, superset,
  airflow, jupyterhub) render only when named in `ingress.exposeUnauthenticated`.

  Paths default to `/`; Keycloak publishes the realm's public surface
  (`/realms/stardelt`, `/resources`, `/robots.txt`) plus the `stardelt` realm's
  admin console and its REST API. Its paths are ingress-nginx regexes
  (`regex: true` adds `use-regex`), each anchored to its exact path segment
  (`(/|$)` or `$`), so the master-realm console is never reachable through this
  host. A path entry is either a string (Prefix) or a mapping of `path` +
  `pathType`.

  Host resolution, per service: `ingress.hosts.<name>` wins; otherwise
  `<sub>.<platform.baseDomain>`; otherwise nothing is rendered for that service
  (a reachable-only-by-Service setup stays valid).
*/}}
{{- $base := .Values.platform.baseDomain | default "" }}
{{- $tls := .Values.ingress.tls }}
{{- $extraAnnotations := .Values.ingress.annotations }}
{{- $overrides := .Values.ingress.hosts | default dict }}
{{- $unauthenticated := list "trino" "lakekeeper" "superset" "airflow" "jupyterhub" }}
{{- $exposed := .Values.ingress.exposeUnauthenticated | default list }}
{{- $services := list
      (dict "name" "nova"       "service" "nova"               "port" 8080 "sub" ""           "enabled" .Values.nova.enabled)
      (dict "name" "trino"      "service" "trino"              "port" 8080 "sub" "trino"      "enabled" .Values.trino.enabled)
      (dict "name" "lakekeeper" "service" "lakekeeper"         "port" 8181 "sub" "lakekeeper" "enabled" .Values.lakekeeper.enabled)
      (dict "name" "superset"   "service" "superset"           "port" 8088 "sub" "superset"   "enabled" .Values.superset.enabled)
      (dict "name" "airflow"    "service" "airflow-api-server" "port" 8080 "sub" "airflow"    "enabled" .Values.airflow.enabled)
      (dict "name" "jupyterhub" "service" "proxy-public"       "port" 80   "sub" "jupyter"    "enabled" .Values.jupyterhub.enabled)
      (dict "name" "keycloak"   "service" "keycloak"           "port" 8080 "sub" "id"         "enabled" (eq (include "stardelt.identityMode" .) "platform") "regex" true "paths" (list
        (dict "path" "/realms/stardelt(/|$)"        "pathType" "ImplementationSpecific")
        (dict "path" "/resources(/|$)"              "pathType" "ImplementationSpecific")
        (dict "path" "/robots\\.txt$"               "pathType" "ImplementationSpecific")
        (dict "path" "/admin/stardelt(/|$)"         "pathType" "ImplementationSpecific")
        (dict "path" "/admin/realms/stardelt(/|$)"  "pathType" "ImplementationSpecific")
        (dict "path" "/admin/serverinfo$"           "pathType" "ImplementationSpecific")))
}}
{{- range $services }}
{{- if and .enabled (or (not (has .name $unauthenticated)) (has .name $exposed)) }}
{{- $host := "" }}
{{- $overridden := index $overrides .name | default "" }}
{{- if $overridden }}
{{- $host = $overridden }}
{{- else if $base }}
{{- if .sub }}
{{- $host = printf "%s.%s" .sub $base }}
{{- else }}
{{- $host = $base }}
{{- end }}
{{- end }}
{{- if $host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: stardelt
  {{- if or $extraAnnotations (and $tls.enabled $tls.issuer) .regex }}
  annotations:
    {{- with $extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and $tls.enabled $tls.issuer }}
    cert-manager.io/cluster-issuer: {{ $tls.issuer | quote }}
    {{- end }}
    {{- if .regex }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- end }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $tls.secretNameTemplate | replace "{host}" (replace "." "-" $host) | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- $service := . }}
          {{- range (.paths | default (list "/")) }}
          {{- if kindIs "string" . }}
          - path: {{ . | quote }}
            pathType: Prefix
          {{- else }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
          {{- end }}
            backend:
              service:
                name: {{ $service.service }}
                port:
                  number: {{ $service.port }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
