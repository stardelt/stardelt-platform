{{- if .Values.s3Credentials.create }}
# S3 credentials for the lakehouse storage layer — the Secret every storage
# consumer reads: the Trino catalog, the Lakekeeper bootstrap Job and Airflow.
#
# Defaults are the dev credentials, pinned to match the credentials the
# SeaweedFS sub-chart is configured with (see `seaweedfs.s3.credentials.admin`).
# They are not secrets: dev-only, single-node, no external exposure. Override
# all four values for a real install, or set `s3Credentials.create=false` and
# create the Secret yourself (manifests/s3-credentials.example.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3Credentials.name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  access-key: {{ .Values.s3Credentials.accessKey | quote }}
  secret-key: {{ .Values.s3Credentials.secretKey | quote }}
  endpoint: {{ tpl .Values.s3Credentials.endpoint . | quote }}
  bucket: {{ .Values.s3Credentials.bucket | quote }}
  region: {{ .Values.s3Credentials.region | quote }}
{{- end }}
