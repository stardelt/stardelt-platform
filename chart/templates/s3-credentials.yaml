{{- if .Values.s3Credentials.create }}
{{- /*
  S3 credentials for the lakehouse storage layer, generated on first install.

  Two Secrets carry the same key pair:
    * `s3Credentials.name` (stardelt-s3-creds): read by every consumer (the Trino
      catalog, the Lakekeeper bootstrap Job, Airflow, CNPG backups).
    * `seaweedfs-s3-config`: the S3 identities JSON the SeaweedFS S3 gateway reads
      (seaweedfs.s3.existingConfigSecret in values.yaml).
  Values come from `s3Credentials.accessKey` / `.secretKey` when set, else from the
  existing Secret (kept across `helm upgrade`), else random. Both Secrets are kept on
  uninstall. To rotate, see docs: operations/rotating-secrets.
  `helm template` has no cluster to look up, so it always shows fresh values.
*/}}
{{- $name := .Values.s3Credentials.name }}
{{- $ak := .Values.s3Credentials.accessKey | default (include "stardelt.secretValue" (list . $name "access-key") | b64dec) }}
{{- $sk := .Values.s3Credentials.secretKey | default (include "stardelt.secretValue" (list . $name "secret-key") | b64dec) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: stardelt
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  access-key: {{ $ak | quote }}
  secret-key: {{ $sk | quote }}
  endpoint: {{ tpl .Values.s3Credentials.endpoint . | quote }}
  bucket: {{ .Values.s3Credentials.bucket | quote }}
  region: {{ .Values.s3Credentials.region | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: stardelt
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  seaweedfs_s3_config: {{ dict "identities" (list (dict "name" "stardelt" "credentials" (list (dict "accessKey" $ak "secretKey" $sk)) "actions" (list "Admin" "Read" "Write"))) | toJson | quote }}
{{- end }}
