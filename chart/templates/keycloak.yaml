{{- if eq (include "stardelt.identityMode" .) "platform" }}
{{- $kc := .Values.identity.keycloak }}
{{- $base := .Values.platform.baseDomain }}
{{- $kcHost := include "stardelt.appHost" (list . "keycloak" "id") }}
# Keycloak — the platform identity provider (identity.mode=platform).
# Equivalent to manifests/keycloak.yaml + scripts/identity-bootstrap.sh.
#
# Generated credentials: random on first install, re-read with `lookup` on every
# upgrade (the imported realm already holds them), and kept on uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
data:
  username: {{ "admin" | b64enc | quote }}
  password: {{ include "stardelt.secretValue" (list . "keycloak-admin" "password") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: stardelt-realm-admin
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
data:
  username: {{ "admin" | b64enc | quote }}
  password: {{ include "stardelt.secretValue" (list . "stardelt-realm-admin" "password") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: stardelt-oidc-clients
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
data:
  {{- range list "nova" "superset" "airflow" "jupyterhub" "trino" "trino-group-sync" }}
  {{ . }}: {{ include "stardelt.secretValue" (list $ "stardelt-oidc-clients" .) | quote }}
  {{- end }}
---
# Realm import. Hosts are rendered here; secrets stay ${ENV} placeholders that
# Keycloak resolves from the Secrets above at import time.
{{- $realm := .Files.Get "files/keycloak-realm.json"
      | replace "__BASE_DOMAIN__" $base
      | replace "__NOVA_HOST__" (include "stardelt.appHost" (list . "nova" ""))
      | replace "__TRINO_HOST__" (include "stardelt.appHost" (list . "trino" "trino"))
      | replace "__LAKEKEEPER_HOST__" (include "stardelt.appHost" (list . "lakekeeper" "lakekeeper"))
      | replace "__SUPERSET_HOST__" (include "stardelt.appHost" (list . "superset" "superset"))
      | replace "__AIRFLOW_HOST__" (include "stardelt.appHost" (list . "airflow" "airflow"))
      | replace "__JUPYTER_HOST__" (include "stardelt.appHost" (list . "jupyterhub" "jupyter")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
data:
  stardelt-realm.json: |
{{ $realm | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-env
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
data:
  KC_HOSTNAME: {{ printf "https://%s" $kcHost | quote }}
---
# CloudNative-PG Cluster for Keycloak's own state. The operator generates
# `keycloak-pg-app` (username/password).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-pg
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  instances: {{ $kc.postgres.instances }}
  storage:
    size: {{ $kc.postgres.storage.size }}
    {{- with .Values.storage.className }}
    storageClass: {{ . }}
    {{- end }}
  {{- if .Values.postgres.backup.enabled }}
  # Continuous backup into the platform's own object store: barman-cloud streams
  # the WAL and the ScheduledBackup below adds base backups. Same shape as the
  # catalog Cluster (templates/cnpg-postgres.yaml) so both clusters share the
  # `backups` bucket without colliding (CNPG writes under <bucket>/<cluster>/).
  backup:
    retentionPolicy: {{ .Values.postgres.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: s3://{{ .Values.postgres.backup.bucket }}/
      endpointURL: {{ tpl .Values.s3Credentials.endpoint . | quote }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.s3Credentials.name }}
          key: access-key
        secretAccessKey:
          name: {{ .Values.s3Credentials.name }}
          key: secret-key
        region:
          name: {{ .Values.s3Credentials.name }}
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
  {{- end }}
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  resources:
    {{- toYaml $kc.postgres.resources | nindent 4 }}
{{- if .Values.postgres.backup.enabled }}
---
# Daily base backup on top of the continuous WAL archiving above. Same shape as
# the catalog schedule (templates/cnpg-postgres.yaml), 15 minutes later so the
# two base backups do not overlap. `immediate: true` takes a first backup right
# away, which is what makes a fresh install verifiable.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-pg-daily
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 45 2 * * *"
  immediate: true
  # Keep the Backup objects after the schedule is deleted, so deleting this CR
  # cannot delete the only record of what was taken.
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: keycloak-pg
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: stardelt }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: keycloak }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: stardelt }
spec:
  # Single replica: KC_CACHE=local, no clustering.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: stardelt }
      annotations:
        # Roll the pod when the realm or hostname changes (the import itself
        # only runs while realm `stardelt` does not exist yet).
        checksum/realm: {{ $realm | sha256sum }}
        checksum/hostname: {{ $kcHost | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: "{{ $kc.image.repository }}:{{ $kc.image.tag }}"
          imagePullPolicy: {{ $kc.image.pullPolicy }}
          # Production mode without --optimized (stock image, build step on boot).
          args: ["start", "--import-realm"]
          envFrom:
            - configMapRef: { name: keycloak-env }
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://keycloak-pg-rw:5432/keycloak" }
            - name: KC_DB_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-pg-app, key: username } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-pg-app, key: password } }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_CACHE, value: local }
            - { name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=25" }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
            - name: STARDELT_REALM_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: stardelt-realm-admin, key: password } }
            {{- range list "nova" "superset" "airflow" "jupyterhub" "trino" }}
            - name: {{ printf "STARDELT_%s_CLIENT_SECRET" (upper .) }}
              valueFrom: { secretKeyRef: { name: stardelt-oidc-clients, key: {{ . }} } }
            {{- end }}
            # Outside the loop: `upper` keeps the dash, which is not a valid env
            # name — the realm import expects STARDELT_TRINO_GROUP_SYNC_CLIENT_SECRET.
            - name: STARDELT_TRINO_GROUP_SYNC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: stardelt-oidc-clients, key: trino-group-sync } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml $kc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
{{- end }}
