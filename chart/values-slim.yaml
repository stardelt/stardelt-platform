# Slim overrides for the cheap dev cluster (cx33, 4 vCPU / 8 GB).
# Usage:  helm upgrade --install stardelt chart -n stardelt -f chart/values-slim.yaml
#         (or: make chart-install CHART_EXTRA="-f chart/values-slim.yaml")
#
# Mirrors helm-values/slim/trino.yaml (the `make install-core SLIM=1` overrides)
# on top of chart/values.yaml: smaller Trino heaps so Trino fits next to
# SeaweedFS, CNPG, Lakekeeper and Nova on one 8 GB node. Values files are merged
# key by key, so only the keys below are replaced — everything else keeps the
# default from chart/values.yaml.
#
# Memory budget (platform#54): per-node + headroom must stay well below the
# heap so a single query fails closed instead of OOM-killing the worker.
#   600MB + 450MB = 1050MB <= 1500m, leaving ~450MB for the engine.
trino:
  server:
    workers: 1
    config:
      query:
        maxMemory: "600MB"
    # Restates helm-values/slim/trino.yaml (Helm replaces strings).
    coordinatorExtraConfig: |
      query.max-execution-time=10m
      query.max-run-time=15m

  coordinator:
    jvm:
      maxHeapSize: "1500m"
      gcMethod:
        type: UseG1GC
    config:
      query:
        maxMemoryPerNode: "600MB"
      memory:
        heapHeadroomPerNode: "450MB"
    additionalJVMConfig:
      - "-Xms512m"
      - "-XX:HeapDumpPath=/dumps"
    resources:
      requests: { cpu: "250m", memory: "1800Mi" }
      limits: { memory: "2200Mi" }

  worker:
    jvm:
      maxHeapSize: "1500m"
      gcMethod:
        type: UseG1GC
    config:
      query:
        maxMemoryPerNode: "600MB"
      memory:
        heapHeadroomPerNode: "450MB"
    additionalJVMConfig:
      - "-Xms512m"
      - "-XX:HeapDumpPath=/dumps"
    resources:
      requests: { cpu: "250m", memory: "1800Mi" }
      limits: { memory: "2200Mi" }

# Platform IdP (Keycloak) fits the slim profile as-is: the defaults in
# chart/values.yaml are already single-node sized (Keycloak 512Mi request / 1Gi
# limit, its Postgres 128Mi / 256Mi, ~640Mi requested in total). Enable it with
#   --set identity.mode=platform --set platform.baseDomain=<your domain>
# It stays off here so the slim profile keeps the same shape as install-core.
