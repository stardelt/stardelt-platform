# stardelt platform — umbrella chart values.
#
# This is the declarative counterpart of `make install`: one release instead of
# nine `helm upgrade --install` / `kubectl apply` steps. The per-component
# sources of truth for the Makefile path stay `helm-values/*.yaml` and
# `manifests/*.yaml`; the blocks below mirror them — keep both in sync when a
# value changes (the version pins live in the root Makefile and in Chart.yaml).
#
# Layout rules:
#   - one block per sub-chart, named after the dependency in Chart.yaml, with an
#     `enabled` toggle that Chart.yaml uses as its condition;
#   - core stack on by default (Postgres, SeaweedFS, Lakekeeper, Trino, Nova),
#     heavy components off (Superset, Airflow, JupyterHub) — same shape as
#     `make install-core`;
#   - in-cluster addresses use short service names, which resolve inside the
#     release namespace, so the chart is namespace-agnostic;
#   - `fullnameOverride` keeps the core sub-chart object names identical to a
#     `make install` deployment (`seaweedfs-s3`, `lakekeeper`, `trino`, ...), so
#     Nova, `make pf` and the playground ingresses keep working, and single
#     components can be disabled while the Makefile keeps managing them.
#     The optional components are named partly from the release name
#     (`stardelt-postgresql`, `stardelt-api-server`, ...) because their charts
#     use `.Release.Name` directly — names, not configuration, differ there.
#     A chart install therefore shares object names with `make install`: use one
#     or the other per namespace, never both.

# ===========================================================================
# Platform settings — the knobs an administrator sets for their cluster.
#
# Everything below is optional and off by default: a stock cluster with a
# default StorageClass and no ingress controller installs as-is, and you add
# reachability when you want it. Nothing here is Hetzner-, k3s- or
# ingress-nginx-specific.
# ===========================================================================

platform:
  # Base domain for Nova's deep links and for the ingresses below, e.g.
  # `example.com` → Nova at example.com, Trino at trino.example.com.
  # Empty = Nova shows no external links (it still reports live status).
  baseDomain: ""

ingress:
  # Render Ingress objects for the components this release installs.
  # false = bring your own ingress (or use kubectl port-forward); the Services
  # stay ClusterIP either way.
  enabled: false
  # IngressClass name, e.g. nginx, traefik, alb. Empty = the cluster default.
  className: ""
  annotations: {}
  tls:
    # Requires cert-manager. Leave off when TLS terminates elsewhere (a cloud
    # load balancer, an edge proxy, an existing Certificate).
    enabled: false
    # Name of a cert-manager ClusterIssuer; added as the per-Ingress annotation.
    issuer: ""
    # One secret per host; `{host}` expands to the hostname with dots → dashes.
    secretNameTemplate: "{host}-tls"
  # Per-service host overrides, e.g. { trino: sql.example.net }. Anything not
  # listed is derived from platform.baseDomain and the service's subdomain.
  hosts: {}
  # Components whose own UI/API has no sign-in wired yet (trino, lakekeeper,
  # superset, airflow, jupyterhub). Their Ingress is rendered only when listed
  # here: exposing them bypasses the platform IdP. Nova is always rendered;
  # Keycloak only when identity.mode=platform. Example: exposeUnauthenticated: [trino]
  exposeUnauthenticated: []

storage:
  # StorageClass for the volumes this chart creates itself (the Postgres
  # Cluster). Empty = the cluster default StorageClass, which is what most
  # distributions provide — check with `kubectl get storageclass`.
  #
  # Sub-charts take their own key, because Helm cannot template a values file:
  #   seaweedfs.master.data.storageClass / seaweedfs.volume.dataDirs[0].storageClass
  #   seaweedfs.filer.data.storageClass  / jupyterhub.singleuser.storage.dynamic.storageClass
  # All of them default to "" (= cluster default) in this file.
  className: ""

images:
  # Pull secrets for the stardelt-built images (Nova). Empty works: the published
  # images are public. For a private registry or an air-gap mirror, use
  # Kubernetes' own shape:
  #   pullSecrets:
  #     - name: my-registry-creds
  #
  # Sub-charts take their own key, so a private registry also needs:
  #   trino.imagePullSecrets / lakekeeper.imagePullSecrets / superset.imagePullSecrets
  #   global.imagePullSecrets        (SeaweedFS reads the Helm-standard global)
  pullSecrets: []

identity:
  # Who authenticates users (docs: architecture/identity, the identity contract).
  #   none     — nothing deployed, no ConfigMap; components keep their dev auth.
  #   platform — deploy Keycloak (realm `stardelt`) at id.<platform.baseDomain>
  #              (or ingress.hosts.keycloak) with its own CNPG Postgres, and
  #              publish ConfigMap `stardelt-identity`. Needs platform.baseDomain
  #              and the CNPG operator (cloudnative-pg above, or an existing one).
  #   external — bring your own OIDC provider (Entra ID, Okta, a corporate
  #              Keycloak): deploys nothing, only publishes `stardelt-identity`
  #              from issuerUrl below. Register the clients there yourself.
  mode: none
  # Required for `external`; ignored for `platform` (derived from the host:
  # https://id.<baseDomain>/realms/stardelt).
  issuerUrl: ""
  groupClaim: groups
  adminGroup: stardelt-admins

  keycloak:
    # Equivalent to manifests/keycloak.yaml (+ scripts/identity-bootstrap.sh).
    # Official image, Apache-2.0. Tag mirrors KEYCLOAK_VERSION in the Makefile
    # (scripts/check-version-parity.sh).
    image:
      repository: quay.io/keycloak/keycloak
      tag: "26.8.1"
      pullPolicy: IfNotPresent
    # Small single-node sizing (fits next to install-core on a cx33).
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "1Gi"   }
    # The admin password, the realm `admin` user's password and the client
    # secrets are generated on first install into Secrets keycloak-admin,
    # stardelt-realm-admin and stardelt-oidc-clients, kept across upgrades
    # (lookup) and on uninstall (helm.sh/resource-policy: keep). Nothing here
    # holds a credential.
    postgres:
      instances: 1
      storage:
        size: 1Gi
      resources:
        requests: { cpu: "50m",  memory: "128Mi" }
        limits:   { cpu: "500m", memory: "256Mi" }

# ===========================================================================
# Core stack
# ===========================================================================

cloudnative-pg:
  # CNPG operator. Reconciles the `postgres` Cluster below and installs the
  # CNPG CRDs cluster-wide. Disable when the cluster already runs an operator
  # (the Makefile-managed release `cnpg`, or a platform-wide install).
  enabled: true

postgres:
  # Plain manifest (not a sub-chart): CNPG Cluster backing Lakekeeper's catalog
  # metadata. Equivalent to manifests/cnpg-postgres.yaml.
  # The Cluster is named `lakekeeper-pg` — that name is referenced from
  # `lakekeeper.externalDatabase` below, so change both together.
  enabled: true
  instances: 1
  storage:
    size: 2Gi
  # Continuous WAL archiving plus a daily base backup into the platform's object
  # store — equivalent to manifests/cnpg-postgres.yaml (spec.backup) and
  # manifests/cnpg-backup-schedule.yaml. Needs the destination bucket to exist:
  # the bundled SeaweedFS creates `backups` below, but with
  # `s3Credentials.create=false` (BYO S3) your store must already have it, and
  # the credentials above must be allowed to write there.
  backup:
    # off = no spec.backup and no ScheduledBackup (no WAL archiving at all)
    enabled: true
    # Bucket under `s3Credentials.endpoint` that receives the WAL and base
    # backups. Keep in sync with the `backups` entry in `seaweedfs.s3.createBuckets`.
    bucket: backups
    retentionPolicy: "14d"
    # CloudNativePG cron, seconds first: 02:30 every day.
    schedule: "0 30 2 * * *"
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits:   { cpu: "1",   memory: "512Mi" }

s3Credentials:
  # Secret that every object-storage consumer reads: the SeaweedFS S3 endpoint
  # plus access key / secret key / bucket / region. Equivalent to
  # manifests/s3-credentials.dev.yaml.
  #
  # DEV DEFAULTS — these match the credentials pinned in the `seaweedfs` block
  # below, so a fresh install works out of the box. For anything real, either
  # override all four values, or set `create: false` and create the Secret
  # yourself (see manifests/s3-credentials.example.yaml).
  create: true
  # Renaming requires updating the secretKeyRef entries under `trino.env` and
  # `airflow.extraEnv` too.
  name: stardelt-s3-creds
  accessKey: stardelt-access-key
  secretKey: stardelt-secret-key
  # Rendered with `tpl`, so `{{ .Release.Namespace }}` expands.
  endpoint: "http://seaweedfs-s3.{{ .Release.Namespace }}.svc.cluster.local:8333"
  bucket: lakehouse
  region: us-east-1

seaweedfs:
  # S3-compatible storage for the lakehouse (chart: seaweedfs 4.25.1).
  enabled: true
  # Keep the service names (`seaweedfs-s3`, ...) that the values below and the
  # playground ingresses expect.
  fullnameOverride: seaweedfs

  global:
    seaweedfs:
      # The chart's swap/migration hook needs a cluster-scoped ClusterRole
      # (`seaweedfs-rw-cr`) that grants `pods: delete` in a hardcoded namespace.
      # Cluster-scoped means it can only exist once per cluster, so leaving it on
      # makes a second SeaweedFS release (another namespace, another lakehouse)
      # impossible to install. stardelt expects several instances to coexist, so
      # the default is off; set it to true if you need the chart's migration hook
      # and run a single instance.
      createClusterRole: false

  master:
    replicas: 1
    data:
      type: persistentVolumeClaim
      size: 1Gi
      # Empty = the cluster's default StorageClass.
      storageClass: ""
    defaultReplication: "000"
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits:   { cpu: "1",   memory: "256Mi" }

  volume:
    replicas: 1
    # PVC so the Iceberg data files survive pod restarts. emptyDir wipes on
    # pod restart, which orphans the Iceberg metadata pointing at the files
    # and surfaces as FileNotFoundException on Trino reads.
    dataDirs:
      - name: data
        type: persistentVolumeClaim
        size: 20Gi
        # Empty = the cluster's default StorageClass.
        storageClass: ""
        # Volume slots. The chart's default (0 → auto-configure, 7 on Linux) is a trap
        # on a small install: once the slots are used up, the master cannot create a
        # volume for a *new* collection, and writes to a new bucket block forever —
        # the client sees a hang, the master log says "failed to find writable volumes
        # … Not enough data nodes found", and buckets created earlier keep working.
        maxVolumes: 100
    resources:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "2",    memory: "2Gi"  }

  filer:
    replicas: 1
    data:
      type: persistentVolumeClaim
      size: 1Gi
      # Empty = the cluster's default StorageClass.
      storageClass: ""
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits:   { cpu: "1",   memory: "256Mi" }

  s3:
    enabled: true
    replicas: 1
    port: 8333
    enableAuth: true
    # Pin credentials so they match the `stardelt-s3-creds` Secret instead of
    # auto-generating random ones (see `s3Credentials` above).
    credentials:
      admin:
        accessKey: stardelt-access-key
        secretKey: stardelt-secret-key
    createBuckets:
      - name: lakehouse
        anonymousRead: false
      # Destination for the catalog's continuous backups (`postgres.backup`
      # above). Unused when `postgres.backup.enabled=false`. Renaming this means
      # setting `postgres.backup.bucket` to the same name.
      - name: backups
        anonymousRead: false
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "2",    memory: "1Gi"  }

lakekeeper:
  # Iceberg REST catalog (chart: lakekeeper 0.11.0, appVersion 0.12.2).
  enabled: true
  fullnameOverride: lakekeeper

  # helmWait true so `helm upgrade --wait` blocks until migrations land.
  helmWait: true

  # Bundled postgres OFF → use the `postgres` Cluster above.
  postgresql:
    enabled: false

  externalDatabase:
    type: postgres
    host_read:  lakekeeper-pg-rw
    host_write: lakekeeper-pg-rw
    port: 5432
    database: lakekeeper
    userSecret: lakekeeper-pg-app
    userSecretKey: username
    passwordSecret: lakekeeper-pg-app
    passwordSecretKey: password

  # Bundled OpenFGA OFF → authz backend "allowall" (no real authz yet).
  authz:
    backend: allowall

  internalOpenFGA: false

  catalog:
    replicas: 1
    resources:
      requests: { cpu: "50m",  memory: "256Mi" }
      limits:   { cpu: "1",    memory: "512Mi" }

lakekeeperBootstrap:
  # Plain manifest (not a sub-chart): Job that accepts the Lakekeeper terms of
  # use and creates the default `warehouse` on S3. Idempotent: skips when
  # already bootstrapped, skips warehouse creation on 409 Conflict.
  # Equivalent to manifests/lakekeeper-bootstrap.yaml.
  enabled: true
  image: curlimages/curl:8.10.1
  ttlSecondsAfterFinished: 600
  backoffLimit: 4

trino:
  # MPP SQL engine (chart: trino 1.42.2, appVersion 480).
  #
  # Catalog `warehouse` connects to Lakekeeper (REST Iceberg catalog) and
  # reads/writes Parquet on SeaweedFS via its native S3 filesystem. Credentials
  # come from the `stardelt-s3-creds` Secret via env-var substitution
  # (`${ENV:S3_ACCESS_KEY}`).
  enabled: true
  fullnameOverride: trino

  server:
    workers: 1
    config:
      query:
        # Must satisfy: maxMemory + 30% heap headroom <= max heap. 1200MB + 600MB <= 2GB.
        maxMemory: "1200MB"

  # Trino sits behind an ingress (ingress-nginx) that sets X-Forwarded-For; without
  # this it answers 406 "Server configuration does not allow processing of the
  # X-Forwarded-For header". `server.config` only renders known keys — extra
  # properties must go through `additionalConfigProperties`.
  #
  # Authentication is opt-in and lives in helm-values/trino-identity.yaml, which
  # `make trino` applies when a platform IdP is present (it is written for the
  # per-component install, whose values are flat; the umbrella chart needs the
  # same keys nested under `trino:` — tracked as a follow-up). Without it, Trino
  # accepts anonymous SQL, which is only acceptable for an unreachable dev stack.
  additionalConfigProperties:
    - http-server.process-forwarded=true

  coordinator:
    jvm:
      maxHeapSize: "2G"
      gcMethod:
        type: UseG1GC
    # Cap per-node so it stays well below heap (heap headroom defaults to ~30%).
    additionalJVMConfig:
      - "-Xms1G"
    additionalExposedPorts: {}

  worker:
    jvm:
      maxHeapSize: "2G"
      gcMethod:
        type: UseG1GC
    additionalJVMConfig:
      - "-Xms1G"

  # Pull S3 creds from the stardelt-s3-creds Secret so catalog properties can
  # substitute ${ENV:S3_ACCESS_KEY} / ${ENV:S3_SECRET_KEY}, plus the three
  # variables the OAuth2 overlay reads (helm-values/trino-identity.yaml):
  # the confidential client secret, the coordinator/worker shared secret, and
  # the issuer from the platform identity ConfigMap. Optional, so an install
  # without an IdP renders the same pod.
  env:
    - name: S3_ACCESS_KEY
      valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: access-key } }
    - name: S3_SECRET_KEY
      valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: secret-key } }
    - name: TRINO_CLIENT_SECRET
      valueFrom: { secretKeyRef: { name: stardelt-oidc-clients, key: trino, optional: true } }
    - name: TRINO_INTERNAL_SHARED_SECRET
      valueFrom: { secretKeyRef: { name: trino-internal-secret, key: shared-secret, optional: true } }
    - name: TRINO_OIDC_ISSUER
      valueFrom: { configMapKeyRef: { name: stardelt-identity, key: issuerUrl, optional: true } }

  catalogs:
    warehouse: |
      connector.name=iceberg
      iceberg.catalog.type=rest
      iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
      iceberg.rest-catalog.warehouse=warehouse
      iceberg.rest-catalog.vended-credentials-enabled=false
      fs.native-s3.enabled=true
      s3.endpoint=http://seaweedfs-s3:8333
      s3.region=us-east-1
      s3.path-style-access=true
      s3.aws-access-key=${ENV:S3_ACCESS_KEY}
      s3.aws-secret-key=${ENV:S3_SECRET_KEY}
      # Single-replica SeaweedFS volume server can't sustain Trino's default
      # parallel HTTP range requests (broken pipe / connection reset). Throttle
      # both connection pool and the Iceberg metadata enumeration threads.
      s3.max-connections=16
      iceberg.split-manager-threads=4
      iceberg.metadata.parallelism=2

nova:
  # stardelt Nova — UI + backend in one pod. Equivalent to
  # manifests/nova-deployment.yaml.
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/stardelt/nova
    # `:dev` is a mutable tag; Always re-pulls. Pin by digest for reproducible installs.
    tag: dev
    pullPolicy: Always

  # Per-component override of the global `images.pullSecrets` (platform
  # settings at the top of this file). Unset = use the global default.
  # imagePullSecrets:
  #   - ghcr-creds

  # Rendered with `tpl`, so `{{ .Release.Namespace }}` expands.
  trinoURL: "http://trino.{{ .Release.Namespace }}.svc.cluster.local:8080"
  lakekeeperURL: "http://lakekeeper.{{ .Release.Namespace }}.svc.cluster.local:8181"
  warehouseName: warehouse
  devUser: stardelt-dev
  # Sign-in (contract: docs/architecture/identity).
  #   dev  — no login; what CI, `make demo` and the kind gate rely on.
  #   oidc — Nova is a client of the IdP configured under `identity:` above.
  #          Requires identity.mode=platform (Keycloak) or `external` + issuerUrl;
  #          the render fails fast otherwise instead of crash-looping the pod.
  auth:
    mode: dev
    # Nova's external origin; the IdP redirect URI is <publicUrl>/api/auth/callback.
    # Defaults to https://<nova host> derived from platform.baseDomain.
    publicUrl: ""
    clientId: nova
    scopes: "openid profile email"
    # Generated by the chart when identity.mode != none, and by
    # scripts/identity-bootstrap.sh on the manifest path.
    clientSecret:
      name: stardelt-oidc-clients
      key: nova
    sessionSecret:
      name: stardelt-nova-session
      key: session
  # External base domain for deep-linking platform apps in Nova.
  # Empty = no links. The dev playground sets this to alpha.dev.stardelt.io.
  baseDomain: ""
  logLevel: info,tower_http=info

  resources:
    requests: { cpu: "50m",  memory: "64Mi"  }
    limits:   { cpu: "1",    memory: "256Mi" }

# ===========================================================================
# Heavy components — off by default, same as `make install-core`.
# Enable with `--set <name>.enabled=true` or in your own values file.
#
# Superset and Airflow cannot both be `enabled` in the same release: the
# Superset chart's bundled Redis and the Airflow chart define the same Helm
# template names, so `helm template`/`helm install` fails with an error from the
# Airflow chart (`redis.serviceAccountName`). Enable one here and install the
# other as its own release.
# ===========================================================================

superset:
  # BI / dashboards (chart: superset 0.15.5, appVersion 5.0.0).
  #
  # kind tuning:
  #   - Single replica everywhere; celery-beat + websockets off.
  #   - Bundled Postgres + Redis (Bitnami sub-charts) — could later migrate the
  #     Postgres to CNPG to consolidate, kept bundled for MVP simplicity.
  #   - bootstrapScript installs the `trino` python driver into the running pod
  #     on each startup. For production, bake this into a custom image.
  #   - Talisman / X-Frame-Options disabled so Nova can iframe Superset.
  #     MVP-only: removes click-jacking protection.
  #   - import_datasources.yaml pre-creates the Trino warehouse database
  #     connection so SQL Lab works immediately after install.
  # `fullnameOverride` gives Superset's own objects the same names as a
  # `make install` deployment (`superset`, `superset-worker`, `Service/superset`).
  # The bundled Bitnami Postgres/Redis are release-named instead
  # (`stardelt-postgresql`, `stardelt-redis-master`).
  #
  # May not be enabled together with `airflow.enabled` — see the note above.
  # (Rendering fails with a template error from the Airflow chart.)
  enabled: false
  fullnameOverride: superset

  # Use the stardelt-owned image (images/superset/Dockerfile) which has
  # psycopg2-binary + trino pre-installed in /app/.venv/. The chart's default
  # bootstrap is fine; we just leave the marker file.
  image:
    repository: stardelt/superset
    tag: dev
    pullPolicy: IfNotPresent

  bootstrapScript: |
    #!/bin/bash
    if [ ! -f ~/bootstrap ]; then echo "Running Superset" > ~/bootstrap; fi

  # Allow iframe embedding from Nova (running on a different port locally).
  configOverrides:
    iframe_embedding: |
      TALISMAN_ENABLED = False
      # Flask-AppBuilder also sets X-Frame-Options via WTF_CSRF; suppress.
      HTTP_HEADERS = {}
      # Allow SameSite=None cookies if you ever want cross-site auth.
      SESSION_COOKIE_SAMESITE = "Lax"
      # ENABLE_PROXY_FIX so x-forwarded headers are honored when iframed.
      ENABLE_PROXY_FIX = True

  # No secrets in this file: scripts/app-secrets.sh generates them per cluster
  # (`make chart-install` runs it first) and keeps them across installs. The
  # Superset chart has no `supersetSecretKeySecretName` field and writes
  # `extraSecretEnv` values as literals, so the key goes through extraEnvRaw,
  # which reaches every pod including the init Job.
  extraEnvRaw:
    - name: SUPERSET_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: superset-secret-key
          key: secret-key
    - name: SUPERSET_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: superset-admin
          key: password

  # Pre-import the Trino database connection on init.
  extraConfigs:
    import_datasources.yaml: |
      databases:
      - database_name: Trino Warehouse
        sqlalchemy_uri: trino://stardelt-dev@trino:8080/warehouse
        tables: []

  # init Job creates admin user + imports the datasource above. The chart's
  # `init.adminUser.password` is a literal interpolated into the init script, so
  # the script is overridden (a supported values field) to read the password from
  # SUPERSET_ADMIN_PASSWORD, i.e. the superset-admin Secret. Username/profile are
  # not credentials and stay here.
  init:
    adminUser:
      username: admin
      firstname: stardelt
      lastname: Admin
      email: admin@stardelt.local
    initscript: |
      #!/bin/sh
      set -eu
      echo "Upgrading DB schema..."
      superset db upgrade
      echo "Initializing roles..."
      superset init
      {{ if .Values.init.createAdmin }}
      echo "Creating admin user..."
      superset fab create-admin \
                      --username {{ .Values.init.adminUser.username }} \
                      --firstname {{ .Values.init.adminUser.firstname }} \
                      --lastname {{ .Values.init.adminUser.lastname }} \
                      --email {{ .Values.init.adminUser.email }} \
                      --password "$SUPERSET_ADMIN_PASSWORD" \
                      || true
      {{- end }}
      {{ if .Values.init.loadExamples }}
      echo "Loading examples..."
      superset load_examples
      {{- end }}
      if [ -f "{{ .Values.extraConfigMountPath }}/import_datasources.yaml" ]; then
        echo "Importing database connections.... "
        superset import_datasources -p {{ .Values.extraConfigMountPath }}/import_datasources.yaml
      fi
    loadExamples: false

  # Components
  supersetNode:
    replicas:
      enabled: true
      replicaCount: 1
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits:   { cpu: "2",    memory: "1Gi"  }

  supersetWorker:
    replicas:
      enabled: true
      replicaCount: 1
    # Default celery prefork concurrency = CPU count = 24+ on this host, which
    # OOMs the worker pod (each prefork is a full Python process). Cap to 2.
    command:
      - "/bin/sh"
      - "-c"
      - ". {{ .Values.configMountPath }}/superset_bootstrap.sh; celery --app=superset.tasks.celery_app:app worker --concurrency=2"
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits:   { cpu: "2",    memory: "1Gi"  }

  supersetCeleryBeat:
    enabled: false

  supersetWebsockets:
    enabled: false

  # Bundled deps
  postgresql:
    enabled: true
    primary:
      persistence:
        size: 2Gi
      resources:
        requests: { cpu: "50m", memory: "256Mi" }
        limits:   { cpu: "1",   memory: "512Mi" }

  redis:
    enabled: true
    master:
      persistence:
        size: 1Gi
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
        limits:   { cpu: "1",   memory: "256Mi" }
    replica:
      replicaCount: 0

  service:
    type: ClusterIP
    port: 8088

airflow:
  # helm does not run post-install hooks until every resource of the release is
  # ready, and the Airflow pods wait for the migrations — so on a fresh database,
  # installing with `--wait` (what `make install` and a GitOps toolkit do) deadlocks
  # against these two Jobs as hooks. Upstream requires them off for waiters, and
  # Job specs are immutable anyway, which makes the release un-reinstallable.
  #   https://airflow.apache.org/docs/helm-chart/1.21.0/index.html
  migrateDatabaseJob:
    useHelmHooks: false
    applyCustomEnv: false
  createUserJob:
    useHelmHooks: false
    applyCustomEnv: false
    # createUserJob.defaultUser has no Secret reference: the chart interpolates
    # the literal password into the job args. Replace the args with the same
    # command reading username and password from the airflow-admin Secret.
    env:
      - name: AIRFLOW_ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: airflow-admin
            key: username
      - name: AIRFLOW_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: airflow-admin
            key: password
    args:
      - "bash"
      - "-c"
      - |
        exec airflow users create \
          --role Admin \
          --username "$AIRFLOW_ADMIN_USERNAME" \
          --email admin@stardelt.local \
          --firstname stardelt \
          --lastname Admin \
          --password "$AIRFLOW_ADMIN_PASSWORD"

  # DAG-based orchestrator (chart: airflow 1.21.0, appVersion 3.2.0).
  #
  # kind tuning:
  #   - executor: KubernetesExecutor — no celery, no redis, no workers
  #   - bundled Postgres (Bitnami sub-chart) — single instance, low resources.
  #     Could be migrated to CNPG later; bundled keeps this minimal for now.
  #   - single replicas of api-server / scheduler / dag-processor / triggerer
  #   - heavy resource trims for laptop-scale
  #
  # Names: the Airflow chart builds most object names from the release name
  # (`stardelt-api-server`, `stardelt-scheduler`, `stardelt-postgresql`, ...), so
  # they differ from a `make install` deployment (`airflow-api-server`, ...).
  # Nothing in the chart depends on those names, only the playground ingress does.
  #
  # May not be enabled together with `superset.enabled` — see the note above.
  enabled: false

  executor: KubernetesExecutor

  # stardelt-owned image with DAGs baked in
  images:
    airflow:
      # Same image the manifest path uses: GHCR, tag `demo`, digest-pinned.
      repository: ghcr.io/stardelt/airflow
      tag: demo
      digest: sha256:7691c902240ebdd377914f7e7718409a337f1c27b1ea35961dc11677b08a512b
      pullPolicy: IfNotPresent

  # No secrets in this file: scripts/app-secrets.sh generates them per cluster
  # (`make chart-install` runs it first) and keeps them across installs. Chart
  # fields and the key each one reads:
  #   fernetKeySecretName          → `fernet-key`
  #   apiSecretKeySecretName       → `api-secret-key`   (Airflow 3: [api] secret_key)
  #   webserverSecretKeySecretName → `webserver-secret-key` (Airflow <3 only; the
  #                                  chart ignores it on 3.x, kept so a rollback
  #                                  still finds a stable key)
  #   jwtSecretName                → `jwt-secret`
  # Rotating the fernet key invalidates every connection Airflow encrypted in its
  # metadata DB; rotating the API/JWT keys only ends sessions.
  fernetKeySecretName: airflow-fernet-key
  apiSecretKeySecretName: airflow-webserver-key
  webserverSecretKeySecretName: airflow-webserver-key
  jwtSecretName: airflow-jwt-secret

  # DAGs come from the image, not gitSync
  dags:
    gitSync:
      enabled: false
    persistence:
      enabled: false

  # Logs in emptyDir — fine for kind, lost on pod restart
  logs:
    persistence:
      enabled: false

  # Stateful components turned off
  redis:
    enabled: false

  # Celery workers — KubernetesExecutor doesn't use them; 0 replicas
  workers:
    replicas: 0
    persistence:
      enabled: false

  # Bundled Postgres — single instance, small storage
  postgresql:
    enabled: true
    primary:
      persistence:
        size: 2Gi
      resources:
        requests: { cpu: "50m",  memory: "256Mi" }
        limits:   { cpu: "1",    memory: "512Mi" }

  # Single-replica + smaller resources for each Airflow component
  apiServer:
    replicas: 1
    service:
      type: ClusterIP
    resources:
      requests: { cpu: "100m", memory: "384Mi" }
      limits:   { cpu: "2",    memory: "1Gi"   }

  scheduler:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "384Mi" }
      limits:   { cpu: "2",    memory: "1Gi"   }

  dagProcessor:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: "50m",  memory: "256Mi" }
      limits:   { cpu: "1",    memory: "512Mi" }

  triggerer:
    enabled: true
    replicas: 1
    persistence:
      enabled: false
    resources:
      requests: { cpu: "50m",  memory: "256Mi" }
      limits:   { cpu: "1",    memory: "512Mi" }

  # Plain-value envs on every Airflow container (including spawned K8s task pods).
  env:
    - name: CATALOG_URI
      value: http://lakekeeper:8181/catalog
    - name: CATALOG_WAREHOUSE
      value: warehouse
    - name: YEARS
      value: "2023"

  # Secret-backed envs use extraEnv (templated string accepting valueFrom).
  extraEnv: |
    - name: S3_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: stardelt-s3-creds
          key: endpoint
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: stardelt-s3-creds
          key: access-key
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: stardelt-s3-creds
          key: secret-key
    - name: S3_REGION
      valueFrom:
        secretKeyRef:
          name: stardelt-s3-creds
          key: region

jupyterhub:
  # Embedding in Nova. JupyterHub 5 refuses framing by default
  # (`Content-Security-Policy: frame-ancestors 'none'`), so Nova's Notebooks page shows a
  # notice quoting that header instead of a blank frame. To let Nova embed the hub, allow
  # exactly its origin (values files are not templated, so write your domain out):
  #
  #   hub:
  #     config:
  #       JupyterHub:
  #         tornado_settings:
  #           headers:
  #             Content-Security-Policy: "frame-ancestors 'self' https://<baseDomain>; report-uri /hub/security/csp-report"
  #
  # A notebook is not a dashboard: whoever controls the embedding origin can clickjack
  # the hub, which is why this is an explicit value rather than a default.
  # Multi-user notebooks (chart: jupyterhub 4.4.3, appVersion 5.5.3).
  #
  # Sign-in is OIDC against the platform IdP — the realm's `jupyterhub` client
  # (chart/files/keycloak-realm.json), redirect `/hub/oauth_callback`. No password is
  # shipped: the issuer comes from ConfigMap `stardelt-identity` and the client secret
  # from Secret `stardelt-oidc-clients` (key `jupyterhub`), both rendered above when
  # identity.mode is not `none`. With identity.mode=none the hub starts and signs
  # nobody in. Ephemeral per-user storage, small resources so it fits next to the core.
  #
  # Names come from JupyterHub's own default `fullnameOverride: ""`, which
  # produces unprefixed objects (`hub`, `proxy-public`) — the same names a
  # `make install` deployment creates, so the playground ingress keeps working.
  # Do not set fullnameOverride here: the chart prefixes everything with it.
  enabled: false

  hub:
    # Values files are not templated, so the identity contract reaches the hub
    # through the environment and `extraConfig` turns it into OIDC endpoints.
    # `optional: true`: those objects exist only when identity.mode is not `none`,
    # and a missing one must not keep the hub from starting.
    extraEnv:
      STARDELT_OIDC_ISSUER_URL:
        valueFrom:
          configMapKeyRef:
            name: stardelt-identity
            key: issuerUrl
            optional: true
      STARDELT_OIDC_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: stardelt-oidc-clients
            key: jupyterhub
            optional: true
    extraConfig:
      10-oidc: |
        import os

        # Derived from the identity contract's issuer URL, never written out here.
        _issuer = os.environ.get("STARDELT_OIDC_ISSUER_URL", "").rstrip("/")
        if _issuer:
            c.GenericOAuthenticator.authorize_url = _issuer + "/protocol/openid-connect/auth"
            c.GenericOAuthenticator.token_url = _issuer + "/protocol/openid-connect/token"
            c.GenericOAuthenticator.userdata_url = _issuer + "/protocol/openid-connect/userinfo"

            # Keycloak must be told the public callback. Left to itself the hub
            # advertises http://proxy-public/hub/oauth_callback — its internal
            # service name, which Keycloak has not registered, so the login dies as
            # invalid_redirect_uri before a code is issued. Host convention here is
            # jupyter.<base>, and the base is the issuer host minus "id.".
            _host = _issuer.split("://", 1)[-1].split("/", 1)[0] if _issuer else ""
            _base = _host.split(".", 1)[1] if "." in _host else ""
            _callback = os.environ.get("STARDELT_HUB_OAUTH_CALLBACK_URL", "")
            if not _callback and _base:
                _callback = "https://jupyter." + _base + "/hub/oauth_callback"
            if _callback:
                c.GenericOAuthenticator.oauth_callback_url = _callback

        _secret = os.environ.get("STARDELT_OIDC_CLIENT_SECRET", "").strip()
        if _secret:
            c.GenericOAuthenticator.client_secret = _secret

      # The signed-in user's own token, inside the spawned notebook: the
      # access token JupyterHub keeps (auth_state) is copied into the pod's
      # environment as TRINO_TOKEN, and the quickstart reads it. The token's
      # 8-hour lifetime is a property of the realm's `jupyterhub` client
      # (chart/files/keycloak-realm.json), not of this hook.
      20-notebook-identity: |
        def _trino_token(spawner, auth_state):
            token = (auth_state or {}).get("access_token")
            if token:
                spawner.environment["TRINO_TOKEN"] = token

        c.Authenticator.enable_auth_state = True
        c.Spawner.auth_state_hook = _trino_token
        # A fresh token before every (re)spawn, so a server restarted after the
        # token aged out starts with the refresh token's new access token.
        c.OAuthenticator.refresh_pre_spawn = True

        # A hub user row that no longer validates — a username removed from
        # Keycloak, or a NULL name left behind by the hub's SQLite database
        # under concurrent writes — otherwise crashes the hub on *every* start
        # (init_spawners iterates the row and dies on the missing name). This is
        # JupyterHub's documented remedy: drop the invalid row and let the user
        # sign in again.
        c.Authenticator.delete_invalid_users = True
    config:
      JupyterHub:
        authenticator_class: generic-oauth
      GenericOAuthenticator:
        client_id: jupyterhub
        # oauth_callback_url is set explicitly in `10-oidc` above: JupyterHub's
        # derivation yields the internal service name, which Keycloak rejects.
        login_service: Keycloak
        # One identity: /hub/login goes straight to Keycloak instead of a button.
        auto_login: true
        username_claim: preferred_username
        scope: ["openid", "profile", "email"]
        # The realm's `jupyterhub` client maps `groups` into userinfo (full path
        # off); oauthenticator 17 gates on JupyterHub groups, hence manage_groups.
        manage_groups: true
        auth_state_groups_key: oauth_user.groups
        # Default-closed: only the platform admin group signs in.
        # Two groups may use notebooks: platform admins, and everyone the realm puts
        # in `stardelt-users` — the realm's default group, so a user created in the
        # console joins it automatically and can open a notebook without an admin.
        allowed_groups: [stardelt-admins, stardelt-users]
        admin_groups: ["stardelt-admins"]
    resources:
      requests: { cpu: "50m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }

  proxy:
    service:
      type: ClusterIP
    chp:
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
        limits:   { cpu: "500m", memory: "256Mi" }
    traefik:
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
        limits:   { cpu: "500m", memory: "256Mi" }

  singleuser:
    # stardelt's image (images/jupyter/Dockerfile): scipy-notebook + trino,
    # pyspark[connect], pandas, pyarrow, and the warehouse quickstart under
    # /opt/stardelt/notebooks. Built and published by CI (Image workflow); make
    # the GHCR package public or keep ghcr-creds (ghcr-pull-secret.sh) available
    # in the namespace.
    image:
      name: ghcr.io/stardelt/jupyter-singleuser
      # The tag stays for readability; the digest is what the kubelet actually
      # pulls. `make pin-images` only covers Deployments, so spawned single-user
      # pods are pinned here by hand: after a merge publishes a new image,
      # resolve `dev` again and bump the digest.
      tag: "dev@sha256:bedf8973b9940698ff98a35c1074ce0aa7caa4b4137100424da9971635373c05"
      pullSecrets:
        - name: ghcr-creds
    defaultUrl: /lab
    # Where the notebook finds the warehouse. Public HTTPS rather than the
    # in-cluster Service: over plain HTTP Trino only accepts its password
    # authenticator, so a bearer token needs TLS (issue #80 adds TLS to the
    # coordinator). Values files are not templated, so deployments on another
    # domain override this.
    extraEnv:
      TRINO_URL: https://trino.alpha.dev.stardelt.io:443
    # Seed the quickstart into the home directory on every spawn, never
    # overwriting a user's edited copy (`cp -n`); postStart always exits 0 so a
    # failing hook cannot make kubelet restart the container in a loop.
    lifecycleHooks:
      postStart:
        exec:
          command:
            - bash
            - -c
            - cp -n /opt/stardelt/notebooks/*.ipynb "$HOME/" || true
    startTimeout: 300
    memory:
      limit: 1G
      guarantee: 256M
    cpu:
      limit: 1
      guarantee: 0.1
    # Ephemeral per-user storage (dev). For persistent volumes set `type: dynamic`
    # and, to pick a class, `dynamic.storageClass` (empty = the default StorageClass).
    storage:
      type: none
