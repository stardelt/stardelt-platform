name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint YAML files and shell scripts
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (yamllint + shell + renovate.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # yamllint comes from PyPI, not the Ubuntu mirror: on 2026-11-11 every run in
      # flight failed here with `Temporary failure resolving 'azure.archive.ubuntu.com'`
      # before a single check ran. shellcheck ships in the runner image; apt is only the
      # fallback for the day it does not.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install yamllint + shellcheck
        run: |
          pip install yamllint
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint helm-values + umbrella chart values YAML
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 140}}}' \
            helm-values/ chart/Chart.yaml chart/values.yaml chart/values-slim.yaml

      - name: Lint manifests YAML
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 140}}}' \
            manifests/

      - name: Validate renovate.json
        run: jq -e . renovate.json > /dev/null

      - name: Chart pins agree (Makefile vs chart/Chart.yaml)
        run: bash scripts/check-version-parity.sh

      - name: CloudNativePG stays below 1.30 until the backup-plugin migration (platform#192)
        run: python3 scripts/check_cnpg_pin.py

      - name: No committed default credentials
        run: bash scripts/check-no-default-secrets.sh

      - name: Airflow image pin (Deployments and task pods run the same digest)
        run: bash scripts/check-airflow-pin.sh

      - name: Notebook config agrees with itself (values, culler, Nova's env)
        run: make check-hub-config

      - name: Lint shell scripts (bash -n + shellcheck)
        run: make lint

      - name: Unit tests — the access sync job's rules and Lakekeeper calls
        run: python3 -m unittest discover -s scripts/tests -v

  # ---------------------------------------------------------------------------
  # helm template each chart with its values file
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          # Exact version: a partial pin like "3.19.x" makes setup-helm resolve a
          # version through get.helm.sh metadata, which has been returning a
          # literal `helm-v3.19.x-…` URL and failing the whole job.
          version: "3.19.0"

      # Helm's repository cache holds the downloaded tarballs, so a warm cache
      # makes the template steps independent of github.com releases.
      - name: Cache the Helm chart cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/helm
          key: helm-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Add helm repos
        run: |
          helm repo add cnpg           https://cloudnative-pg.github.io/charts
          helm repo add seaweedfs      https://seaweedfs.github.io/seaweedfs/helm
          helm repo add lakekeeper     https://lakekeeper.github.io/lakekeeper-charts/
          helm repo add openfga        https://openfga.github.io/helm-charts
          helm repo add trino          https://trinodb.github.io/charts
          helm repo add apache-airflow https://airflow.apache.org
          helm repo add superset       https://apache.github.io/superset
          helm repo add jupyterhub     https://jupyterhub.github.io/helm-chart/
          bash scripts/retry.sh helm repo update --fail-on-repo-update-fail

      - name: helm template — cnpg
        run: |
          bash scripts/retry.sh helm template cnpg cnpg/cloudnative-pg \
            --version 0.28.2 \
            --namespace stardelt > /dev/null

      - name: helm template — seaweedfs
        run: |
          bash scripts/retry.sh helm template seaweedfs seaweedfs/seaweedfs \
            --version 4.25.1 \
            --namespace stardelt \
            -f helm-values/seaweedfs.yaml > /dev/null

      - name: helm template — lakekeeper
        run: |
          bash scripts/retry.sh helm template lakekeeper lakekeeper/lakekeeper \
            --version 0.11.0 \
            --namespace stardelt \
            -f helm-values/lakekeeper.yaml > /dev/null

      # The bridge's catalog decision table (platform#359): renders the chart with
      # this repo's values file, then asks the resulting policy every question
      # against a stub Lakekeeper that counts calls. `make test-bridge-policies`
      # runs the same thing locally; it needs the lakekeeper repo and the opa
      # binary, which this job has (and the lint job does not).
      - name: Bridge decision-table policy (stub Lakekeeper + opa eval)
        run: |
          # The OPA the chart's bridge sidecar runs (openpolicyagent/opa:1.16.1).
          bash scripts/retry.sh curl -sSfL -o "$RUNNER_TEMP/opa" \
            https://github.com/open-policy-agent/opa/releases/download/v1.16.1/opa_linux_amd64_static
          chmod +x "$RUNNER_TEMP/opa"
          "$RUNNER_TEMP/opa" version
          OPA="$RUNNER_TEMP/opa" bash scripts/test-bridge-policies.sh

      - name: helm template — openfga
        run: |
          bash scripts/retry.sh helm template openfga openfga/openfga \
            --version 0.2.62 \
            --namespace stardelt \
            -f helm-values/openfga.yaml > /tmp/openfga.yaml
          # The datastore Secret is CNPG's `openfga-pg-app`, read on key `uri`
          # (manifests/openfga-pg.yaml); a chart that reads another key would
          # crash-loop at install time, not here.
          grep -A4 'OPENFGA_DATASTORE_URI' /tmp/openfga.yaml | grep -q 'name: "openfga-pg-app"'
          grep -A6 'OPENFGA_DATASTORE_URI' /tmp/openfga.yaml | grep -q 'key: uri'
          # migrationType=initContainer: the migrate step is an init container of
          # the serving pod, not the chart's separate wait-image Job.
          grep -q 'name: migrate-database' /tmp/openfga.yaml
          ! grep -q 'kind: Job' /tmp/openfga.yaml

      - name: helm template — trino
        run: |
          bash scripts/retry.sh helm template trino trino/trino \
            --version 1.45.0 \
            --namespace stardelt \
            -f helm-values/trino.yaml > /dev/null

      - name: helm template — trino identity overlay (preview UI off, #181)
        run: |
          bash scripts/retry.sh helm template trino trino/trino \
            --version 1.45.0 \
            --namespace stardelt \
            -f helm-values/trino.yaml \
            -f helm-values/trino-identity.yaml > /tmp/trino-identity.yaml
          test "$(grep -c 'web-ui.legacy.enabled=true' /tmp/trino-identity.yaml)" = 1
          # access rules (#181, #363): `catalogs` + `queries` + `tables` +
          # `impersonation`. `system`, `tpch` and `tpcds` are administrator-only
          # (first rule admin, second rule none, third the catch-all — without
          # it every managed catalog would be denied for everyone). The runtime
          # tables stay denied, and the catch-all is still LAST in `tables`.
          # `impersonation` (#310) has exactly one rule: only the Superset service
          # account, only UUID principals — never `.*`, never an admin or a service
          # account name.
          python3 - <<'PY'
          import json, re, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/trino-identity.yaml')) if d]
          cm = next(d for d in docs if d.get('kind') == 'ConfigMap' and d['metadata']['name'] == 'trino-access-control-volume-coordinator')
          rules = json.loads(cm['data']['rules.json'])
          assert sorted(rules) == ['catalogs', 'impersonation', 'queries', 'tables'], sorted(rules)
          catalogs = rules['catalogs']
          assert catalogs == [
              {'group': 'stardelt-admins', 'allow': 'all'},
              {'catalog': '(system|tpch|tpcds)', 'allow': 'none'},
              {'allow': 'all'},
          ], catalogs
          denied = [name for name in ('system', 'tpch', 'tpcds', 'warehouse', 'shared', 'bronze', 'silver', 'gold')
                    if re.fullmatch(catalogs[1]['catalog'], name)]
          assert denied == ['system', 'tpch', 'tpcds'], denied
          if catalogs[-1] != {'allow': 'all'}:
              raise AssertionError('the last catalogs rule must be the catch-all')
          assert rules['impersonation'] == [{'original_user': 'superset', 'new_user': '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', 'allow': True}], rules['impersonation']
          tables = rules['tables']
          assert set(tables[-1]) == {'privileges'} and 'SELECT' in tables[-1]['privileges'], 'last tables rule must be the catch-all'
          assert any(r.get('privileges') == [] and r.get('schema') == 'runtime' for r in tables[:-1]), 'runtime tables must be denied'
          # The switch (platform#311): two access controls, the bridge's properties
          # file, and the principal the catalog's role assignees are keyed on.
          cm = next(d for d in docs if d.get('kind') == 'ConfigMap' and d['metadata']['name'] == 'trino-coordinator')
          cfg = cm['data']['config.properties']
          assert 'access-control.config-files=/etc/trino/access-control.properties,/etc/trino/access-control-opa.properties' in cfg, \
              'both access controls must be listed, or the bridge never runs'
          assert 'http-server.authentication.oauth2.principal-field=sub' in cfg, 'the engine user must be the Keycloak sub'
          assert cm['data']['access-control.properties'].splitlines()[0] == 'access-control.name=file', \
              'the chart file must still be the file authorizer'
          opa = cm['data']['access-control-opa.properties'].splitlines()
          assert 'access-control.name=opa' in opa, opa
          assert 'opa.policy.uri=http://lakekeeper-opa.stardelt.svc.cluster.local:8282/v1/data/stardelt/allow' in opa, opa
          # `batched-uri` is the Trino 480 property; `batch-uri` (the spike's typo) is ignored.
          assert 'opa.policy.batched-uri=http://lakekeeper-opa.stardelt.svc.cluster.local:8282/v1/data/stardelt/batch' in opa, opa
          assert not any(line.startswith('opa.batch-uri') for line in opa), opa
          # Resource groups (#313): the file manager reads the document CronJob
          # access-sync writes, mounted as a directory from ConfigMap `trino-warehouses`.
          # The chart's own `resourceGroups` block stays unset — with it, the chart would
          # render `resource-groups.properties` and a volume of its own, pointing at a
          # file nothing writes.
          assert cm['data']['resource-groups.properties'].splitlines() == [
              'resource-groups.configuration-manager=file',
              'resource-groups.config-file=/etc/trino/warehouses/resource-groups.json',
          ], cm['data']['resource-groups.properties']
          assert 'resource-groups.' not in cfg, 'the chart must not own the resource-groups properties'
          dep = next(d for d in docs if d.get('kind') == 'Deployment' and d['metadata']['name'] == 'trino-coordinator')
          pod = dep['spec']['template']['spec']
          volumes = {v['name']: v for v in pod['volumes']}
          assert volumes['trino-warehouses']['configMap']['name'] == 'trino-warehouses', volumes.get('trino-warehouses')
          mounts = {m['name']: m['mountPath'] for m in pod['containers'][0]['volumeMounts']}
          assert mounts.get('trino-warehouses') == '/etc/trino/warehouses', mounts
          annotations = dep['spec']['template']['metadata']['annotations']
          # The file manager loads the file once (spike platform#273 R6): the ConfigMap
          # has to restart the coordinator. The group file must NOT: it reloads in 30 s
          # and a restart would drop running queries for nothing.
          assert 'trino-warehouses' in annotations.get('configmap.reloader.stakater.com/reload', ''), annotations
          assert 'trino-group-file' not in annotations.get('configmap.reloader.stakater.com/reload', ''), annotations
          PY

      - name: helm template — trino rollback overlay (file rules only, #311)
        run: |
          bash scripts/retry.sh helm template trino trino/trino \
            --version 1.45.0 \
            --namespace stardelt \
            -f helm-values/trino.yaml \
            -f helm-values/trino-identity.yaml \
            -f helm-values/trino-identity-file-only.yaml > /tmp/trino-rollback.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/trino-rollback.yaml')) if d]
          cm = next(d for d in docs if d.get('kind') == 'ConfigMap' and d['metadata']['name'] == 'trino-coordinator')
          cfg = cm['data']['config.properties']
          # One access control (the chart's file), the same principal as the switched
          # state, and the coordinator properties the overlay has to repeat (Helm
          # replaces strings). The principal stays `sub` since platform#312: the group
          # file is written by CronJob access-sync by `sub`, so a rollback that changed
          # the principal would leave every group lookup matching nobody.
          assert 'access-control.config-files=/etc/trino/access-control.properties\n' in cfg + '\n', cfg
          assert 'access-control-opa.properties' not in cfg.split('access-control.config-files=')[1].splitlines()[0], cfg
          assert 'http-server.authentication.oauth2.principal-field=sub' in cfg
          # A rollback takes the bridge out of the chain; it must not take the resource
          # groups out (platform#313) — the classes are routing, not authorization.
          assert 'resource-groups.config-file=/etc/trino/warehouses/resource-groups.json' in cm['data'].get('resource-groups.properties', ''), cm['data'].get('resource-groups.properties')
          for needed in ('http-server.https.keystore.key=', 'http-server.authentication.oauth2.issuer=',
                         'http-server.authentication.allow-insecure-over-http=false', 'query.max-run-time=15m'):
              assert needed in cfg, needed
          PY

      - name: helm template — airflow
        run: |
          bash scripts/retry.sh helm template airflow apache-airflow/airflow \
            --version 1.22.0 \
            --namespace stardelt \
            -f helm-values/airflow.yaml > /dev/null

      - name: helm template — superset
        run: |
          bash scripts/retry.sh helm template superset superset/superset \
            --version 0.15.5 \
            --namespace stardelt \
            -f helm-values/superset.yaml > /dev/null

      - name: helm template — jupyterhub
        run: |
          bash scripts/retry.sh helm template jupyterhub jupyterhub/jupyterhub \
            --version 4.4.5 \
            --namespace stardelt \
            -f helm-values/jupyterhub.yaml > /dev/null

      - name: helm dependency update — umbrella chart
        # The same GitHub release downloads that answer 504 in the `helm template`
        # steps (see scripts/retry.sh), so this step retries too. Found when the
        # run after #646 failed here at 11:05Z: #645 wrapped `helm template` and
        # left this step bare, so main was still red on the same 504.
        run: bash scripts/retry.sh helm dependency update chart
      - name: Nova's permissions agree (manifest and umbrella chart, platform#473)
        run: bash scripts/check-nova-rbac-parity.sh
      - name: helm lint + template — umbrella chart
        run: |
          helm lint chart
          helm template stardelt chart -n stardelt > /dev/null
          # The Spark runtime catalogue reaches the operator path (platform#809 slice 4a).
          helm template stardelt chart -n stardelt | grep -q 'name: stardelt-spark-runtimes'
          helm template stardelt chart -n stardelt --set superset.enabled=true > /dev/null
          helm template stardelt chart -n stardelt -f chart/values-slim.yaml > /dev/null
          # chart-path catalog backups (#51): the Cluster declares the
          # barmanObjectStore config, exactly one ScheduledBackup renders, and
          # both follow the configured bucket and the enabled switch.
          # (Count `destinationPath: s3://` rather than `barmanObjectStore`:
          # the CNPG sub-chart renders CRD schemas that mention the latter.)
          helm template stardelt chart -n stardelt | grep -q 'destinationPath: s3://backups/'
          # (two: lakekeeper-pg-daily and, since Nova's state store, nova-pg-daily)
          test "$(helm template stardelt chart -n stardelt | grep -c '^kind: ScheduledBackup' || true)" = 2
          test "$(helm template stardelt chart -n stardelt --set postgres.backup.enabled=false \
                    | grep -c -e '^kind: ScheduledBackup' -e 'destinationPath: s3://' || true)" = 0
          helm template stardelt chart -n stardelt --set postgres.backup.bucket=my-backups \
            | grep -q 'destinationPath: s3://my-backups/'
          # Nova's state store (stardelt-nova#103): its own Cluster, the URL from the generated
          # Secret, and `nova.database.enabled=false` removes all of it.
          helm template stardelt chart -n stardelt | grep -q 'secretKeyRef: { name: nova-pg-app, key: uri }'
          helm template stardelt chart -n stardelt | grep -q '^  name: nova-pg$'
          test "$(helm template stardelt chart -n stardelt --set nova.database.enabled=false | grep -c 'nova-pg' || true)" = 0
          # Query-log feed (stardelt-nova#116): Nova's internal collector port, not in any Ingress.
          helm template stardelt chart -n stardelt | grep -q 'name: internal'
          helm template stardelt chart -n stardelt | grep -q 'name: NOVA_EVENTS_TOKEN'
          # identity.mode: none (default above), platform (Keycloak), external (issuer only)
          helm template stardelt chart -n stardelt -f chart/values-slim.yaml \
            --set identity.mode=platform --set platform.baseDomain=example.com --set ingress.enabled=true > /dev/null
          # client trino accepts the administrators' port-forward origin (#181): exactly one callback URI
          test "$(helm template stardelt chart -n stardelt --set identity.mode=platform --set platform.baseDomain=example.com \
                    | grep -c 'https://localhost:8443/oauth2/callback')" = 1
          helm template stardelt chart -n stardelt \
            --set identity.mode=external --set identity.issuerUrl=https://login.example.com/realms/x > /dev/null
          # invalid identity settings must fail the render (`!` alone is ignored by `set -e`)
          for bad in "identity.mode=external" "identity.mode=platform" "identity.mode=bogus"; do
            if helm template stardelt chart -n stardelt --set "$bad" > /dev/null 2>&1; then
              echo "expected render failure for --set $bad" >&2; exit 1
            fi
          done
          # ingress.exposeUnauthenticated (#49): unauthenticated UIs render only when asked.
          n=$(helm template stardelt chart -n stardelt --set ingress.enabled=true --set platform.baseDomain=example.com | grep -c '^kind: Ingress')
          [ "$n" = 1 ] || { echo "expected only the nova Ingress, got $n" >&2; exit 1; }
          n=$(helm template stardelt chart -n stardelt --set ingress.enabled=true --set platform.baseDomain=example.com --set 'ingress.exposeUnauthenticated={trino}' | grep -c '^kind: Ingress')
          [ "$n" = 2 ] || { echo "expected nova + trino Ingresses, got $n" >&2; exit 1; }
          # Trino Ingress (#181): only the SQL-client paths, never "/" (nova's Ingress is the one "/").
          helm template stardelt chart -n stardelt --set ingress.enabled=true --set platform.baseDomain=example.com \
            --set 'ingress.exposeUnauthenticated={trino}' > /tmp/umbrella-trino-ingress.yaml
          test "$(grep -c 'path: "/"$' /tmp/umbrella-trino-ingress.yaml)" = 1
          grep -q 'path: "/v1/statement"' /tmp/umbrella-trino-ingress.yaml
          grep -q 'path: "/oauth2"' /tmp/umbrella-trino-ingress.yaml
          # ingress.allowedCidrs (#427): the source-range annotation on every rendered Ingress, none by default;
          # an entry that is not a CIDR fails the render.
          helm template stardelt chart -n stardelt --set ingress.enabled=true --set platform.baseDomain=example.com \
            --set 'ingress.exposeUnauthenticated={trino}' --set 'ingress.allowedCidrs={203.0.113.0/24,198.51.100.7/32}' > /tmp/umbrella-allow.yaml
          test "$(grep -c 'whitelist-source-range: "203.0.113.0/24,198.51.100.7/32"' /tmp/umbrella-allow.yaml)" = 2
          if grep -q 'whitelist-source-range' /tmp/umbrella-trino-ingress.yaml; then
            echo "no allowedCidrs must mean no source-range annotation" >&2; exit 1
          fi
          if helm template stardelt chart -n stardelt --set ingress.enabled=true --set platform.baseDomain=example.com \
               --set 'ingress.allowedCidrs={not-a-cidr}' > /dev/null 2>&1; then
            echo "expected render failure for a non-CIDR allowedCidrs entry" >&2; exit 1
          fi
          # S3 credentials (#100): one generated key pair in both Secrets, and SeaweedFS
          # reads it instead of generating a secret of its own.
          helm template stardelt chart -n stardelt > /tmp/umbrella.yaml
          python3 - <<'PY'
          import json, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/umbrella.yaml')) if d]
          sec = {d['metadata']['name']: d for d in docs if d.get('kind') == 'Secret'}
          c = sec['stardelt-s3-creds']['stringData']
          k = json.loads(sec['seaweedfs-s3-config']['stringData']['seaweedfs_s3_config'])['identities'][0]['credentials'][0]
          assert (c['access-key'], c['secret-key']) == (k['accessKey'], k['secretKey']) and len(c['access-key']) >= 16, 'S3 key pairs differ or are too short'
          PY
          ! grep -q 'name: seaweedfs-s3-secret' /tmp/umbrella.yaml || { echo "SeaweedFS must read seaweedfs-s3-config, not generate its own secret" >&2; exit 1; }

  # ---------------------------------------------------------------------------
  # Notebook helper (stardelt/stardelt-python): the library has its own
  # repository; check it out at the release the platform pins, install it the
  # way the notebook image does and run its tests
  # ---------------------------------------------------------------------------
  notebook-helper:
    name: Notebook helper (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned library ref
        id: pin
        # The Makefile holds the pin (STARDELT_LIB_REF); the tag names the
        # release it belongs to.
        run: echo "ref=$(make -s print-stardelt-lib-ref)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned library release
        uses: actions/checkout@v7
        with:
          repository: stardelt/stardelt-python
          ref: ${{ steps.pin.outputs.ref }}
          path: stardelt-python

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the library at the pinned ref
        # The same install the notebook image runs (images/jupyter/Dockerfile),
        # so this job proves the pin resolves and the library works at it.
        run: |
          # `[jupyter]` on purpose: that is what images/jupyter/Dockerfile installs,
          # and since v0.1.5 the library's test_sqlmagic imports IPython at module
          # level — a bare install fails collection here while the image works.
          pip install "stardelt[jupyter] @ git+https://github.com/stardelt/stardelt-python@${{ steps.pin.outputs.ref }}"
          pip install pytest

      - name: Run the library's tests
        # From the library root: the suite imports `tests.test_stardelt`, which
        # only resolves with that directory on sys.path (no tests/__init__.py).
        run: |
          cd stardelt-python
          python -m pytest tests -q
