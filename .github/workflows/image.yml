name: Image

# Build and publish the images the platform runs that upstream does not ship:
#   ghcr.io/stardelt/superset           baseline Superset + psycopg2-binary, trino
#   ghcr.io/stardelt/jupyter-singleuser scipy-notebook + trino, pyspark, pandas,
#                                       pyarrow and the warehouse quickstart
#   ghcr.io/stardelt/spark              Apache Spark + the Iceberg runtime and
#                                       AWS bundle
#
# On main this pushes `dev` plus an immutable `sha-<short>` tag. Pin the digest
# (printed in the job summary) when rolling the cluster.
#
# Any change under images/ runs every job in this workflow; each job's BuildKit
# cache is scoped, so rebuilding an untouched image is quick.
#
# Pull requests build without pushing.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["images/**", ".github/workflows/image.yml"]
  pull_request:
    branches: [main]
    paths: ["images/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  superset:
    name: Build and push ghcr.io/stardelt/superset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/stardelt/superset
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/superset
          file: images/superset/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: github.event_name != 'pull_request'
        # Values go through env, not `${{ }}` inside the script: tag names are
        # attacker-influenced strings and must never be spliced into shell source.
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ghcr.io/stardelt/superset"
            echo
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  jupyter:
    name: Build and push ghcr.io/stardelt/jupyter-singleuser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/stardelt/jupyter-singleuser
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/jupyter
          file: images/jupyter/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jupyter
          cache-to: type=gha,mode=max,scope=jupyter

      - name: Job summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ghcr.io/stardelt/jupyter-singleuser"
            echo
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  spark:
    name: Build and push ghcr.io/stardelt/spark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/stardelt/spark
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/spark
          file: images/spark/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ghcr.io/stardelt/spark"
            echo
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
