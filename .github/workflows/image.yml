name: Image

# Build and publish ghcr.io/stardelt/superset — the baseline Superset image plus
# the python drivers upstream does not ship (psycopg2-binary, trino).
#
# On main this pushes `dev` plus an immutable `sha-<short>` tag. Pin the digest
# (printed in the job summary) when rolling the cluster.
#
# Pull requests that touch images/superset build without pushing.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["images/superset/**", ".github/workflows/image.yml"]
  pull_request:
    branches: [main]
    paths: ["images/superset/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  superset:
    name: Build and push ghcr.io/stardelt/superset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/stardelt/superset
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/superset
          file: images/superset/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ghcr.io/stardelt/superset"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
