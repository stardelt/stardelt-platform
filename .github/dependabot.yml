version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /images/superset
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
