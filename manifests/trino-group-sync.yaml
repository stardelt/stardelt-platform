# Continuous Trino group-file sync (platform#167).
#
# Group membership for the query rules reaches Trino through ConfigMap
# `trino-group-file`, which `make trino` writes once from the live realm's
# `stardelt-admins` members (scripts/sync-trino-groups.sh). The coordinator
# re-reads the mounted file every 30s, so no restart is ever needed — but
# nothing rewrote it between applies, leaving a removed admin's all-queries
# view in place with no bound. This CronJob closes that gap: every 5 minutes it
# re-runs the sync and writes the ConfigMap when membership changed,
# idempotently and without printing principals (counts only).
#
# The principals it writes are Keycloak user ids (`id`), matching Trino's
# `principal-field=sub` (platform#311): the file is compared against
# `current_user`, so the shape has to follow the engine's principal field.
# `GROUP_PRINCIPAL=username` is the pre-switch shape (`make
# catalog-enforce-rollback` passes it to the script, by hand — this CronJob is
# only correct with the switch on).
#
# Authentication, least-privilege by design:
#   * Keycloak: the dedicated confidential client `trino-group-sync`
#     (service-account only, every interactive flow off), granted exactly
#     `view-users` on `realm-management` — the minimum that opens
#     `group-by-path` + `groups/{id}/members` (probed: query-users +
#     query-groups answer 403). A dedicated client rather than an existing
#     identity because every existing one is either broader (the master
#     credential owns all realms; the realm admin manages users) or has no
#     admin-API access at all. Converged by
#     scripts/keycloak-sync-trino-group-sync-client.sh; its secret is key
#     `trino-group-sync` in Secret `stardelt-oidc-clients`.
#   * Kubernetes: ServiceAccount `trino-group-sync` may only `get` that one
#     Secret and `get/update/patch` that one ConfigMap (resourceNames-scoped).
#     Creation is deliberately absent: a resourceNames-scoped `create` never
#     authorizes, and the ConfigMap is owned by `make trino`.
#
# The job code (scripts/trino-group-sync-job.py, standard library only) reaches
# the Pod on a ConfigMap volume that `make trino` refreshes from the file on
# every apply, so the script has one source of truth and the image stays the
# stock `python:slim-bookworm` pin below.
#
#   kubectl -n stardelt create job --from=cronjob/trino-group-sync trino-group-sync-now
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trino-group-sync
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trino-group-sync
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  # The client's own secret — read-only, this Secret only.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["stardelt-oidc-clients"]
    verbs: ["get"]
  # The group file — converge in place, never create (see the header).
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["trino-group-file"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trino-group-sync
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
subjects:
  - kind: ServiceAccount
    name: trino-group-sync
    namespace: stardelt
roleRef:
  kind: Role
  name: trino-group-sync
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trino-group-sync
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  # 5 minutes: membership changes land within 5 (cron) + ~2 (kubelet remount) +
  # 0.5 (Trino re-read) minutes — inside the ticket's 10-minute bound.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels: { app.kubernetes.io/part-of: stardelt }
        spec:
          restartPolicy: Never
          serviceAccountName: trino-group-sync
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: sync
              image: python:3.13.16-slim-bookworm
              command: ["python3", "/opt/job/job.py"]
              env:
                # Namespace-agnostic: the Pod reports where it runs.
                - name: NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                - name: KEYCLOAK_URL
                  value: "http://keycloak:8080"
                - name: REALM
                  value: "stardelt"
                - name: ADMIN_GROUP
                  value: "stardelt-admins"
                - name: GROUP_CONFIGMAP
                  value: "trino-group-file"
                # The principal the file has to match (platform#311): the Keycloak
                # user id, because Trino authenticates with
                # http-server.authentication.oauth2.principal-field=sub once the
                # catalog enforces permissions (`make catalog-enforce`). A file of
                # usernames while Trino compares ids finds no group for anyone, so
                # an administrator silently loses the query visibility below.
                - name: GROUP_PRINCIPAL
                  value: "sub"
              volumeMounts:
                - { name: job-script, mountPath: /opt/job, readOnly: true }
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits: { cpu: "500m", memory: "256Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: job-script
              configMap: { name: trino-group-sync-script, defaultMode: 0444 }
