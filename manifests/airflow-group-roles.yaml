# Sync Airflow FAB roles for Pipeline/ServicePrincipal owner groups (platform#477 S1b).
#
# Creates (idempotently) role stardelt-group-<ownerGroup> for every non-empty
# spec.ownerGroup found on Pipelines and ServicePrincipals in this namespace.
# The loader (S2) grants DAG-level permissions to that role via access_control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-group-roles
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-group-roles
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
subjects:
  - kind: ServiceAccount
    name: airflow-group-roles
    namespace: stardelt
roleRef:
  kind: Role
  name: airflow-pipeline-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: airflow-group-roles
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: stardelt
            app.kubernetes.io/name: airflow-group-roles
        spec:
          restartPolicy: Never
          serviceAccountName: airflow-group-roles
          automountServiceAccountToken: true
          # Pod Security `restricted` (platform#1096 question 5): the image runs as
          # 50000 already (measured 2026-11-13); declare it so the pod passes the
          # profile without an image change.
          securityContext:
            runAsNonRoot: true
            runAsUser: 50000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: >-
                ghcr.io/stardelt/airflow:demo@sha256:35ddabc1294a513bf9a2dcf7402b52a33df0e2984db9334b9270c4f9db8b5e61
              command: ["python", "/opt/scripts/sync.py"]
              env:
                - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
                  valueFrom:
                    secretKeyRef:
                      name: airflow-metadata
                      key: connection
                - name: AIRFLOW__API__SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: airflow-webserver-key
                      key: api-secret-key
                - name: AIRFLOW__API_AUTH__JWT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: airflow-jwt-secret
                      key: jwt-secret
                - name: AIRFLOW__CORE__FERNET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: airflow-fernet-key
                      key: fernet-key
                # The chart sets the FAB auth manager for the Airflow deployments; this pod mounts no
                # airflow.cfg, so without it `get_application_builder()` hands back
                # AirflowSecurityManagerV2, which has no find_role/create_permission/
                # add_permission_to_role — the sync then dies and converges no role (platform#994,
                # design/airflow-access.md S1b).
                - name: AIRFLOW__CORE__AUTH_MANAGER
                  value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
              volumeMounts:
                - name: scripts
                  mountPath: /opt/scripts
                  readOnly: true
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits: { cpu: "500m", memory: "256Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: scripts
              configMap:
                name: airflow-group-roles-script
                defaultMode: 0444
