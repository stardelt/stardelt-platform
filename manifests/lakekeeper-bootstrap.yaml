# Bootstrap Lakekeeper: accept ToS + create the default `warehouse` pointing
# at SeaweedFS / S3. Idempotent: skips bootstrap if already bootstrapped, skips
# warehouse create if it already exists (409 Conflict). If it exists, its storage
# credential is refreshed from the S3 Secret, so a rotated key takes effect.
#
# Catalog sign-in (platform#283): every management call carries a client-credentials
# token for `svc-catalog-bootstrap` — the Job's own identity (platform#282). Lakekeeper
# still runs `allowall` and ignores the header; the Job is made correct now so the
# enforcement step can refuse an anonymous call. Without an IdP the Secret and the
# issuer are absent and the Job keeps calling anonymously, as it does today.
apiVersion: batch/v1
kind: Job
metadata:
  name: lakekeeper-bootstrap
  namespace: stardelt
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      # Only talks to Lakekeeper over HTTP: no Kubernetes API token needed.
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: curlimages/curl:8.10.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          env:
            - name: LK
              value: http://lakekeeper:8181
            - name: S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: endpoint } }
            - name: S3_BUCKET
              valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: bucket } }
            - name: S3_REGION
              valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: region } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: access-key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: secret-key } }
            # Token endpoint = <issuer>/protocol/openid-connect/token; the client
            # credentials themselves are mounted as files below, so neither the id nor
            # the secret reaches argv, an environment dump or a log line.
            - name: CATALOG_OIDC_ISSUER
              valueFrom: { configMapKeyRef: { name: stardelt-identity, key: issuerUrl, optional: true } }
          volumeMounts:
            - name: catalog-client
              mountPath: /var/run/secrets/catalog-client
              readOnly: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              umask 077
              # Catalog sign-in (platform#283, step 2 of the catalog turn-on). The Job
              # asks the realm for a token as `svc-catalog-bootstrap` and sends it on
              # every management call; Lakekeeper ignores it until it validates tokens,
              # but an exchange that fails must not fall back to anonymous silently.
              # The credential is read from the mounted Secret files (`--data-urlencode
              # NAME@file` never puts it in argv), the token goes to a private file and
              # reaches curl through `-H @file`, and the EXIT trap below removes both.
              AUTH_ARGS=""
              CRED_DIR=/var/run/secrets/catalog-client
              TOKEN_FILE=/tmp/catalog-token.json
              AUTH_FILE=/tmp/catalog-auth-header
              trap 'rm -f "$TOKEN_FILE" "$AUTH_FILE" /tmp/cred.json /tmp/wh.json' EXIT
              if [ -s "$CRED_DIR/client-id" ] && [ -s "$CRED_DIR/client-secret" ] && [ -n "${CATALOG_OIDC_ISSUER:-}" ]; then
                echo "▶ requesting a client-credentials token for $(cat "$CRED_DIR/client-id")"
                if ! curl -fsS -X POST "${CATALOG_OIDC_ISSUER%/}/protocol/openid-connect/token" \
                    --data-urlencode grant_type=client_credentials \
                    --data-urlencode client_id@"$CRED_DIR/client-id" \
                    --data-urlencode client_secret@"$CRED_DIR/client-secret" \
                    -o "$TOKEN_FILE"; then
                  echo "the realm's token endpoint refused svc-catalog-bootstrap — run 'make sync-catalog-clients'" >&2
                  exit 1
                fi
                TOKEN=$(sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$TOKEN_FILE" | head -n 1)
                if [ -z "$TOKEN" ]; then
                  echo "the token response carried no access_token — is svc-catalog-bootstrap enabled?" >&2
                  exit 1
                fi
                printf 'Authorization: Bearer %s\n' "$TOKEN" > "$AUTH_FILE"
                EXPIRES=$(sed -n 's/.*"expires_in"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$TOKEN_FILE" | head -n 1)
                echo "✓ token acquired for svc-catalog-bootstrap${EXPIRES:+ (expires in ${EXPIRES}s)}"
                AUTH_ARGS="-H @$AUTH_FILE"
              else
                echo "▶ no svc-catalog-bootstrap client or realm issuer — calling the management API anonymously"
              fi
              echo "▶ checking Lakekeeper info"
              INFO=$(curl -fsS $AUTH_ARGS "$LK/management/v1/info")
              echo "$INFO"
              BOOTSTRAPPED=$(echo "$INFO" | grep -o '"bootstrapped":[^,}]*' | cut -d: -f2 | tr -d ' "')

              if [ "$BOOTSTRAPPED" = "true" ]; then
                echo "✓ already bootstrapped"
              else
                echo "▶ bootstrapping"
                curl -fsS $AUTH_ARGS -X POST -H 'Content-Type: application/json' \
                  -d '{"accept-terms-of-use":true,"is-operator":true}' \
                  "$LK/management/v1/bootstrap"
                echo
                echo "✓ bootstrapped"
              fi

              echo "▶ checking for existing 'warehouse'"
              EXISTING=$(curl -fsS $AUTH_ARGS "$LK/management/v1/warehouse" || echo '{"warehouses":[]}')
              echo "$EXISTING"
              if echo "$EXISTING" | grep -q '"name":"warehouse"'; then
                echo "✓ warehouse 'warehouse' already exists — refreshing its storage credential"
                WH_ID=$(echo "$EXISTING" | grep -o '"id":"[^"]*","warehouse-id":"[^"]*","name":"warehouse"' | head -1 | cut -d'"' -f4)
                if [ -z "$WH_ID" ]; then
                  echo "could not read the id of warehouse 'warehouse'" >&2
                  exit 1
                fi
                # Same care as below: the payload carries the S3 secret key, and the
                # EXIT trap at the top removes the file (umask 077 is set there too).
                cat > /tmp/cred.json <<EOF
                {
                  "new-storage-credential": {
                    "type": "s3",
                    "credential-type": "access-key",
                    "aws-access-key-id": "$S3_ACCESS_KEY",
                    "aws-secret-access-key": "$S3_SECRET_KEY"
                  }
                }
              EOF
                curl -fsS $AUTH_ARGS -X POST -H 'Content-Type: application/json' \
                  -d @/tmp/cred.json \
                  "$LK/management/v1/warehouse/$WH_ID/storage-credential"
                echo
                echo "✓ storage credential refreshed"
                exit 0
              fi

              echo "▶ creating warehouse 'warehouse' on s3://$S3_BUCKET ($S3_ENDPOINT)"
              # The payload carries the S3 secret key: keep the file private, remove it
              # on exit, and never print it (job logs are readable by anyone with pods/log).
              cat > /tmp/wh.json <<EOF
              {
                "warehouse-name": "warehouse",
                "project-id": "00000000-0000-0000-0000-000000000000",
                "storage-profile": {
                  "type": "s3",
                  "bucket": "$S3_BUCKET",
                  "key-prefix": "warehouse",
                  "endpoint": "$S3_ENDPOINT",
                  "region": "$S3_REGION",
                  "path-style-access": true,
                  "flavor": "minio",
                  "sts-enabled": false,
                  "remote-signing-enabled": false
                },
                "storage-credential": {
                  "type": "s3",
                  "credential-type": "access-key",
                  "aws-access-key-id": "$S3_ACCESS_KEY",
                  "aws-secret-access-key": "$S3_SECRET_KEY"
                }
              }
              EOF
              curl -fsS $AUTH_ARGS -X POST -H 'Content-Type: application/json' \
                -d @/tmp/wh.json \
                "$LK/management/v1/warehouse"
              echo
              echo "✓ warehouse created"
      volumes:
        # Client credentials for svc-catalog-bootstrap (platform#283): mounted as files,
        # so the Job never puts the id or the secret into argv. Optional — a cluster
        # without an IdP has no Secret and the Job calls the management API anonymously,
        # as it did before the catalog's authentication existed.
        - name: catalog-client
          secret:
            secretName: svc-catalog-bootstrap
            optional: true
