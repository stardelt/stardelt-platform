# Development S3 credentials for the lakehouse storage layer.
#
# These MUST match the pinned credentials in helm-values/seaweedfs.yaml
# (s3.credentials.admin). They are not secrets — dev-only, single-node, no
# external exposure.
apiVersion: v1
kind: Secret
metadata:
  name: stardelt-s3-creds
  namespace: stardelt
type: Opaque
stringData:
  access-key: stardelt-access-key
  secret-key: stardelt-secret-key
  endpoint:   http://seaweedfs-s3.stardelt.svc.cluster.local:8333
  bucket:     lakehouse
  region:     us-east-1
