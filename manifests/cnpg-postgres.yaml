# CloudNative-PG Cluster backing Lakekeeper's catalog metadata.
# Single-instance for kind MVP. The operator creates secrets
# `lakekeeper-pg-app` (user creds) and `lakekeeper-pg-superuser` automatically.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lakekeeper-pg
  namespace: stardelt
spec:
  instances: 1
  # Pinned, and deliberately older than the other three: pg_upgrade 17 -> 18
  # fails on this database (it stops while restoring schemas). Until that is
  # understood, an unpinned manifest would track the operator's default and
  # retry the upgrade on every apply.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie
  storage:
    size: 2Gi
  # Continuous backup into the platform's own object store: barman-cloud streams
  # the WAL and CNPG adds base backups on the schedule in
  # `cnpg-backup-schedule.yaml`, so a lost volume is recoverable to a point in
  # time without any external service. Point `endpointURL`/`destinationPath` at
  # your own S3 bucket for production (`backups` must exist and the credentials
  # must be allowed to write to it).
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://backups/
      endpointURL: http://seaweedfs-s3.stardelt.svc.cluster.local:8333
      s3Credentials:
        accessKeyId:
          name: stardelt-s3-creds
          key: access-key
        secretAccessKey:
          name: stardelt-s3-creds
          key: secret-key
        region:
          name: stardelt-s3-creds
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: lakekeeper
      owner: lakekeeper
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits:   { cpu: "1",   memory: "2Gi" }
  # 100 (the default) was filled by clients stuck in authentication during the
  # 2026-10-31 outage; keep an explicit ceiling with headroom instead.
  postgresql:
    parameters:
      max_connections: "150"
  # PostgreSQL has to finish recovery before the instance manager can reach it.
  # The default budget restarts it mid-recovery, which never converges.
  probes:
    startup:
      failureThreshold: 120
