# CloudNative-PG Cluster backing Lakekeeper's catalog metadata.
# Single-instance for kind MVP. The operator creates secrets
# `lakekeeper-pg-app` (user creds) and `lakekeeper-pg-superuser` automatically.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lakekeeper-pg
  namespace: stardelt
spec:
  instances: 1
  # Pinned, and deliberately older than the other three: pg_upgrade 17 -> 18
  # fails on this database (it stops while restoring schemas). Until that is
  # understood, an unpinned manifest would track the operator's default and
  # retry the upgrade on every apply.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie
  storage:
    size: 2Gi
  # Backup through the barman-cloud plugin (CloudNativePG 1.30; the native
  # `barmanObjectStore` is removed in 1.32). The plugin reads
  # ObjectStore/lakekeeper-pg-backups from `manifests/cnpg-objectstore.yaml`
  # (installed by `make step-barman-cloud-plugin`); point that store's
  # `destinationPath`/`endpointURL` at your own bucket for production.
  backup:
    retentionPolicy: "14d"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: lakekeeper-pg-backups
  bootstrap:
    initdb:
      database: lakekeeper
      owner: lakekeeper
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits:   { cpu: "1",   memory: "2Gi" }
  # 100 (the default) was filled by clients stuck in authentication during the
  # 2026-10-31 outage; keep an explicit ceiling with headroom instead.
  postgresql:
    parameters:
      max_connections: "150"
  # PostgreSQL has to finish recovery before the instance manager can reach it.
  # The default budget restarts it mid-recovery, which never converges.
  probes:
    startup:
      failureThreshold: 120
