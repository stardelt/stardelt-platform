# Generic S3 credentials Secret for the lakehouse storage layer.
# Currently backed by SeaweedFS (see deploy/helm-values/seaweedfs.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: stardelt-s3-creds
  namespace: stardelt
type: Opaque
stringData:
  access-key: <YOUR_S3_ACCESS_KEY>
  secret-key: <YOUR_S3_SECRET_KEY>
  endpoint:   http://seaweedfs-s3.stardelt.svc.cluster.local:8333
  bucket:     lakehouse
  region:     us-east-1
