# Generic S3 credentials Secret for the lakehouse storage layer.
# Currently backed by SeaweedFS (see deploy/helm-values/seaweedfs.yaml). The
# Secret name is kept as `ozone-s3-creds` for now to avoid touching every
# downstream consumer; rename once Ozone is fully retired from the codebase.
apiVersion: v1
kind: Secret
metadata:
  name: ozone-s3-creds
  namespace: stardelt
type: Opaque
stringData:
  access-key: <YOUR_S3_ACCESS_KEY>
  secret-key: <YOUR_S3_SECRET_KEY>
  endpoint:   http://seaweedfs-s3.stardelt.svc.cluster.local:8333
  bucket:     lakehouse
  region:     us-east-1
