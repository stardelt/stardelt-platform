# Sync OpenBao group policies for connection secrets (platform#483).
#
# Discovers owner groups from Catalog grants, Pipeline.spec.ownerGroup and
# ServicePrincipal.spec.ownerGroup; excludes stardelt-users and stardelt-admins.
# Runs every 5 minutes and calls scripts/openbao-connections.sh idempotently.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-group-policies
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-group-policies
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["stardelt.io"]
    resources: ["catalogs", "pipelines", "serviceprincipals"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-init"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["openbao-0"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["openbao-0"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-group-policies
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
subjects:
  - kind: ServiceAccount
    name: openbao-group-policies
    namespace: stardelt
roleRef:
  kind: Role
  name: openbao-group-policies
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-group-policies
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: stardelt
            app.kubernetes.io/name: openbao-group-policies
        spec:
          restartPolicy: Never
          serviceAccountName: openbao-group-policies
          automountServiceAccountToken: true
          containers:
            - name: sync
              image: alpine/k8s:1.37.1
              command: ["bash", "/opt/scripts/sync.sh"]
              env:
                - name: NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                # The ConfigMap mounts the policy files flat in /opt/scripts.
                - name: POLICIES
                  value: /opt/scripts
              volumeMounts:
                - name: scripts
                  mountPath: /opt/scripts
                  readOnly: true
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits: { cpu: "500m", memory: "256Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: scripts
              configMap:
                name: openbao-group-policies-script
                defaultMode: 0555
