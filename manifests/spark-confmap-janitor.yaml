# Delete leftover Spark Connect executor ConfigMaps (platform#1173).
#
# Each Spark Connect session creates one `spark-exec-<16 hex>-conf-map` ConfigMap and Spark's
# own cleanup is a collection delete, which the driver's Role deliberately lacks
# (platform#1121). This janitor runs with its own identity and deletes only by name, so the
# driver's rights do not change and the blast radius is this namespace's ConfigMaps whose name
# matches the Spark shape.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-confmap-janitor
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-confmap-janitor
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
# No `deletecollection` on purpose: that verb is what platform#1121 removed from the driver.
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-confmap-janitor
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
subjects:
  - kind: ServiceAccount
    name: spark-confmap-janitor
    namespace: stardelt
roleRef:
  kind: Role
  name: spark-confmap-janitor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spark-confmap-janitor
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: stardelt
            app.kubernetes.io/name: spark-confmap-janitor
        spec:
          restartPolicy: Never
          serviceAccountName: spark-confmap-janitor
          automountServiceAccountToken: true
          # Pod Security `restricted` (platform#1096 question 5): alpine/k8s runs as
          # root by default, so the UID is chosen here. 65534 is measured to work for the
          # discovery reads and for `kubectl delete configmap <name>` with this Job's
          # ServiceAccount (2026-11-13). HOME is /tmp in the container below: the image has
          # no writable home for that user and kubectl writes its cache there.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: janitor
              image: alpine/k8s:1.37.1
              command: ["bash", "/opt/scripts/spark-confmap-janitor.sh"]
              env:
                - name: NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: scripts
                  mountPath: /opt/scripts
                  readOnly: true
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits: { cpu: "500m", memory: "256Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: scripts
              configMap:
                name: spark-confmap-janitor-script
                defaultMode: 0555
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-confmap-janitor-script
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
data: {}
