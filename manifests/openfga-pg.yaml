# CloudNative-PG Cluster backing OpenFGA, the catalog's permission store
# (platform#302, authz 1/8). A database of its own, not a second schema in
# `lakekeeper-pg`: the permission tuples outlive a catalog re-bootstrap, and a
# restart of one store must not take the other down.
#
# Single-instance on the dev node. The operator creates Secrets
# `openfga-pg-app` (the credentials OpenFGA reads; key `uri` is the full DSN)
# and `openfga-pg-superuser` automatically. OpenFGA is not wired to Lakekeeper
# yet — the values still say `authz.backend: allowall` (see `helm-values/openfga.yaml`).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openfga-pg
  namespace: stardelt
spec:
  instances: 1
  storage:
    size: 1Gi
  # Same continuous backup as the catalog's Postgres: barman-cloud streams the
  # WAL and `openfga-pg-daily` (cnpg-backup-schedule.yaml) adds base backups
  # into s3://backups/openfga-pg/, so a lost volume is recoverable to a point in
  # time without any external service. Point `endpointURL`/`destinationPath` at
  # your own S3 bucket for production (`backups` must exist and the credentials
  # must be allowed to write to it).
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://backups/
      endpointURL: http://seaweedfs-s3.stardelt.svc.cluster.local:8333
      s3Credentials:
        accessKeyId:
          name: stardelt-s3-creds
          key: access-key
        secretAccessKey:
          name: stardelt-s3-creds
          key: secret-key
        region:
          name: stardelt-s3-creds
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: openfga
      owner: openfga
  # The store holds relationship tuples and the authorization model, nothing
  # else, so it stays small: 256Mi request, 512Mi ceiling on the single node.
  #
  # The ceiling is 512Mi, not 256Mi, because the base backup runs *inside* the
  # instance's cgroup: barman-cloud reads the whole database and compresses it,
  # and at 256Mi the kernel OOM-killed the instance manager mid-backup ("signal:
  # killed" / "instance manager was restarted during backup on pod
  # openfga-pg-1"). Every failed backup then left the last successful one
  # older than the coverage window (`make verify-backups-all` failed on
  # openfga-pg-1), and the restarts took the catalog's permission store down
  # with them — Lakekeeper answers 503 while OpenFGA's datastore bounces, and
  # the access-sync tick then fails. lakekeeper-pg has had 512Mi all along and
  # backs up fine.
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits:   { cpu: "1",   memory: "512Mi" }
