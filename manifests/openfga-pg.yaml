# CloudNative-PG Cluster backing OpenFGA, the catalog's permission store
# (platform#302, authz 1/8). A database of its own, not a second schema in
# `lakekeeper-pg`: the permission tuples outlive a catalog re-bootstrap, and a
# restart of one store must not take the other down.
#
# Single-instance on the dev node. The operator creates Secrets
# `openfga-pg-app` (the credentials OpenFGA reads; key `uri` is the full DSN)
# and `openfga-pg-superuser` automatically. OpenFGA is not wired to Lakekeeper
# yet — the values still say `authz.backend: allowall` (see `helm-values/openfga.yaml`).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openfga-pg
  namespace: stardelt
spec:
  instances: 1
  # Pinned: without this an apply tracks the operator default, which silently
  # starts a major upgrade the next time the operator ships one.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  storage:
    size: 1Gi
  # Backup through the barman-cloud plugin (CloudNativePG 1.30; the native
  # `barmanObjectStore` is removed in 1.32). The plugin reads
  # ObjectStore/openfga-pg-backups from `manifests/cnpg-objectstore.yaml`
  # (installed by `make step-barman-cloud-plugin`); point that store's
  # `destinationPath`/`endpointURL` at your own bucket for production.
  backup:
    retentionPolicy: "14d"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: openfga-pg-backups
  bootstrap:
    initdb:
      database: openfga
      owner: openfga
  # The store holds relationship tuples and the authorization model, nothing
  # else, so it stays small: 128Mi request, 256Mi ceiling on the single node.
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits:   { cpu: "1",   memory: "2Gi" }
  # 100 (the default) was filled by clients stuck in authentication during the
  # 2026-10-31 outage; keep an explicit ceiling with headroom instead.
  postgresql:
    parameters:
      max_connections: "150"
  # PostgreSQL has to finish recovery before the instance manager can reach it.
  # The default budget restarts it mid-recovery, which never converges.
  probes:
    startup:
      failureThreshold: 120
