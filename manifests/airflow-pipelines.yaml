# Read access to `Pipeline` resources for the Airflow pods that run the pipeline loader
# (scheduled jobs phase J0, platform#118; stardelt-demos dags/pipeline_loader.py).
#
# The dag-processor lists the resources to build one DAG per `Pipeline`; a KubernetesExecutor
# task pod parses the same DAG file before it runs a task, so its ServiceAccount needs the same
# read access. Nothing here can create, change or delete anything, and the Role is limited
# to this namespace. Applied by `make install` after the Airflow release.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pipeline-reader
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["stardelt.io"]
    resources: ["pipelines"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pipeline-reader
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
subjects:
  - kind: ServiceAccount
    name: airflow-dag-processor
    namespace: stardelt
  - kind: ServiceAccount
    name: airflow-worker
    namespace: stardelt
roleRef:
  kind: Role
  name: airflow-pipeline-reader
  apiGroup: rbac.authorization.k8s.io
