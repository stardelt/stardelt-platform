# Spark — heavy compute over the same Iceberg tables Trino reads
# (master spec §5 plug matrix #14, P2).
#
# Shape: one Deployment runs the Spark Connect server as a long-running driver
# with Kubernetes as the cluster manager. Executors are pods the driver creates
# on demand and releases when a query is done (dynamic allocation), so an idle
# platform pays for the driver only — not for a second scheduler and a worker
# JVM that a single-node cluster cannot use for anything.
#
# Why not the Apache Spark Kubernetes Operator (yet): it is the right controller
# once several Spark applications share a cluster, and it is where the stardelt
# operator's Workspace/Pipeline reconciliation will point. On this 16 GB shared
# node its controller alone requests 2 GiB by default, permanently, to manage a
# single long-running app. The CRD path is the explicit follow-up (see README).
#
# Why not a standalone master + worker: on one node they add two permanent JVMs
# and a second scheduler without adding isolation. Kubernetes already schedules,
# and every executor pod carries its own resource envelope.
#
# No Ingress, by design: Spark Connect has no built-in authentication
# (https://spark.apache.org/docs/4.1.3/spark-connect-overview.html#client-application-authentication),
# so it stays ClusterIP-only. Notebooks, Nova and scheduled jobs reach
#   sc://spark-connect.stardelt.svc.cluster.local:15002
# There is deliberately no static catalog here: the catalog is per person, and
# the notebook helper configures it with the person's token when it creates the
# session (images/jupyter/stardelt, platform#317).
#
# Two S3 clients live here, with separate credentials. Iceberg's S3FileIO reads
# the platform's own storage with the Secret key the executors carry; Hadoop's
# S3A reads *public* buckets only, pinned to the anonymous provider, so the
# platform key can never sign an S3A request (platform#347). S3A is for public
# datasets (NOAA GHCN, Ookla, ...), not for private buckets and not for the
# lakehouse — that data is read through Trino or an Iceberg table.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-connect
  namespace: stardelt
  labels: { app.kubernetes.io/name: spark-connect, app.kubernetes.io/part-of: stardelt }
---
# The driver creates/deletes executor pods through the Kubernetes scheduler
# backend, so it needs exactly that: manage pods in its own namespace. Services
# are for the driver endpoint if this ever moves to cluster mode; configmaps for
# Spark's own cluster-mode resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-connect
  namespace: stardelt
  labels: { app.kubernetes.io/name: spark-connect, app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-connect
  namespace: stardelt
  labels: { app.kubernetes.io/name: spark-connect, app.kubernetes.io/part-of: stardelt }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-connect
subjects:
  - kind: ServiceAccount
    name: spark-connect
    namespace: stardelt
---
# The Spark configuration. Executors inherit it from the driver; only the
# driver's own address (spark.driver.host) is added at runtime by the image's
# entrypoint, because it is the pod IP.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-connect-config
  namespace: stardelt
  labels: { app.kubernetes.io/name: spark-connect, app.kubernetes.io/part-of: stardelt }
data:
  spark-defaults.conf: |
    # --- Kubernetes as the cluster manager ---------------------------------
    spark.master                                            k8s://https://kubernetes.default.svc
    spark.kubernetes.namespace                              stardelt
    # Executors are built from the same image as the driver: Spark 4.1 plus the
    # Iceberg runtime and AWS bundle (images/spark/Dockerfile).
    # Single space before the digest: the pinned reference is 136 characters,
    # just inside the 140 the YAML lint allows.
    spark.kubernetes.container.image ghcr.io/stardelt/spark:dev@sha256:185bd2115ac518cb9c18338babdd359902fc732df2a6e0de40defc2b4bd94b51
    spark.kubernetes.container.image.pullPolicy             IfNotPresent
    spark.kubernetes.container.image.pullSecrets            ghcr-creds
    spark.kubernetes.authenticate.executor.serviceAccountName spark-connect
    spark.kubernetes.executor.podNamePrefix                 stardelt-spark
    # S3 credentials reach every executor by Secret reference, never through a
    # config file. S3FileIO's default credentials chain reads these variables.
    spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID     stardelt-s3-creds:access-key
    spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY stardelt-s3-creds:secret-key

    # --- Sizing on the shared 16 GB node ------------------------------------
    # Driver: 1g heap, 3 GiB container limit; about 0.7 GiB of a busy driver is off-heap Arrow/Netty buffers (README has the budget table).
    # Executors: 1 core + 1g heap + 384m overhead each, at most two at a time,
    # scaled to zero when idle.
    spark.driver.memory                                     1g
    # A collect()/toPandas() result above 512m fails instead of filling the driver heap.
    spark.driver.maxResultSize                              512m
    # Free a finished job's broadcasts and metadata sooner than the 30min default.
    spark.cleaner.periodicGC.interval                       5min
    spark.executor.memory                                   1g
    spark.executor.memoryOverhead                           384m
    spark.executor.cores                                    1
    spark.dynamicAllocation.enabled                         true
    spark.dynamicAllocation.shuffleTracking.enabled         true
    spark.dynamicAllocation.minExecutors                    0
    spark.dynamicAllocation.initialExecutors                0
    spark.dynamicAllocation.maxExecutors                    2
    spark.dynamicAllocation.executorIdleTimeout             60s
    # Shuffle tracking (there is no external shuffle service) keeps an executor
    # until its shuffle data is no longer needed — by default *forever*, so one
    # GROUP BY would hold ~0.7 GiB on this node for the life of the driver.
    # Expire it: recomputing a small shuffle is cheaper than a resident executor.
    spark.dynamicAllocation.shuffleTracking.timeout         180s
    # Small cluster, small tables: Spark's 200-partition default would spend
    # more time scheduling than scanning.
    spark.sql.shuffle.partitions                            8
    spark.ui.enabled                                        false

    # --- Spark Connect endpoint --------------------------------------------
    spark.connect.grpc.binding.address                      0.0.0.0
    spark.connect.grpc.binding.port                         15002

    # --- Iceberg: one catalog per person, configured by the client ----------
    # Only the Iceberg extensions are static. The catalogs and the token are
    # session configuration: `stardelt.spark()` (images/jupyter/stardelt) asks
    # Trino which catalogs the signed-in person may see, then passes one catalog
    # configuration block with that person's token to the session it creates.
    # Lakekeeper, the authority, decides what the token may read.
    #
    # S3 stays platform-side: the executor Secret references above are the only
    # data credentials, and the driver signs its own S3 requests with them. A
    # vended-credential catalog is platform#272's follow-up, not this change.
    spark.sql.extensions                                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

    # --- Public S3 over S3A: anonymous reads only ---------------------------
    # `spark.read.parquet("s3a://<public bucket>/...")` in a notebook; `s3://`
    # is the same filesystem under the other scheme. Both are needed because
    # user code and public dataset examples use either form.
    #
    # The credentials provider is the point of this block: S3A's default chain
    # would pick up AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — the executors'
    # platform key — and sign with it. Anonymous is forced instead, so S3A can
    # only read what the whole internet can read. A private bucket fails with an
    # access error; the platform bucket (`lakehouse`) is not readable this way
    # (use Trino or an Iceberg table, where the catalog's grants apply).
    #
    # No fs.s3a.endpoint: S3A talks to AWS and resolves the bucket's region, so
    # buckets in any region work. The Spark pods have internet egress (no
    # NetworkPolicy on them — they are not part of the umbrella chart); no new
    # egress rule or Secret is added by this block.
    spark.hadoop.fs.s3a.impl                                org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3.impl                                 org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.aws.credentials.provider            org.apache.hadoop.fs.s3a.AnonymousAWSCredentialsProvider
    spark.hadoop.fs.s3a.connection.ssl.enabled              true
    spark.hadoop.fs.s3a.path.style.access                   false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-connect
  namespace: stardelt
  labels: { app.kubernetes.io/name: spark-connect, app.kubernetes.io/part-of: stardelt }
spec:
  replicas: 1
  # Sessions live in this driver; two of them would also share the executor
  # pod-name prefix. Replace, never surge.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app.kubernetes.io/name: spark-connect }
  template:
    metadata:
      labels: { app.kubernetes.io/name: spark-connect, app.kubernetes.io/part-of: stardelt }
      # Reloader restarts the driver when the S3 key changes
      # (helm-values/reloader.yaml): the executors read it from a Secret reference.
      annotations:
        secret.reloader.stakater.com/reload: "stardelt-s3-creds"
    spec:
      serviceAccountName: spark-connect
      imagePullSecrets:
        - name: ghcr-creds
      # Let the driver delete its executor pods on SIGTERM before the kubelet
      # gives up on the container.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        fsGroup: 185
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: spark-connect
          image: ghcr.io/stardelt/spark:dev@sha256:185bd2115ac518cb9c18338babdd359902fc732df2a6e0de40defc2b4bd94b51
          imagePullPolicy: IfNotPresent
          command: ["/opt/spark/bin/stardelt-connect-server"]
          env:
            # The downward API is the only place the driver's pod address is
            # known; the entrypoint turns it into spark.driver.host.
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: stardelt-s3-creds, key: access-key }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: stardelt-s3-creds, key: secret-key }
            # No catalog credential here. The catalog sign-in is the person's
            # token in the session configuration (platform#317); the driver keeps
            # no service-account client for Lakekeeper. `svc-catalog-spark` stays
            # a client in the realm for a future platform-side Spark path.
          ports:
            - name: connect
              containerPort: 15002
              protocol: TCP
          readinessProbe:
            tcpSocket: { port: connect }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: connect }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { cpu: "1", memory: "3Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: spark-defaults
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
              readOnly: true
            # Spark writes staging files and the local dirs here; keep them off
            # the node's overlay and inside the container's writable layer.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: spark-defaults
          configMap:
            name: spark-connect-config
        - name: tmp
          emptyDir: {}
---
# ClusterIP only. No Ingress: Spark Connect has no authentication of its own,
# and this endpoint is reached by in-cluster clients (notebooks, Nova jobs).
apiVersion: v1
kind: Service
metadata:
  name: spark-connect
  namespace: stardelt
  labels: { app.kubernetes.io/name: spark-connect, app.kubernetes.io/part-of: stardelt }
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spark-connect
  ports:
    - name: connect
      port: 15002
      targetPort: connect
      protocol: TCP
