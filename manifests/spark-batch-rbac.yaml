# The batch `SparkApplication` path, RBAC half (platform#1208 measured it end to end in a
# scratch namespace: a driver with the `restricted` blocks came up and printed
# `Pi is roughly 3.141800`). Two identities, two jobs:
#
#   1. the submitter — the Airflow worker creates and reads a `SparkApplication`, nothing else.
#      No `update`, no `patch`, no `sparkapplications/finalizers`: the Spark operator owns the
#      object after the submit, the worker must not rewrite or block its teardown.
#   2. the runner — a `SparkApplication`'s driver runs as `spark-batch-driver` and creates the
#      executor pods plus one ConfigMap that carries its state. The rules are the operator's
#      `spark::role` verb for verb, which #1208 measured sufficient.
#
# Not granted, on purpose:
#   - `services`: the driver logs one harmless `services is forbidden` on teardown, and every
#     Service it makes carries an ownerReference, so the garbage collector removes it.
#   - `update` and `deletecollection` on ConfigMaps (platform#1121): a driver's own code runs in
#     it, and those verbs would rewrite or sweep another workload's ConfigMap.
#   - any access to Secrets, and anything outside namespace `stardelt`. The executor pods the
#     driver creates may read only Secret `stardelt-s3-creds`; the driver itself still holds
#     no `secrets` verb.
#
# The driver's code is the user's code, so pods/create and configmaps/create+delete are
# admission-bounded exactly as the Connect driver's are (`manifests/spark-connect-pod-guard.yaml`):
# `spark-batch-executor-pods` allows only the measured executor shape (ServiceAccount
# `spark-executor`, `ghcr.io/stardelt/spark:`, no host access, configMap/emptyDir volumes,
# secret values only from `stardelt-s3-creds`), and `spark-batch-configmaps` allows create and
# delete only of Spark's own `spark-*-conf-map` names (platform#1096 for the Connect shape,
# platform#1302 for this one).
#
# The driver ServiceAccount does not set `automountServiceAccountToken: false`: unlike the
# Connect executor, it needs its token to create executor pods. Applied by `make install`
# after the Airflow release, next to `manifests/airflow-pipelines.yaml`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-spark-submitter
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-spark-submitter
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
subjects:
  - kind: ServiceAccount
    name: airflow-worker
    namespace: stardelt
roleRef:
  kind: Role
  name: airflow-spark-submitter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-batch-driver
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-batch-driver
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-batch-driver
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
subjects:
  - kind: ServiceAccount
    name: spark-batch-driver
    namespace: stardelt
roleRef:
  kind: Role
  name: spark-batch-driver
  apiGroup: rbac.authorization.k8s.io
---
# What the batch driver may create (executor pods). A copy of
# `spark-connect-executor-pods` in `manifests/spark-connect-pod-guard.yaml`: the batch path's
# executor shape is the same measured one (`chart/files/spark-runtimes.json`: ServiceAccount
# `spark-executor`, the two Secret refs on `stardelt-s3-creds`). The Connect policy's
# validations are kept byte-identical on purpose — `scripts/tests/test_spark_batch_guard.py`
# pins the parity.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: spark-batch-executor-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  matchConditions:
    - name: created-by-spark-batch-driver
      expression: "request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':spark-batch-driver'"
  validations:
    - expression: "object.spec.serviceAccountName == 'spark-executor'"
      message: "a pod created by the Spark Connect driver must run as ServiceAccount spark-executor"
    - expression: "!has(object.spec.hostNetwork) || object.spec.hostNetwork == false"
      message: "the Spark Connect driver may not create a host-network pod"
    - expression: "!has(object.spec.hostPID) || object.spec.hostPID == false"
      message: "the Spark Connect driver may not create a host-PID pod"
    - expression: "!has(object.spec.hostIPC) || object.spec.hostIPC == false"
      message: "the Spark Connect driver may not create a host-IPC pod"
    - expression: "!has(object.spec.initContainers) || object.spec.initContainers.size() == 0"
      message: "the Spark Connect driver may not create a pod with init containers"
    - expression: "!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.size() == 0"
      message: "the Spark Connect driver may not add an ephemeral container"
    - expression: "object.spec.containers.all(c, c.image.startsWith('ghcr.io/stardelt/spark:'))"
      message: "every container a Spark Connect driver creates must use the stardelt Spark image"
    - expression: "object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged != true)"
      message: "the Spark Connect driver may not create a privileged container"
    - expression: "object.spec.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))"
      message: "the Spark Connect driver may not bind a host port"
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.configMap) || has(v.emptyDir))"
      message: "executor pods may mount only configMap and emptyDir volumes (no secret, hostPath, PVC, projected or csi volume)"
    - expression: "object.spec.containers.all(c, !has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || e.valueFrom.secretKeyRef.name == 'stardelt-s3-creds'))"
      message: "executor pods may read only Secret stardelt-s3-creds (secretKeyRef)"
    - expression: "object.spec.containers.all(c, !has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef) || e.secretRef.name == 'stardelt-s3-creds'))"
      message: "executor pods may read only Secret stardelt-s3-creds (envFrom)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: spark-batch-executor-pods
spec:
  policyName: spark-batch-executor-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: stardelt
---
# What ConfigMaps the batch driver may create or delete. A batch driver writes one
# `spark-<id>-conf-map` per application (same shape as the Connect session ConfigMap), so the
# name filter and the two verbs are the Connect policy's.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: spark-batch-configmaps
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "DELETE"]
        resources: ["configmaps"]
  matchConditions:
    - name: created-by-spark-batch-driver
      expression: "request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':spark-batch-driver'"
  validations:
    - expression: "request.name.startsWith('spark-') && request.name.endsWith('-conf-map')"
      message: "the Spark Connect driver may create or delete only its own spark-*-conf-map ConfigMaps"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: spark-batch-configmaps
spec:
  policyName: spark-batch-configmaps
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: stardelt
