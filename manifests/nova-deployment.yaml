# stardelt Nova — UI + backend in one pod.
# Image published by CI from stardelt-nova (ghcr.io/stardelt/nova); pin by digest
# for reproducible installs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nova
  namespace: stardelt
  labels: { app.kubernetes.io/name: nova, app.kubernetes.io/part-of: stardelt }
---
# Nova's only cluster permission: read the workloads in its own namespace, so the
# UI can show what is actually deployed — including digest pins. It writes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nova-workload-reader
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-workload-reader
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nova-workload-reader
subjects:
  - kind: ServiceAccount
    name: nova
    namespace: stardelt
---
# Nova lists `Pipeline` resources to show what is scheduled (J1, platform#254),
# and Schedule creates, replaces (`PUT`, hence update not patch) and deletes them
# (platform#270). It also reads `ServicePrincipal` resources to show which groups
# have one, `Catalog` resources for the permission view, and `SqlWarehouse`
# resources to show which compute class a person uses (nova#236).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nova-pipelines
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["stardelt.io"]
    resources: ["pipelines"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["stardelt.io"]
    resources: ["serviceprincipals"]
    verbs: ["get", "list"]
  - apiGroups: ["stardelt.io"]
    resources: ["catalogs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["stardelt.io"]
    resources: ["sqlwarehouses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-pipelines
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nova-pipelines
subjects:
  - kind: ServiceAccount
    name: nova
    namespace: stardelt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova
  namespace: stardelt
  labels:
    app.kubernetes.io/name: nova
    app.kubernetes.io/part-of: stardelt
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nova }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nova, app.kubernetes.io/part-of: stardelt }
      # Rotating the catalog client must reach Nova: the token is cached until it
      # expires and the client secret is process environment, so Reloader
      # (helm-values/reloader.yaml) restarts the pod when the Secret changes.
      annotations: { secret.reloader.stakater.com/reload: "svc-catalog-nova" }
    spec:
      serviceAccountName: nova
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: nova
          image: ghcr.io/stardelt/nova:dev@sha256:33006ea2172658c0cf31824c9d922bcd0b156d09694f51cfe1316b85c466c66c
          # The reference is pinned by digest, so its content never changes and
          # IfNotPresent keeps a cached image usable when GHCR is unreachable or
          # the pull credential has expired — an `Always` policy turned both into
          # an ImagePullBackOff that survived reboots. To take a new build, pin
          # the new digest CI printed (or roll the deployment) instead.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: internal
          env:
            # The query engine's in-cluster TLS endpoint, published by the
            # identity contract (ConfigMap stardelt-identity, key trinoUrl —
            # `make install-identity` writes it, scripts/identity-bootstrap.sh).
            # The TLS listener only exists when the platform has an IdP
            # (manifests/trino-tls.yaml), so the key is optional: without it Nova
            # falls back to its built-in http://…:8080 default, which is what a
            # dev install without identity runs. Re-applying this manifest cannot
            # silently point Nova at a listener that is not there.
            - name: NOVA_TRINO_URL
              valueFrom:
                configMapKeyRef: { name: stardelt-identity, key: trinoUrl, optional: true }
            # The internal CA that signs the coordinator certificate
            # (manifests/trino-tls.yaml). Nova adds it to its TLS roots on top of
            # the public WebPKI roots — trust is widened by exactly one anchor,
            # nothing is disabled. Absent on a dev install without an IdP.
            - name: NOVA_TRINO_CA_PEM
              valueFrom:
                secretKeyRef: { name: trino-ca, key: tls.crt, optional: true }
            - name: NOVA_LAKEKEEPER_URL
              value: http://lakekeeper.stardelt.svc.cluster.local:8181
            - name: NOVA_WAREHOUSE_NAME
              value: warehouse
            - name: NOVA_DEV_USER
              value: stardelt-dev
            # ---- Sign-in (contract: docs/architecture/identity) --------------
            # `dev` keeps the no-login behaviour (CI, `make demo`, the kind gate).
            # To turn on SSO on a manifest install: run scripts/identity-bootstrap.sh
            # once (it creates the realm + the two Secrets below), then set
            # NOVA_AUTH_MODE=oidc and NOVA_PUBLIC_URL=https://<nova host> here or with
            # `kubectl -n stardelt set env`. The other values come from the identity
            # ConfigMap/Secret and are optional, so a dev install is unaffected.
            # Both come from the platform's identity ConfigMap (created by
            # `make install-identity` / the chart), so re-applying this manifest cannot
            # turn sign-in off or blank the public origin. Absent ConfigMap = dev mode.
            - name: NOVA_AUTH_MODE
              valueFrom:
                configMapKeyRef: { name: stardelt-identity, key: authMode, optional: true }
            - name: NOVA_PUBLIC_URL
              valueFrom:
                configMapKeyRef: { name: stardelt-identity, key: publicUrl, optional: true }
            - name: NOVA_OIDC_ISSUER
              valueFrom:
                configMapKeyRef: { name: stardelt-identity, key: issuerUrl, optional: true }
            - name: NOVA_OIDC_CLIENT_ID
              value: "nova"
            - name: NOVA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: stardelt-oidc-clients, key: nova, optional: true }
            - name: NOVA_SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: stardelt-nova-session, key: session, optional: true }
            - name: NOVA_OIDC_ADMIN_GROUP
              valueFrom:
                configMapKeyRef: { name: stardelt-identity, key: adminGroup, optional: true }
            # Catalog sign-in (platform#284, step 4 of the catalog turn-on): every
            # call Nova makes to Lakekeeper carries a client-credentials token
            # (stardelt-nova#222). The client is Secret svc-catalog-nova (KIND=service,
            # platform#282); all three variables are read from that one Secret, so they
            # appear and disappear together. That matters: Nova refuses to start on a
            # partial setting rather than calling the catalog half-configured, and an
            # optional `secretKeyRef` cannot make one variable conditional on another.
            # `token-url` is written by `make sync-catalog-clients` for the same reason.
            # Optional like the identity variables above: without an IdP the Secret does
            # not exist, all three stay unset, and Nova calls Lakekeeper anonymously —
            # the `install-core` shape, where the catalog has no issuer and stays
            # anonymous too (platform#285).
            - name: NOVA_CATALOG_CLIENT_ID
              valueFrom: { secretKeyRef: { name: svc-catalog-nova, key: client-id, optional: true } }
            - name: NOVA_CATALOG_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: svc-catalog-nova, key: client-secret, optional: true } }
            - name: NOVA_CATALOG_TOKEN_URL
              valueFrom: { secretKeyRef: { name: svc-catalog-nova, key: token-url, optional: true } }
            # Published notebooks (platform#290): Nova writes notebook versions into the
            # versioned `notebooks` bucket with the platform S3 identity — the same Secret
            # the object store and every other consumer already read, so there is no new
            # identity and Nova's Role is unchanged (storage is reached over S3, not the
            # Kubernetes API). The bucket is created and versioned by `make notebooks-bucket`
            # (scripts/create-notebooks-bucket.sh); a missing bucket makes publishing fail,
            # not Nova's start-up. The routes themselves land in stardelt-nova#225.
            - name: NOVA_S3_URL
              value: http://seaweedfs-s3.stardelt.svc.cluster.local:8333
            - name: NOVA_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: access-key } }
            - name: NOVA_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: secret-key } }
            - name: NOVA_S3_NOTEBOOK_BUCKET
              value: notebooks
            # Forward the signed-in user's own access token to Trino (and later the
            # catalog) instead of letting Nova act as a shared service account.
            # This is master spec §7 on the query path: the token that signed the
            # user in is the token Trino authenticates and audits. Trino only
            # accepts it when it carries audience `trino` — the realm's aud-trino
            # mapper on client `nova` (scripts/keycloak-sync-trino-client.sh).
            # Over the in-cluster TLS listener this is the only way in: a
            # plain-HTTP statement is refused before an authenticator runs
            # (helm-values/trino-identity.yaml).
            # Harmless without an IdP: with no session there is no token to send,
            # and a Trino without authentication ignores the header.
            - name: NOVA_FORWARD_IDENTITY
              value: "1"
            # Namespace whose workloads Nova reports (downward API).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # External base domain for deep-linking platform apps in Nova.
            # Comes from a ConfigMap so re-applying this manifest cannot wipe the
            # domain the way an inline env value can; the dev playground creates
            # it (dev/playground/README.md), and the umbrella chart sets the value
            # directly from platform.baseDomain. Absent = Nova shows no links.
            - name: NOVA_BASE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: stardelt-platform-config
                  key: baseDomain
                  optional: true
            # The state store (stardelt-nova#103): CloudNative-PG generates Secret
            # `nova-pg-app` for the Cluster in manifests/nova-pg.yaml and its `uri` key is
            # a complete postgresql:// URL. Deliberately NOT optional: a missing Secret
            # keeps the new pod in CreateContainerConfigError (the old pod keeps serving)
            # instead of starting a Nova that silently runs without its database, because
            # an optional reference is read once, at container start. Apply
            # manifests/nova-pg.yaml and wait for the Cluster before applying this file.
            - name: NOVA_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: nova-pg-app, key: uri }
            # Query-log collector (stardelt-nova#116): a second listener that no Ingress
            # routes, reachable inside the cluster only (Service port `internal`). The bearer
            # token is Secret `nova-events` (scripts/nova-events-token.sh), shared with Trino's
            # event listener; optional, so without it the collector stays off.
            - name: NOVA_INTERNAL_ADDR
              value: "0.0.0.0:8081"
            - name: NOVA_EVENTS_TOKEN
              valueFrom: { secretKeyRef: { name: nova-events, key: token, optional: true } }
            # Secret store (stardelt-nova#171, platform#240): the connections API signs in with the
            # caller's token (audience `openbao`) and the chart renders the same three values for
            # the umbrella install — keep them here so a `kubectl apply` of this manifest cannot
            # silently drop the store config the live Deployment already carries.
            - name: NOVA_SECRET_STORE_URL
              value: http://openbao.stardelt.svc.cluster.local:8200
            - name: NOVA_SECRET_STORE_ROLE
              value: platform-users
            - name: NOVA_SECRET_STORE_MOUNT
              value: secret
            # Airflow (J1, platform#254): the Pipelines page reads runs and logs with the
            # `nova-api` service user (Secret `airflow-nova-api`, key `password`, created by
            # the #243 spike). The chart renders the same three values when
            # `nova.airflow.url` is set — keep them here so a `kubectl apply` of this
            # manifest cannot drop them from the live Deployment.
            - name: NOVA_AIRFLOW_URL
              value: http://airflow-api-server.stardelt.svc.cluster.local:8080
            - name: NOVA_AIRFLOW_USER
              value: nova-api
            - name: NOVA_AIRFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-nova-api
                  key: password
            - name: RUST_LOG
              value: info,tower_http=info
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: "50m",  memory: "64Mi"  }
            limits:   { cpu: "1",    memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: nova
  namespace: stardelt
  labels: { app.kubernetes.io/name: nova }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: nova }
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: internal
      port: 8081
      targetPort: internal
