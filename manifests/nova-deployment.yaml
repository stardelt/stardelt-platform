# stardelt Nova — UI + backend in one pod.
# Image published by CI from stardelt-nova (ghcr.io/stardelt/nova); pin by digest
# for reproducible installs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nova
  namespace: stardelt
  labels: { app.kubernetes.io/name: nova, app.kubernetes.io/part-of: stardelt }
---
# Nova's only cluster permission: read the workloads in its own namespace, so the
# UI can show what is actually deployed — including digest pins. It writes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nova-workload-reader
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-workload-reader
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nova-workload-reader
subjects:
  - kind: ServiceAccount
    name: nova
    namespace: stardelt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova
  namespace: stardelt
  labels:
    app.kubernetes.io/name: nova
    app.kubernetes.io/part-of: stardelt
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nova }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nova, app.kubernetes.io/part-of: stardelt }
    spec:
      serviceAccountName: nova
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: nova
          image: ghcr.io/stardelt/nova:dev
          # `:dev` is a mutable tag, so it only takes effect when a pod starts:
          # Always re-pulls, but nothing here changes when CI publishes — after a
          # merge, roll the deployment (`kubectl -n stardelt rollout restart
          # deploy/nova`) or pin the digest CI printed for a reproducible install.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NOVA_TRINO_URL
              value: http://trino.stardelt.svc.cluster.local:8080
            - name: NOVA_LAKEKEEPER_URL
              value: http://lakekeeper.stardelt.svc.cluster.local:8181
            - name: NOVA_WAREHOUSE_NAME
              value: warehouse
            - name: NOVA_DEV_USER
              value: stardelt-dev
            # Namespace whose workloads Nova reports (downward API).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # External base domain for deep-linking platform apps in Nova.
            # Comes from a ConfigMap so re-applying this manifest cannot wipe the
            # domain the way an inline env value can; the dev playground creates
            # it (dev/playground/README.md), and the umbrella chart sets the value
            # directly from platform.baseDomain. Absent = Nova shows no links.
            - name: NOVA_BASE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: stardelt-platform-config
                  key: baseDomain
                  optional: true
            - name: RUST_LOG
              value: info,tower_http=info
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: "50m",  memory: "64Mi"  }
            limits:   { cpu: "1",    memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: nova
  namespace: stardelt
  labels: { app.kubernetes.io/name: nova }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: nova }
  ports:
    - name: http
      port: 8080
      targetPort: http
