# The object store's internal ports take unsigned requests (platform#1100).
#
# The S3 gateway on 8333 checks an access key; the filer (8888), master (9333) and
# volume servers (8080) check nothing with this chart's defaults. Those ports are
# for SeaweedFS's own components — the S3 gateway asks the filer for the object
# namespace, the filer registers with the master, volumes heartbeat to the master,
# the admin UI reads both. Every other pod uses the S3 gateway, where the key is
# checked. This policy is the only gate on the unsigned ports until JWT signing or
# scoped S3 identities land (#1100's "Then" list).
#
# Checked against every in-repo client (2026-11-12): the backup CronJobs
# (aws s3 sync, rclone), the bucket-creation scripts (amazon/aws-cli), CNPG's WAL
# archive (s3://backups/) and the engines all talk to seaweedfs-s3:8333.
# The chart's post-upgrade bucket hook is a client too — see the job-name rule below;
# it runs during helm upgrade, so it meets the previous install's policy.
#
# Needs a CNI that enforces NetworkPolicy — k3s does; plain Flannel does not.
# To debug a client that must stay on the filer, delete this policy and say why;
# it is re-applied by `make install`/`make step-storage`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-internal
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [master, filer, volume]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
    # The customer's Prometheus (stardelt-operator#607): read-only metrics on 9327.
    # master/filer/volume answer Prometheus text there; the unsigned data ports
    # (8888, 9333, 8080) stay closed by the rule above.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9327
    # The chart's bucket hook (platform#1244). `helm upgrade` runs it as a
    # post-upgrade hook — before this policy is re-applied — so it meets the
    # policy of the previous install. It waits on the master's /cluster/status
    # and the filer's / and then creates the `lakehouse` and `backups` buckets
    # through `weed shell`, so it needs 9333 and 8888. The Job controller puts
    # `job-name: <job>` on the pod (measured in this namespace), and the Job's
    # name is the fixed `seaweedfs-bucket-hook`, so this admits the hook and
    # nothing else — not the S3 gateway, not a future chart pod.
    - from:
        - podSelector:
            matchLabels:
              job-name: seaweedfs-bucket-hook
      ports:
        - protocol: TCP
          port: 9333
        - protocol: TCP
          port: 8888
