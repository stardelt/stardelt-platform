# Sync Superset FAB roles for Catalog owner groups (platform#494).
#
# Creates (idempotently) role stardelt-group-<group> for each non-admin grant on
# Catalogs, and grants it database_access on the matching Trino database and
# datasource_access on its datasets. The same script runs in the chart's init Job
# (`step-superset` passes it with --set-file); this CronJob keeps groups that
# appear after the install in sync.
#
# The pods use the `superset` ServiceAccount (helm-values/superset.yaml sets
# serviceAccountName) so the chart's init Job and this Job share the read-only
# Catalogs permission. It is created here because the chart's own SA is off.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superset
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: superset-group-roles
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: ["stardelt.io"]
    resources: ["catalogs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: superset-group-roles
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
subjects:
  - kind: ServiceAccount
    name: superset
    namespace: stardelt
roleRef:
  kind: Role
  name: superset-group-roles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: superset-group-roles
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: stardelt
            app.kubernetes.io/name: superset-group-roles
        spec:
          restartPolicy: Never
          serviceAccountName: superset
          automountServiceAccountToken: true
          imagePullSecrets:
            - name: ghcr-creds
          containers:
            - name: sync
              image: ghcr.io/stardelt/superset:dev@sha256:b9ced85d81a0c9efd2ca993f27bba5470e4815aad9d246b93e3ca5e62d26e8cd
              command: ["python", "/app/configs/superset-group-roles.py"]
              # The same environment the Superset pods get: SUPERSET_SECRET_KEY and
              # the metadata DB connection (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASS),
              # generated by the chart's extraEnvRaw into Secret superset-env.
              envFrom:
                - secretRef:
                    name: superset-env
              env:
                # The deployment sets this explicitly; extraEnvRaw's Secret does not carry it.
                - name: SUPERSET_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: superset-secret-key
                      key: secret-key
              volumeMounts:
                - name: configs
                  mountPath: /app/configs
                  readOnly: true
                - name: pythonpath
                  mountPath: /app/pythonpath
                  readOnly: true
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits: { cpu: "1", memory: "1Gi" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
          volumes:
            # The chart's extra-config ConfigMap carries superset-group-roles.py
            # (`step-superset` passes it with --set-file); the config Secret carries
            # superset_config.py, which create_app() loads from /app/pythonpath.
            - name: configs
              configMap:
                name: superset-extra-config
            - name: pythonpath
              secret:
                secretName: superset-config
