# The StreamApp driver identity, RBAC half (platform#1210 option B, platform#1298).
#
# Why a second driver identity exists at all: an Iceberg executor refreshes the
# catalog token itself, so a StreamApp's executor pods must read the stream's
# catalog ServicePrincipal Secret `sp-pipeline-*` (the operator sets
# `spark.kubernetes.executor.secretKeyRef.CATALOG_CLIENT_SECRET`). The shared
# `spark-connect` driver runs arbitrary user code and must never gain that right
# (option A, rejected). A StreamApp's driver runs only stardelt's own
# `stream_job.py`, so it gets its own ServiceAccount, Role and admission policy;
# that is what makes the `sp-pipeline-*` read safe.
#
# The rules below are `spark-batch-driver`'s (manifests/spark-batch-rbac.yaml)
# verb for verb — pods plus one ConfigMap, nothing else, and no Secret access for
# the driver itself. `manifests/spark-connect-pod-guard.yaml` is unchanged: the
# shared Connect server keeps the `stardelt-s3-creds`-only executor rule.
#
# The ConfigMap half of that Role is bounded by `spark-stream-configmaps` below,
# as the Connect and batch drivers' are by `spark-connect-configmaps` and
# `spark-batch-configmaps`: without it `create`/`delete` on `configmaps` would
# reach `trino-catalog`, `stardelt-identity`, `spark-confmap-janitor-script` and
# every other ConfigMap in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-stream-driver
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-stream-driver
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-stream-driver
  namespace: stardelt
  labels: { app.kubernetes.io/part-of: stardelt }
subjects:
  - kind: ServiceAccount
    name: spark-stream-driver
    namespace: stardelt
roleRef:
  kind: Role
  name: spark-stream-driver
  apiGroup: rbac.authorization.k8s.io
---
# The executor allow-list is the Connect policy's, with the Secret rules widened
# to `sp-pipeline-*` (the stream's catalog ServicePrincipal) for this driver only.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: spark-stream-executor-pods
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  matchConditions:
    - name: created-by-spark-stream-driver
      expression: "request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':spark-stream-driver'"
  validations:
    - expression: "object.spec.serviceAccountName == 'spark-executor'"
      message: "a pod created by the Spark Connect driver must run as ServiceAccount spark-executor"
    - expression: "!has(object.spec.hostNetwork) || object.spec.hostNetwork == false"
      message: "the Spark Connect driver may not create a host-network pod"
    - expression: "!has(object.spec.hostPID) || object.spec.hostPID == false"
      message: "the Spark Connect driver may not create a host-PID pod"
    - expression: "!has(object.spec.hostIPC) || object.spec.hostIPC == false"
      message: "the Spark Connect driver may not create a host-IPC pod"
    - expression: "!has(object.spec.initContainers) || object.spec.initContainers.size() == 0"
      message: "the Spark Connect driver may not create a pod with init containers"
    - expression: "!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.size() == 0"
      message: "the Spark Connect driver may not add an ephemeral container"
    - expression: "object.spec.containers.all(c, c.image.startsWith('ghcr.io/stardelt/spark:'))"
      message: "every container a Spark Connect driver creates must use the stardelt Spark image"
    - expression: "object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged != true)"
      message: "the Spark Connect driver may not create a privileged container"
    - expression: "object.spec.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))"
      message: "the Spark Connect driver may not bind a host port"
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.configMap) || has(v.emptyDir))"
      message: "executor pods may mount only configMap and emptyDir volumes (no secret, hostPath, PVC, projected or csi volume)"
    - expression: "object.spec.containers.all(c, !has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || e.valueFrom.secretKeyRef.name == 'stardelt-s3-creds' || e.valueFrom.secretKeyRef.name.startsWith('sp-pipeline-')))"
      message: "a StreamApp executor may read only Secret stardelt-s3-creds and sp-pipeline-* (secretKeyRef)"
    - expression: "object.spec.containers.all(c, !has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef) || e.secretRef.name == 'stardelt-s3-creds' || e.secretRef.name.startsWith('sp-pipeline-')))"
      message: "a StreamApp executor may read only Secret stardelt-s3-creds and sp-pipeline-* (envFrom)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: spark-stream-executor-pods
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  policyName: spark-stream-executor-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: stardelt
---
# What ConfigMaps the StreamApp driver may create or delete. A StreamApp driver writes one
# `spark-<app>-conf-map` per application (same shape as the Connect session and batch
# ConfigMaps), so the name filter and the two verbs are the Connect policy's.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: spark-stream-configmaps
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "DELETE"]
        resources: ["configmaps"]
  matchConditions:
    - name: created-by-spark-stream-driver
      expression: "request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':spark-stream-driver'"
  validations:
    - expression: "request.name.startsWith('spark-') && request.name.endsWith('-conf-map')"
      message: "the StreamApp driver may create or delete only its own spark-*-conf-map ConfigMaps"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: spark-stream-configmaps
  labels: { app.kubernetes.io/part-of: stardelt }
spec:
  policyName: spark-stream-configmaps
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: stardelt
