# Slim Trino overrides for the cheap dev cluster (cx33, 4 vCPU / 8 GB).
# Usage:  make install-core SLIM=1
#
# Overrides helm-values/trino.yaml (later -f wins): smaller heaps so Trino fits
# next to SeaweedFS, CNPG, Lakekeeper and Nova on one 8 GB node.
#
# Constraint: query.maxMemory + 30% heap headroom must be <= max heap.
#   900MB + 450MB = 1350MB <= 1500m  ✓
server:
  workers: 1
  config:
    query:
      maxMemory: "900MB"

coordinator:
  jvm:
    maxHeapSize: "1500m"
    gcMethod:
      type: UseG1GC
  additionalJVMConfig:
    - "-Xms512m"

worker:
  jvm:
    maxHeapSize: "1500m"
    gcMethod:
      type: UseG1GC
  additionalJVMConfig:
    - "-Xms512m"
