# Trino — MPP SQL engine.
# Chart: trino/trino 1.42.2, appVersion 480.
#
# Catalog `warehouse` connects to Lakekeeper (REST Iceberg catalog) and
# reads/writes Parquet on SeaweedFS via its native S3 filesystem. Credentials
# come from the `stardelt-s3-creds` Secret via env-var substitution
# (`${ENV:S3_ACCESS_KEY}`).
#
# kind tuning: 1 worker, conservative JVM heap.

server:
  workers: 1
  config:
    query:
      # Memory budget (platform#54): per-node + headroom must stay well below
      # the heap so a single query fails closed instead of OOM-killing the worker.
      #   800MB + 600MB = 1400MB <= 2G (2048MB), leaving ~600MB for the engine
      #   and unaccounted allocations. Was 1200MB cluster / 1GB per-node
      #   (chart default), which left no room for a big join.
      maxMemory: "800MB"
  # Coordinator-only query guards (platform#54). The chart renders
  # `additionalConfigProperties` into the worker ConfigMap too, and the worker
  # rejects keys it does not bind — so coordinator-only properties live here.
  # Kept in sync with helm-values/trino-identity.yaml, which extends this
  # block (Helm replaces strings instead of merging them).
  coordinatorExtraConfig: |
    query.max-execution-time=10m
    query.max-run-time=15m

# Trino sits behind an ingress (ingress-nginx) that sets X-Forwarded-For; without
# this it answers 406 "Server configuration does not allow processing of the
# X-Forwarded-For header". `server.config` only renders known keys — extra
# properties must go through `additionalConfigProperties`.
additionalConfigProperties:
  - http-server.process-forwarded=true

coordinator:
  # Rotating the S3 key restarts the engine (running queries end): Reloader, helm-values/reloader.yaml.
  # The catalog's client credential (platform#283) is reloaded the same way: a rotated
  # svc-catalog-trino Secret restarts the coordinator, because Trino reads ${ENV:…} once at
  # startup and the catalog's token comes from those variables.
  #
  # The second line is the one ConfigMap that *does* need a restart (platform#313): the
  # resource-group file manager loads `/etc/trino/warehouses/resource-groups.json` once at
  # startup and never again (spike platform#273 R6), so a changed class — a new
  # `SqlWarehouse`, a cap, the default — only arrives with a new coordinator. Reloader
  # restarts the coordinator when ConfigMap `trino-warehouses` changes; access-sync writes
  # it only when the rendered document differs, so an unchanged tick does not bounce the
  # engine. The group file (`trino-group-file`) is deliberately NOT listed: the file group
  # provider re-reads it every 30 s and a restart would drop running queries for nothing.
  # Like the S3 rotation, a restart ends the queries that are running — pick a quiet moment.
  annotations:
    secret.reloader.stakater.com/reload: "stardelt-s3-creds,svc-catalog-trino"
    configmap.reloader.stakater.com/reload: "trino-warehouses"
  jvm:
    maxHeapSize: "2G"
    gcMethod:
      type: UseG1GC
  config:
    query:
      # Same per-node cap as the worker (platform#54): the coordinator renders
      # its own limit from this block; the worker from worker.config.
      maxMemoryPerNode: "800MB"
    memory:
      heapHeadroomPerNode: "600MB"
  # HeapDumpPath (platform#54): the chart hardcodes +HeapDumpOnOutOfMemoryError,
  # so a dump lands on the container filesystem. Redirect it to a bounded
  # emptyDir instead of the overlay fs.
  additionalJVMConfig:
    - "-Xms1G"
    - "-XX:HeapDumpPath=/dumps"
  # Memory guard (platform#54): kubelet — not the JVM — is in charge. Heap 2G
  # + metaspace/direct/CodeCache: requests hold heap + ~250Mi, limits heap + ~1Gi.
  # Trino at ~3.9Gi today (worker 2.5Gi + coordinator 1.4Gi); new budget
  # requests ~4.1Gi / limits ~5.5Gi on a 16Gi node (fits: requests ~44% -> ~70%).
  resources:
    requests: { cpu: "500m", memory: "2300Mi" }
    limits: { memory: "3000Mi" }
  additionalExposedPorts: {}
  # Worker-local file-system cache for object-store reads (platform#134).
  # The directory must exist on the coordinator too, so it gets the mount.
  # Kept in sync with helm-values/trino-identity.yaml, which repeats these
  # lists (Helm replaces lists instead of merging them).
  additionalVolumes:
    - name: trino-fscache
      emptyDir: { sizeLimit: 12Gi }
    # Bounded heap-dump dir (platform#54): 2Gi cap so a dump never fills the node.
    - name: trino-dumps
      emptyDir: { sizeLimit: 2Gi }
  additionalVolumeMounts:
    - { name: trino-fscache, mountPath: /var/trino/cache }
    - { name: trino-dumps, mountPath: /dumps }

worker:
  annotations:
    secret.reloader.stakater.com/reload: "stardelt-s3-creds,svc-catalog-trino"
  jvm:
    maxHeapSize: "2G"
    gcMethod:
      type: UseG1GC
  config:
    query:
      # Per-node cap (platform#54): 800MB + 600MB headroom <= 2G heap.
      maxMemoryPerNode: "800MB"
    memory:
      heapHeadroomPerNode: "600MB"
  additionalJVMConfig:
    - "-Xms1G"
    - "-XX:HeapDumpPath=/dumps"
  # Same kubelet guard as the coordinator (worker does the heavy joins).
  resources:
    requests: { cpu: "500m", memory: "2300Mi" }
    limits: { memory: "3000Mi" }
  # Same cache volume as the coordinator (see above).
  additionalVolumes:
    - name: trino-fscache
      emptyDir: { sizeLimit: 12Gi }
    - name: trino-dumps
      emptyDir: { sizeLimit: 2Gi }
  additionalVolumeMounts:
    - { name: trino-fscache, mountPath: /var/trino/cache }
    - { name: trino-dumps, mountPath: /dumps }

# Pull S3 creds from the stardelt-s3-creds Secret so catalog properties can
# substitute ${ENV:S3_ACCESS_KEY} / ${ENV:S3_SECRET_KEY}. Trino substitutes
# ${ENV:…} in every properties file, including config.properties
# (https://trino.io/docs/480/security/secrets.html).
#
# The three identity variables are only *read* by the OAuth2 overlay
# (helm-values/trino-identity.yaml): they are optional so a dev cluster without
# an IdP installs claim-for-claim the same pod. They live here rather than in
# the overlay because Helm replaces lists instead of merging them — an overlay
# `env:` would silently drop the S3 credentials.
env:
  - name: S3_ACCESS_KEY
    valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: access-key } }
  - name: S3_SECRET_KEY
    valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: secret-key } }
  # Confidential client `trino` in realm `stardelt` (scripts/identity-bootstrap.sh).
  - name: TRINO_CLIENT_SECRET
    valueFrom: { secretKeyRef: { name: stardelt-oidc-clients, key: trino, optional: true } }
  # Authenticates coordinator <-> worker traffic once an authenticator is on.
  # Bearer token for the query-log event listener (helm-values/trino-query-log.yaml);
  # optional so a cluster without the query log installs the same pod.
  - name: NOVA_EVENTS_TOKEN
    valueFrom: { secretKeyRef: { name: nova-events, key: token, optional: true } }
  - name: TRINO_INTERNAL_SHARED_SECRET
    valueFrom: { secretKeyRef: { name: trino-internal-secret, key: shared-secret, optional: true } }
  # Issuer of the platform IdP, from the identity contract ConfigMap. Keycloak
  # (platform mode) and an external IdP write the same key, so the overlay needs
  # no per-deployment host baked into a tracked file.
  - name: TRINO_OIDC_ISSUER
    valueFrom: { configMapKeyRef: { name: stardelt-identity, key: issuerUrl, optional: true } }
  # Catalog sign-in (platform#283, step 2 of the catalog turn-on). The coordinator and
  # every worker open the Iceberg REST catalog themselves, so each JVM asks the realm
  # for its own client-credentials token: Secret svc-catalog-trino (KIND=service,
  # platform#282) is the caller's identity, and the catalog properties that consume
  # these variables live in helm-values/trino-identity.yaml — a catalog with
  # `security=OAUTH2` and no credential is refused at load time (OAuth2SecurityConfig),
  # so it may only be rendered where an IdP and therefore a Secret exist.
  # Optional, like the identity variables above: without an IdP neither the Secret nor
  # the ConfigMap exists, the catalog properties are never rendered, and Trino keeps
  # talking to Lakekeeper anonymously (the `install-core` shape).
  - name: CATALOG_CLIENT_ID
    valueFrom: { secretKeyRef: { name: svc-catalog-trino, key: client-id, optional: true } }
  - name: CATALOG_CLIENT_SECRET
    valueFrom: { secretKeyRef: { name: svc-catalog-trino, key: client-secret, optional: true } }
  # Token endpoint = <issuer>/protocol/openid-connect/token. The kubelet expands $(VAR)
  # from a variable defined earlier in this list, so the realm's public URL stays in
  # ConfigMap stardelt-identity instead of being repeated in a tracked file.
  - name: CATALOG_TOKEN_URL
    value: "$(TRINO_OIDC_ISSUER)/protocol/openid-connect/token"
  # Password of the PKCS12 keystore cert-manager writes into Secret
  # trino-coordinator-tls (manifests/trino-tls.yaml). Only the TLS overlay reads
  # it; optional like the other identity variables so a cluster without an IdP
  # (and therefore without a certificate) installs the same pod.
  - name: TRINO_TLS_KEYSTORE_PASSWORD
    valueFrom: { secretKeyRef: { name: trino-tls-keystore, key: password, optional: true } }

catalogs:
  # Keep in sync: helm-values/trino-identity.yaml repeats `warehouse` verbatim and adds
  # the catalog's OAuth2 properties (platform#283) — Helm replaces a map value instead
  # of merging it, so an edit here must be mirrored there or the overlay silently
  # reverts it.
  warehouse: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://lakekeeper.stardelt.svc.cluster.local:8181/catalog
    iceberg.rest-catalog.warehouse=warehouse
    iceberg.rest-catalog.vended-credentials-enabled=false
    fs.native-s3.enabled=true
    s3.endpoint=http://seaweedfs-s3.stardelt.svc.cluster.local:8333
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}
    # Single-replica SeaweedFS volume server can't sustain Trino's default
    # parallel HTTP range requests (broken pipe / connection reset). Throttle
    # both connection pool and the Iceberg metadata enumeration threads.
    s3.max-connections=16
    iceberg.split-manager-threads=4
    iceberg.metadata.parallelism=2
    # Worker-local file-system cache for object-store reads (platform#134,
    # Trino 480: `fs.cache.*` per catalog; there is no cache-manager setting
    # in 480). Measured on the dev cluster 2026-10-19 against a 38M-row /
    # 0.66 GB full scan of nyc_taxi.yellow_trips: repeat scans drop from
    # 154 S3 GETs + 660 MB to 1 GET + 0 MB, wall time 1.5-1.9s -> 1.2-1.7s.
    # The win is S3 offload (the single-replica SeaweedFS volume server is
    # the bottleneck the throttles above protect), not latency — Parquet
    # decode dominates on one node. Best-effort local cache only: a pod
    # restart or scale-to-zero (M-02) discards it with the emptyDir, and the
    # next scan repopulates (cold scan is slower: 5.1s vs 3.2s uncached).
    fs.cache.enabled=true
    fs.cache.directories=/var/trino/cache
    fs.cache.max-sizes=10GB
    fs.cache.ttl=7d
