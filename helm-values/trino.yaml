# Trino — MPP SQL engine.
# Chart: trino/trino 1.42.2, appVersion 480.
#
# Catalog `warehouse` connects to Lakekeeper (REST Iceberg catalog) and
# reads/writes Parquet on SeaweedFS via its native S3 filesystem. Credentials
# come from the `stardelt-s3-creds` Secret via env-var substitution
# (`${ENV:S3_ACCESS_KEY}`).
#
# kind tuning: 1 worker, conservative JVM heap.

server:
  workers: 1
  config:
    query:
      # Must satisfy: maxMemory + 30% heap headroom <= max heap. 1200MB + 600MB <= 2GB.
      maxMemory: "1200MB"

# Trino sits behind an ingress (ingress-nginx) that sets X-Forwarded-For; without
# this it answers 406 "Server configuration does not allow processing of the
# X-Forwarded-For header". `server.config` only renders known keys — extra
# properties must go through `additionalConfigProperties`.
additionalConfigProperties:
  - http-server.process-forwarded=true

coordinator:
  jvm:
    maxHeapSize: "2G"
    gcMethod:
      type: UseG1GC
  # Cap per-node so it stays well below heap (heap headroom defaults to ~30%).
  additionalJVMConfig:
    - "-Xms1G"
  additionalExposedPorts: {}

worker:
  jvm:
    maxHeapSize: "2G"
    gcMethod:
      type: UseG1GC
  additionalJVMConfig:
    - "-Xms1G"

# Pull S3 creds from the stardelt-s3-creds Secret so catalog properties can
# substitute ${ENV:S3_ACCESS_KEY} / ${ENV:S3_SECRET_KEY}. Trino substitutes
# ${ENV:…} in every properties file, including config.properties
# (https://trino.io/docs/480/security/secrets.html).
#
# The three identity variables are only *read* by the OAuth2 overlay
# (helm-values/trino-identity.yaml): they are optional so a dev cluster without
# an IdP installs claim-for-claim the same pod. They live here rather than in
# the overlay because Helm replaces lists instead of merging them — an overlay
# `env:` would silently drop the S3 credentials.
env:
  - name: S3_ACCESS_KEY
    valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: access-key } }
  - name: S3_SECRET_KEY
    valueFrom: { secretKeyRef: { name: stardelt-s3-creds, key: secret-key } }
  # Confidential client `trino` in realm `stardelt` (scripts/identity-bootstrap.sh).
  - name: TRINO_CLIENT_SECRET
    valueFrom: { secretKeyRef: { name: stardelt-oidc-clients, key: trino, optional: true } }
  # Authenticates coordinator <-> worker traffic once an authenticator is on.
  - name: TRINO_INTERNAL_SHARED_SECRET
    valueFrom: { secretKeyRef: { name: trino-internal-secret, key: shared-secret, optional: true } }
  # Issuer of the platform IdP, from the identity contract ConfigMap. Keycloak
  # (platform mode) and an external IdP write the same key, so the overlay needs
  # no per-deployment host baked into a tracked file.
  - name: TRINO_OIDC_ISSUER
    valueFrom: { configMapKeyRef: { name: stardelt-identity, key: issuerUrl, optional: true } }

catalogs:
  warehouse: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://lakekeeper.stardelt.svc.cluster.local:8181/catalog
    iceberg.rest-catalog.warehouse=warehouse
    iceberg.rest-catalog.vended-credentials-enabled=false
    fs.native-s3.enabled=true
    s3.endpoint=http://seaweedfs-s3.stardelt.svc.cluster.local:8333
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}
    # Single-replica SeaweedFS volume server can't sustain Trino's default
    # parallel HTTP range requests (broken pipe / connection reset). Throttle
    # both connection pool and the Iceberg metadata enumeration threads.
    s3.max-connections=16
    iceberg.split-manager-threads=4
    iceberg.metadata.parallelism=2
