# JupyterHub — multi-user notebook environment (the front door for interactive analysis).
# Chart: jupyterhub/jupyterhub 4.4.3, appVersion 5.5.3.
#
# Sign-in is OIDC against the platform IdP: realm `stardelt`, client `jupyterhub`
# (chart/files/keycloak-realm.json), redirect `/hub/oauth_callback`. There is no
# password in this file — the issuer URL and Nova's origin come from ConfigMap
# `stardelt-identity` and the client secret from Secret `stardelt-oidc-clients`
# (key `jupyterhub`), both published by `make install-identity` /
# `scripts/identity-bootstrap.sh`. Without an IdP the hub still starts but signs
# nobody in, and nothing is made frameable.
#
# Single-user pods run stardelt's own image (images/jupyter/Dockerfile) and get
# the signed-in user's Keycloak token in their environment as `TRINO_TOKEN`
# (hub.extraConfig `20-notebook-identity`), so the shipped quickstart queries the
# warehouse as that user. See the README, "Notebooks: the user's own identity,
# inside the pod".
#
# Ephemeral per-user storage, small resources so it fits the cheap single node.
#
# The public service is `proxy-public` on port 80 (used by the playground ingress).

hub:
  # Values files are not templated, so the identity contract reaches the hub
  # through the environment and `extraConfig` below turns it into OIDC endpoints
  # and framing policy. `optional: true`: the objects appear only after
  # `make install-identity`, and a missing one must not keep the hub from
  # starting.
  extraEnv:
    STARDELT_OIDC_ISSUER_URL:
      valueFrom:
        configMapKeyRef:
          name: stardelt-identity
          key: issuerUrl
          optional: true
    # Nova's own origin (`https://<baseDomain>`), the one origin allowed to
    # frame the hub and the single-user servers. From the identity contract, not
    # from this file.
    STARDELT_NOVA_URL:
      valueFrom:
        configMapKeyRef:
          name: stardelt-identity
          key: publicUrl
          optional: true
    STARDELT_OIDC_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: stardelt-oidc-clients
          key: jupyterhub
          optional: true
  extraConfig:
    10-oidc: |
      import os

      # Keycloak's endpoints are derived from the identity contract's issuer URL
      # (https://id.<baseDomain>/realms/stardelt), never written into this file.
      _issuer = os.environ.get("STARDELT_OIDC_ISSUER_URL", "").rstrip("/")
      if _issuer:
          c.GenericOAuthenticator.authorize_url = _issuer + "/protocol/openid-connect/auth"
          c.GenericOAuthenticator.token_url = _issuer + "/protocol/openid-connect/token"
          c.GenericOAuthenticator.userdata_url = _issuer + "/protocol/openid-connect/userinfo"

      # The callback Keycloak must be told is the *public* one. Left to itself the
      # hub advertises http://proxy-public/hub/oauth_callback — its internal service
      # name, which Keycloak does not have registered, so the login dies as
      # invalid_redirect_uri before a code is ever issued. The hub host follows the
      # platform convention jupyter.<base>, and the base is the issuer's host minus
      # the leading "id." label.
      _host = _issuer.split("://", 1)[-1].split("/", 1)[0] if _issuer else ""
      _base = _host.split(".", 1)[1] if "." in _host else ""
      _callback = os.environ.get("STARDELT_HUB_OAUTH_CALLBACK_URL", "")
      if not _callback and _base:
          _callback = "https://jupyter." + _base + "/hub/oauth_callback"
      if _callback:
          c.GenericOAuthenticator.oauth_callback_url = _callback

      _secret = os.environ.get("STARDELT_OIDC_CLIENT_SECRET", "").strip()
      if _secret:
          c.GenericOAuthenticator.client_secret = _secret

    # Framing, and the cookies that make a framed session work.
    #
    # Nova's Notebooks page frames the hub, and the hub sends a signed-in person
    # on to their own single-user server (`redirect_to_server`), which is where
    # JupyterLab actually runs. Both apps refuse framing by default — the hub
    # since JupyterHub 4.1, the server because it executes code — so both get the
    # same narrow exception: Nova's own origin, read from the identity contract
    # (`publicUrl`), never written out here and never `*`.
    #
    # The server half: JupyterHub does not configure the server's headers, so
    # the origin is passed into the spawn environment and the image's
    # jupyter_server_config.py turns it into the server's CSP. With no IdP the
    # variables are empty, nothing is allowed, and both defaults stand.
    #
    # The cookie half: a frame is a third-party context for the app inside it.
    # `SameSite=None; Secure` is what browsers then require of a cookie they are
    # to send there; the hub takes its own from `tornado_settings`, and the
    # spawner passes the same options to the server as JUPYTERHUB_COOKIE_OPTIONS
    # (JupyterHub's Spawner.cookie_options). The hub's report-uri stays: a
    # violation still lands in the hub log at /hub/security/csp-report.
    #
    # Trade-off, stated rather than implied: a notebook is not a dashboard.
    # Whoever controls the embedding origin can clickjack the hub and the
    # server, which is why this is a deliberate value and not a built-in
    # default. Remove it and Nova reports the header instead — it reads the
    # app's headers, it does not guess.
    15-framing: |
      import os

      _nova = os.environ.get("STARDELT_NOVA_URL", "").rstrip("/")
      if _nova:
          # The hub's own pages (login, spawn, home).
          c.JupyterHub.tornado_settings = {
              **c.JupyterHub.tornado_settings,
              "headers": {
                  **c.JupyterHub.tornado_settings.get("headers", {}),
                  "Content-Security-Policy": (
                      f"frame-ancestors 'self' {_nova}; "
                      "report-uri /hub/security/csp-report"
                  ),
              },
          }

          # The single-user server, told at spawn what it may be framed by.
          c.KubeSpawner.environment = {
              **(c.KubeSpawner.environment or {}),
              "STARDELT_NOVA_ORIGIN": _nova,
          }

          # Cookies usable inside the frame, for the hub and for every server.
          _cookies = {"SameSite": "None", "Secure": True}
          c.JupyterHub.tornado_settings["cookie_options"] = _cookies
          c.Spawner.cookie_options = _cookies

    # The signed-in user's own token, inside the spawned notebook. JupyterHub
    # only keeps the OAuth access token when auth_state is enabled; the hook
    # copies it into the single-user pod's environment, where the quickstart
    # reads it (`TRINO_TOKEN`). Nothing is shared or baked into the image, so
    # Trino sees the hub user, not a service account.
    #
    # The token's lifetime is a property of the realm's `jupyterhub` client
    # (8 h, set by chart/files/keycloak-realm.json and
    # scripts/keycloak-sync-trino-client.sh), not of this hook: a notebook keeps
    # it in its environment while the user works, where a 5-minute realm default
    # would mean 401s minutes into every session.
    20-notebook-identity: |
      def _trino_token(spawner, auth_state):
          token = (auth_state or {}).get("access_token")
          if token:
              spawner.environment["TRINO_TOKEN"] = token

      c.Authenticator.enable_auth_state = True
      c.Spawner.auth_state_hook = _trino_token
      # A fresh token before every (re)spawn, so a server restarted after the
      # token aged out starts with the refresh token's new access token.
      c.OAuthenticator.refresh_pre_spawn = True

      # A hub user row that no longer validates — a username removed from
      # Keycloak, or a NULL name left behind by the hub's SQLite database under
      # concurrent writes — otherwise crashes the hub on *every* start
      # (init_spawners iterates the row and dies on the missing name). This is
      # JupyterHub's documented remedy: drop the invalid row and let the user
      # sign in again.
      c.Authenticator.delete_invalid_users = True

    # The warehouse endpoint inside the spawned notebook. With the platform IdP
    # present Trino serves TLS on the in-cluster Service (:8443) and refuses a
    # plain-HTTP statement (helm-values/trino-identity.yaml, manifests/trino-tls.yaml),
    # so the notebook gets that endpoint plus the internal CA that signs it —
    # never the public host, a hairpin through the ingress, or a disabled
    # certificate check. `REQUESTS_CA_BUNDLE` is what the trino Python client
    # (requests) reads; the CA file comes from the `singleuser.storage.extraVolumes`
    # mount below.
    #
    # `c.KubeSpawner.environment` already carries `singleuser.extraEnv` (z2jh maps
    # it) and the framing origin from `15-framing`, so this overrides just
    # TRINO_URL and adds the bundle. Without an IdP nothing is set and the static
    # TRINO_URL — the public HTTPS origin — applies.
    25-notebook-trino: |
      import os

      if os.environ.get("STARDELT_OIDC_ISSUER_URL", "").strip():
          c.KubeSpawner.environment = {
              **(c.KubeSpawner.environment or {}),
              "TRINO_URL": os.environ.get(
                  "STARDELT_TRINO_URL", "https://trino.stardelt.svc.cluster.local:8443"
              ),
              "REQUESTS_CA_BUNDLE": "/etc/stardelt/trino-ca/ca.crt",
          }

  config:
    JupyterHub:
      authenticator_class: generic-oauth
      # Framing (Content-Security-Policy) and the frame-compatible cookies are
      # set in `15-framing` above, from the identity contract: values files are
      # not templated, so an origin must not be written into this one.
      #
      # Trade-off, stated rather than implied: a notebook is not a dashboard. Whoever
      # controls the embedding origin can clickjack the hub inside their frame, which
      # is why this is a deliberate value and not a built-in default. Leave it out and
      # Nova shows a notice quoting the header instead — it reads the header, it does
      # not guess.

    GenericOAuthenticator:
      client_id: jupyterhub
      # Not set: JupyterHub derives it from the request, so the callback stays
      # https://<jupyter host>/hub/oauth_callback even behind a host override.
      login_service: Keycloak
      # One identity: /hub/login goes straight to Keycloak instead of a button.
      auto_login: true
      username_claim: preferred_username
      scope: ["openid", "profile", "email"]
      # The realm's `jupyterhub` client has a `groups` mapper (full path off), so
      # userinfo carries `groups` for the realm's group names. oauthenticator 17
      # gates on JupyterHub groups, hence manage_groups + the auth_state path.
      manage_groups: true
      auth_state_groups_key: oauth_user.groups
      # Default-closed: only members of the platform admin group may sign in.
      # Add groups here, or set allow_all: true to admit every realm user.
      # Two groups may use notebooks: platform admins, and everyone the realm puts
      # in `stardelt-users` — the realm's default group, so a user created in the
      # console joins it automatically and can open a notebook without an admin.
      allowed_groups: [stardelt-admins, stardelt-users]
      admin_groups: ["stardelt-admins"]
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

proxy:
  service:
    type: ClusterIP
  chp:
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits:   { cpu: "500m", memory: "256Mi" }
  traefik:
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits:   { cpu: "500m", memory: "256Mi" }

singleuser:
  # stardelt's image (images/jupyter/Dockerfile): scipy-notebook + trino,
  # pyspark[connect], pandas, pyarrow, the git extensions (jupyterlab-git,
  # nbgitpuller), and the warehouse quickstart under
  # /opt/stardelt/notebooks. Built and published by CI (Image workflow), private
  # like Superset, so the spawner pulls with the ghcr-creds Secret.
  image:
    name: ghcr.io/stardelt/jupyter-singleuser
    # The tag stays for readability; the digest is what the kubelet actually
    # pulls (same shape as manifests/nova-deployment.yaml). `make pin-images`
    # only covers Deployments, and spawned single-user pods are not Deployments,
    # so this pin is by hand: after a merge publishes a new image, resolve `dev`
    # again and bump the digest here.
    tag: "dev@sha256:3ee9e8ddc35b25b2b3bc282cb8e06e15a797f56455c754ca9811fd567985537f"
    pullSecrets:
      - name: ghcr-creds
  defaultUrl: /lab
  # Where the notebook finds the warehouse when the platform has **no** IdP (and
  # therefore no TLS listener on the coordinator, manifests/trino-tls.yaml): the
  # public HTTPS origin. With an IdP the hub overrides TRINO_URL to the
  # in-cluster TLS endpoint in `25-notebook-trino` above, so the notebook never
  # depends on the public name or the ingress.
  extraEnv:
    TRINO_URL: https://trino.alpha.dev.stardelt.io:443
    # Spark Connect's ClusterIP endpoint for `stardelt.spark()` (default when
    # the pod does not override it). Reachable through the egress rule below;
    # Spark has no authentication of its own, so this stays cluster-internal.
    SPARK_REMOTE: sc://spark-connect.stardelt.svc.cluster.local:15002
    # The secret store for `stardelt.connection()` (decisions D23 and D27). Opt-in like the store itself
    # (`make openbao`): without it installed the helper answers "not reachable" in one line. A person
    # signs in with their own token; the store decides what they may read.
    STARDELT_SECRET_STORE_URL: http://openbao.stardelt.svc.cluster.local:8200
  # Seed the quickstart into the home directory on every spawn, never
  # overwriting a user's edited copy (`cp -n`). postStart always exits 0: a
  # failing hook would make kubelet restart the container in a loop.
  lifecycleHooks:
    postStart:
      exec:
        command:
          - bash
          - -c
          - cp -n /opt/stardelt/notebooks/*.ipynb "$HOME/" || true
  startTimeout: 300
  memory:
    limit: 1G
    guarantee: 256M
  cpu:
    limit: 1
    guarantee: 0.1
  storage:
    type: none
    # The CA that signs the coordinator certificate (manifests/trino-tls.yaml),
    # mounted as ca.crt for REQUESTS_CA_BUNDLE in `25-notebook-trino`. Only that
    # one key is mounted, never tls.key of the server certificate. `optional:
    # true` because the Secret exists only once the platform has an IdP — an
    # install without one gets an empty directory and uses the public endpoint.
    extraVolumes:
      - name: trino-ca
        secret:
          secretName: trino-ca
          optional: true
          items:
            - key: tls.crt
              path: ca.crt
    extraVolumeMounts:
      - name: trino-ca
        mountPath: /etc/stardelt/trino-ca
        readOnly: true
  # The chart's default denies egress to every private address
  # (`egressAllowRules.privateIPs: false`), and that default is right: a user pod
  # has no business reaching arbitrary cluster-internal services. Three private
  # destinations are part of the notebook experience, each granted by pod label
  # and port so the rule follows the Service wherever it moves and opens nothing
  # else:
  #
  #   egress rule                              reaches
  #   podSelector spark-connect + 15002        Spark Connect, and nothing else on that port
  #   podSelector trino coordinator + 8443     the warehouse's TLS endpoint, nothing else
  #   podSelector openbao + 8200               the secret store, for stardelt.connection()
  #
  # (was: ConnectionRefusedError in the quickstart's Spark cell, stardelt-platform#90;
  # the Trino rule arrived with the in-cluster TLS listener, platform#80 — before it,
  # the notebook talked to the public hostname, which is a non-private address.)
  #
  # Private git servers (the umbrella chart's `notebooks.gitHosts`) are granted
  # here, as explicit HTTPS-only entries — one `to.ipBlock` per CIDR, TCP 443,
  # never `0.0.0.0/0`. A NetworkPolicy `ipBlock` takes CIDRs only, never
  # hostnames: resolve the server once and list its ranges. Public hosts
  # (github.com, …) need no entry: the chart default
  # `egressAllowRules.nonPrivateIPs: true` already lets user pods reach public
  # IPs. Empty by default: user pods reach nothing private.
  networkPolicy:
    egress:
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: spark-connect
        ports:
          - port: 15002
            protocol: TCP
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: trino
                app.kubernetes.io/component: coordinator
        ports:
          - port: 8443
            protocol: TCP
      # The secret store (`make openbao`), for `stardelt.connection()`; nothing matches when it is not installed.
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: openbao
        ports:
          - port: 8200
            protocol: TCP
      # Example — uncomment and set the customer's ranges:
      # - to:
      #     - ipBlock:
      #         cidr: 192.0.2.0/24   # customer's Gitea / GitLab / GHES
      #   ports:
      #     - port: 443
      #       protocol: TCP
