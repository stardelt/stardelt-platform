# Query log feed (stardelt-nova#116, decision D25). Trino's HTTP event listener posts
# every query-created and query-completed event to Nova's internal port, where the
# collector turns them into rows of the user-facing query log.
#
# Applied by `make trino` on top of helm-values/trino.yaml (and the identity overlay).
# The bearer token comes from Secret `nova-events` (scripts/nova-events-token.sh) through
# the env var NOVA_EVENTS_TOKEN declared in helm-values/trino.yaml, so it never appears
# in a ConfigMap. `X-Stardelt-Warehouse` names the warehouse the events come from.
# A lost event costs one log row and never delays a query (the listener is asynchronous).
eventListenerProperties:
  - event-listener.name=http
  - http-event-listener.log-created=true
  - http-event-listener.log-completed=true
  - http-event-listener.connect-ingest-uri=http://nova:8081/internal/trino-events
  - http-event-listener.connect-http-headers=Authorization:Bearer ${ENV:NOVA_EVENTS_TOKEN},X-Stardelt-Warehouse:default
  - http-event-listener.connect-retry-count=2
