# Lakekeeper — Iceberg REST catalog.
# Chart: lakekeeper/lakekeeper 0.11.0, appVersion 0.12.2.
#
# Decisions for the MVP:
#   - bundled postgres OFF → use CNPG Cluster `lakekeeper-pg`
#   - authorization through the external OpenFGA and the OPA sidecar (platform#304,
#     authz 3/8); `install-core` (no IdP) overrides this back to `allowall`
#   - authentication ON (platform#285): every request needs a valid bearer token
#   - helmWait true so `helm upgrade --wait` blocks until migrations land
#
# Authorization must not change after bootstrapping: enabling OpenFGA on the
# bootstrapped catalog locks every request out (403) until the catalog is
# re-bootstrapped and the grants are written. `make catalog-authz` does that in
# one idempotent run (scripts/catalog-authz-bootstrap.sh) — never apply this
# file with a bare `helm upgrade`.

helmWait: true

postgresql:
  enabled: false

externalDatabase:
  type: postgres
  host_read:  lakekeeper-pg-rw.stardelt.svc.cluster.local
  host_write: lakekeeper-pg-rw.stardelt.svc.cluster.local
  port: 5432
  database: lakekeeper
  userSecret: lakekeeper-pg-app
  userSecretKey: username
  passwordSecret: lakekeeper-pg-app
  passwordSecretKey: password

authz:
  backend: openfga
  openfga:
    # OpenFGA's gRPC port (platform#302). Its authorization model is written by
    # the chart's migration Job during `helm upgrade`, so OpenFGA must be Ready
    # first or the server fails with "Active authorization model ... not found".
    endpoint: http://openfga.stardelt.svc.cluster.local:8081

# The OPA bridge (platform#304): a sidecar in the catalog pod, exposed on TCP
# 8282 by Service `lakekeeper-opa`, that answers Trino's authorization
# questions. It signs in to Lakekeeper with `svc-catalog-bridge` and writes the
# per-request decisions; its `project_admin` grant is a god credential (it can
# change every grant in the project).
OPABridge:
  enabled: true
  catalogs:
    - trinoCatalog: warehouse
      lakekeeperWarehouse: warehouse
  allowUnmanagedCatalogs: true
  # stardelt's additions to the chart's rules (platform#333, "The bridge
  # contract" in the README). The chart's policies answer catalog, schema and
  # table questions from Lakekeeper's grants; three operations Trino 480 asks
  # have no rule at all, and the bridge's default deny then breaks ordinary use:
  #
  #   * SetSystemSessionProperty — Trino asks before *any* `SET SESSION` (the
  #     CLI, JDBC, Superset). Without a rule every session property is refused,
  #     including `SET SESSION query_max_run_time`, which is not data.
  #   * ShowFunctions/FilterFunctions on a *managed* catalog — `SHOW FUNCTIONS
  #     FROM finance.seed` comes back empty because the function filter is
  #     denied. A function list is metadata: it follows the same question as the
  #     catalog itself (Lakekeeper's `get_config`, the `browse` verb), so a
  #     person who may see a catalog may see its functions. The unmapped
  #     catalogs (system, tpch, tpcds) are already allowed through
  #     allowUnmanagedCatalogs.
  #
  # Every rule here is proved by `make bridge-replay`; the file is the "one
  # small policy" the ticket allows, not a second policy layer.
  customPolicies:
    trino.stardelt.rego: |
      package trino

      # Trino asks this before applying any system session property.
      allow if {
      	input.action.operation == "SetSystemSessionProperty"
      }

      # A function question names its catalog on the schema (ShowFunctions) or
      # on the function (FilterFunctions).
      _function_catalog := input.action.resource.schema.catalogName
      _function_catalog := input.action.resource.function.catalogName

      allow if {
      	input.action.operation in ["ShowFunctions", "FilterFunctions"]
      	require_catalog_access_simple(_function_catalog, "get_config")
      }
  resources:
    requests: { cpu: "20m", memory: "48Mi" }
    limits: { memory: "256Mi" }
  # The chart's `lakekeeper.existingSecret` branch (0.11.0 and 0.12.0) emits
  # `value: "1000"` and the next `- name:` without a newline, which makes the
  # rendered Deployment invalid YAML. Until that is fixed upstream, the four
  # credentials are mounted with `extraEnv` + `secretKeyRef` from the same Secret;
  # nothing secret is written into values or the release.
  lakekeeper:
    existingSecret: ""
    tokenEndpoint: ""
    clientId: ""
    clientSecret: ""
    scope: ""
  extraEnv:
    - name: LAKEKEEPER_TOKEN_ENDPOINT
      valueFrom: { secretKeyRef: { name: svc-catalog-bridge, key: token-url } }
    - name: LAKEKEEPER_CLIENT_ID
      valueFrom: { secretKeyRef: { name: svc-catalog-bridge, key: client-id } }
    - name: LAKEKEEPER_CLIENT_SECRET
      valueFrom: { secretKeyRef: { name: svc-catalog-bridge, key: client-secret } }
    - name: LAKEKEEPER_SCOPE
      valueFrom: { secretKeyRef: { name: svc-catalog-bridge, key: scope } }

catalog:
  replicas: 1
  resources:
    requests: { cpu: "50m",  memory: "256Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }

  # Authentication (platform#285, step 5 of the catalog turn-on): the two settings
  # the spike verified (platform#271, P1.1) — `LAKEKEEPER__OPENID_PROVIDER_URI` and
  # `LAKEKEEPER__OPENID_AUDIENCE`. A request without a valid token is now 401; the
  # authoriser stays `allowall`, so a valid token is required but not restricted.
  #
  # They are extra env vars, not `auth.oauth2.providerUri`, because the issuer is
  # install-time state: it lives in ConfigMap `stardelt-identity` (`issuerUrl`),
  # and Helm cannot read a ConfigMap in a values file. Every other component reads
  # the identity contract the same way (Trino, Superset, JupyterHub, the bootstrap
  # Job), and `optional: true` keeps `install-core` — which has no IdP — anonymous
  # instead of failing. `LAKEKEEPER__OPENID_AUDIENCE` is `lakekeeper`, the
  # `aud-lakekeeper` mapper on each `svc-catalog-*` client (platform#282).
  podAnnotations:
    # Reloader restarts the catalog when the identity contract appears or its issuer
    # changes: the env ref below is unaffected by a ConfigMap update, so without this
    # a release that enables identity would keep serving anonymously until a manual
    # restart. Same mechanism as Airflow and Superset (helm-values/reloader.yaml).
    configmap.reloader.stakater.com/reload: stardelt-identity
  extraEnv:
    - name: LAKEKEEPER__OPENID_PROVIDER_URI
      valueFrom:
        configMapKeyRef:
          name: stardelt-identity
          key: issuerUrl
          optional: true
    - name: LAKEKEEPER__OPENID_AUDIENCE
      value: lakekeeper
