# Apache Superset — BI / dashboards.
# Chart: superset/superset 0.15.5, appVersion 5.0.0.
#
# kind tuning:
#   - Single replica everywhere; celery-beat + websockets off.
#   - Bundled Postgres + Redis (Bitnami sub-charts) — could later migrate the
#     Postgres to CNPG to consolidate, kept bundled for MVP simplicity.
#   - bootstrapScript installs the `trino` python driver into the running pod
#     on each startup. For production, bake this into a custom image.
#   - Talisman / X-Frame-Options disabled so Nova can iframe Superset.
#     MVP-only: removes click-jacking protection.
#   - import_datasources.yaml pre-creates the Trino warehouse database
#     connection so SQL Lab works immediately after install.

# stardelt's Superset image (images/superset/Dockerfile): upstream Superset 5.0.0
# plus psycopg2-binary + the Trino SQLAlchemy driver, pre-installed in /app/.venv/.
# Built and published by CI (the `Image` workflow), not by hand — a local
# `make build-superset-image` is for iteration only.
image:
  repository: ghcr.io/stardelt/superset
  tag: dev
  pullPolicy: IfNotPresent

# The package is private, so the pod needs the same pull secret as Nova.
# Kubernetes' shape: a list of {name: …} objects. The chart passes this through
# verbatim, so the string form fails the release with a type error on apply.
imagePullSecrets:
  - name: ghcr-creds

bootstrapScript: |
  #!/bin/bash
  if [ ! -f ~/bootstrap ]; then echo "Running Superset" > ~/bootstrap; fi

# Allow iframe embedding from Nova (running on a different port locally).
configOverrides:
  iframe_embedding: |
    TALISMAN_ENABLED = False
    # Flask-AppBuilder also sets X-Frame-Options via WTF_CSRF; suppress.
    HTTP_HEADERS = {}
    # Allow SameSite=None cookies if you ever want cross-site auth.
    SESSION_COOKIE_SAMESITE = "Lax"
    # ENABLE_PROXY_FIX so x-forwarded headers are honored when iframed.
    ENABLE_PROXY_FIX = True

  # Sign-in through Keycloak (Flask-AppBuilder's OAuth provider). One platform
  # identity, no local Superset account for people. APPENDED to the generated
  # superset_config.py, so these assignments win over the defaults.
  #
  # FAB registers exactly one login view, selected by AUTH_TYPE, so OAuth and the
  # local username/password form cannot both be on at once. The lockout guard is
  # therefore: the local `admin` row (and the superset-admin Secret) is never
  # removed, and AUTH_TYPE falls back to AUTH_DB whenever the identity contract
  # is not there (`make install-identity` not run) or when the break-glass flag
  # STARDELT_AUTH_LOCAL_ONLY=1 is set on the deployment:
  #   kubectl -n stardelt set env deploy/superset STARDELT_AUTH_LOCAL_ONLY=1
  # (rolls the pod; `set env ... STARDELT_AUTH_LOCAL_ONLY-` undoes it).
  oauth: |
    import os
    from flask_appbuilder.const import AUTH_DB, AUTH_OAUTH

    # From the stardelt-identity ConfigMap and stardelt-oidc-clients Secret,
    # injected as env by extraEnvRaw above. Never literals in this file.
    _issuer = os.environ.get("STARDELT_OIDC_ISSUER", "").rstrip("/")
    _secret = os.environ.get("STARDELT_SUPERSET_CLIENT_SECRET", "")
    _local_only = os.environ.get("STARDELT_AUTH_LOCAL_ONLY") == "1"

    if _issuer and _secret and not _local_only:
        AUTH_TYPE = AUTH_OAUTH
        OAUTH_PROVIDERS = [
            {
                "name": "keycloak",
                "token_key": "access_token",
                "icon": "fa-key",
                "remote_app": {
                    "client_id": "superset",
                    "client_secret": _secret,
                    # Discovery carries the token/auth endpoints; api_base_url is
                    # what FAB's Keycloak branch joins "openid-connect/userinfo"
                    # onto to read groups.
                    "server_metadata_url": _issuer + "/.well-known/openid-configuration",
                    "api_base_url": _issuer + "/protocol/",
                    "client_kwargs": {"scope": "openid email profile"},
                },
            }
        ]
        # Anyone in the realm may sign in (Gamma: read shared dashboards);
        # members of stardelt-admins are synced to Admin on every login.
        AUTH_USER_REGISTRATION = True
        AUTH_USER_REGISTRATION_ROLE = "Gamma"
        AUTH_ROLES_MAPPING = {
            os.environ.get("STARDELT_ADMIN_GROUP", "stardelt-admins"): ["Admin"]
        }
        AUTH_ROLES_SYNC_AT_LOGIN = True
    else:
        AUTH_TYPE = AUTH_DB

# No secrets in this file: scripts/app-secrets.sh generates them per cluster
# (the install targets run it before this chart) and keeps them across installs
# and uninstalls. `superset 0.15.5` has no `supersetSecretKeySecretName` field,
# and `extraSecretEnv` writes its values into a Secret as literals (a `valueFrom`
# map would render as garbage), so the key is passed as a raw env entry instead:
# `extraEnvRaw` reaches every Superset pod and the init Job.
#
# The Keycloak OAuth client secret is the same pattern: an env entry read from
# stardelt-oidc-clients (generated per cluster by scripts/identity-bootstrap.sh).
# The Python config below only ever sees it through os.environ, so no rendered
# object — Secret or ConfigMap — contains the value.
extraEnvRaw:
  - name: SUPERSET_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: superset-secret-key
        key: secret-key
  - name: SUPERSET_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: superset-admin
        key: password
  # Identity contract (same keys Nova reads): issuer + admin group, optional so a
  # platform installed without `make install-identity` still starts and keeps the
  # local admin login (see the oauth override below).
  - name: STARDELT_OIDC_ISSUER
    valueFrom:
      configMapKeyRef:
        name: stardelt-identity
        key: issuerUrl
        optional: true
  - name: STARDELT_ADMIN_GROUP
    valueFrom:
      configMapKeyRef:
        name: stardelt-identity
        key: adminGroup
        optional: true
  - name: STARDELT_SUPERSET_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: stardelt-oidc-clients
        key: superset
        optional: true

# Pre-import the Trino database connection on init.
extraConfigs:
  import_datasources.yaml: |
    databases:
    - database_name: Trino Warehouse
      sqlalchemy_uri: trino://stardelt-dev@trino.stardelt.svc.cluster.local:8080/warehouse
      tables: []

# init Job creates admin user + imports the datasource above.
# The chart only offers `init.adminUser.password`, a literal that is interpolated
# into the init script, so it cannot come from a Secret. `init.initscript` is a
# supported values field: below is the chart 0.15.5 default script with the
# `--password` argument read from SUPERSET_ADMIN_PASSWORD (extraEnvRaw above,
# from the superset-admin Secret). Username and profile are not credentials and
# stay in values.
init:
  adminUser:
    username: admin
    firstname: stardelt
    lastname: Admin
    email: admin@stardelt.local
  initscript: |
    #!/bin/sh
    set -eu
    echo "Upgrading DB schema..."
    superset db upgrade
    echo "Initializing roles..."
    superset init
    {{ if .Values.init.createAdmin }}
    echo "Creating admin user..."
    superset fab create-admin \
                    --username {{ .Values.init.adminUser.username }} \
                    --firstname {{ .Values.init.adminUser.firstname }} \
                    --lastname {{ .Values.init.adminUser.lastname }} \
                    --email {{ .Values.init.adminUser.email }} \
                    --password "$SUPERSET_ADMIN_PASSWORD" \
                    || true
    {{- end }}
    {{ if .Values.init.loadExamples }}
    echo "Loading examples..."
    superset load_examples
    {{- end }}
    if [ -f "{{ .Values.extraConfigMountPath }}/import_datasources.yaml" ]; then
      echo "Importing database connections.... "
      superset import_datasources -p {{ .Values.extraConfigMountPath }}/import_datasources.yaml
    fi
  loadExamples: false

# Components
supersetNode:
  replicas:
    enabled: true
    replicaCount: 1
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "1Gi"  }

supersetWorker:
  replicas:
    enabled: true
    replicaCount: 1
  # Default celery prefork concurrency = CPU count = 24+ on this host, which
  # OOMs the worker pod (each prefork is a full Python process). Cap to 2.
  command:
    - "/bin/sh"
    - "-c"
    - ". {{ .Values.configMountPath }}/superset_bootstrap.sh; celery --app=superset.tasks.celery_app:app worker --concurrency=2"
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "1Gi"  }

supersetCeleryBeat:
  enabled: false

supersetWebsockets:
  enabled: false

# Bundled deps
postgresql:
  enabled: true
  primary:
    persistence:
      size: 2Gi
    resources:
      requests: { cpu: "50m", memory: "256Mi" }
      limits:   { cpu: "1",   memory: "512Mi" }

redis:
  enabled: true
  master:
    persistence:
      size: 1Gi
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits:   { cpu: "1",   memory: "256Mi" }
  replica:
    replicaCount: 0

service:
  type: ClusterIP
  port: 8088
