# Apache Superset — BI / dashboards.
# Chart: superset/superset 0.15.5, appVersion 5.0.0.
#
# kind tuning:
#   - Single replica everywhere; celery-beat + websockets off.
#   - Bundled Postgres + Redis (Bitnami sub-charts) — could later migrate the
#     Postgres to CNPG to consolidate, kept bundled for MVP simplicity.
#   - bootstrapScript installs the `trino` python driver into the running pod
#     on each startup. For production, bake this into a custom image.
#   - Talisman / X-Frame-Options disabled so Nova can iframe Superset.
#     MVP-only: removes click-jacking protection.
#   - import_datasources.yaml pre-creates the Trino warehouse database
#     connection so SQL Lab works immediately after install.

# stardelt's Superset image (images/superset/Dockerfile): upstream Superset 5.0.0
# plus psycopg2-binary + the Trino SQLAlchemy driver, pre-installed in /app/.venv/.
# Built and published by CI (the `Image` workflow), not by hand — a local
# `make build-superset-image` is for iteration only.
image:
  repository: ghcr.io/stardelt/superset
  # The tag stays for readability; the digest is what the kubelet actually pulls. A bare `dev`
  # tag resolved to a stale manifest on the dev node — the pod came up without `authlib` and
  # crash-looped while the chart enables `AUTH_OAUTH` (platform#231). `make pin-images` does not
  # cover this release (it pins Deployments only), so this digest is bumped by hand after a
  # merge publishes a new image — same shape as helm-values/jupyterhub.yaml.
  tag: "dev@sha256:b9ced85d81a0c9efd2ca993f27bba5470e4815aad9d246b93e3ca5e62d26e8cd"
  pullPolicy: IfNotPresent

# The package is private, so the pod needs the same pull secret as Nova.
# Kubernetes' shape: a list of {name: …} objects. The chart passes this through
# verbatim, so the string form fails the release with a type error on apply.
imagePullSecrets:
  - name: ghcr-creds

bootstrapScript: |
  #!/bin/bash
  if [ ! -f ~/bootstrap ]; then echo "Running Superset" > ~/bootstrap; fi

# Allow iframe embedding from Nova (running on a different port locally).
configOverrides:
  iframe_embedding: |
    TALISMAN_ENABLED = False
    # Flask-AppBuilder also sets X-Frame-Options via WTF_CSRF; suppress.
    HTTP_HEADERS = {}
    # Allow SameSite=None cookies if you ever want cross-site auth.
    SESSION_COOKIE_SAMESITE = "Lax"
    # ENABLE_PROXY_FIX so x-forwarded headers are honored when iframed.
    ENABLE_PROXY_FIX = True

  # Sign-in through Keycloak (Flask-AppBuilder's OAuth provider). One platform
  # identity, no local Superset account for people. APPENDED to the generated
  # superset_config.py, so these assignments win over the defaults.
  #
  # FAB registers exactly one login view, selected by AUTH_TYPE, so OAuth and the
  # local username/password form cannot both be on at once. The lockout guard is
  # therefore: the local `admin` row (and the superset-admin Secret) is never
  # removed, and AUTH_TYPE falls back to AUTH_DB whenever the identity contract
  # is not there (`make install-identity` not run) or when the break-glass flag
  # STARDELT_AUTH_LOCAL_ONLY=1 is set on the deployment:
  #   kubectl -n stardelt set env deploy/superset STARDELT_AUTH_LOCAL_ONLY=1
  # (rolls the pod; `set env ... STARDELT_AUTH_LOCAL_ONLY-` undoes it).
  # With impersonation on (#310) that local `admin` is a name Trino's
  # impersonation rule refuses (only UUID principals may be impersonated), so the
  # break-glass restores administration of Superset, not data access through it.
  # Also carries the Trino service-account password store at the end: both are
  # read from os.environ, so they share the import instead of repeating it.
  oauth: |
    import os
    from flask_appbuilder.const import AUTH_DB, AUTH_OAUTH
    from superset.security import SupersetSecurityManager

    # From the stardelt-identity ConfigMap and stardelt-oidc-clients Secret,
    # injected as env by extraEnvRaw above. Never literals in this file.
    _issuer = os.environ.get("STARDELT_OIDC_ISSUER", "").rstrip("/")
    _secret = os.environ.get("STARDELT_SUPERSET_CLIENT_SECRET", "")
    _local_only = os.environ.get("STARDELT_AUTH_LOCAL_ONLY") == "1"

    if _issuer and _secret and not _local_only:
        AUTH_TYPE = AUTH_OAUTH
        OAUTH_PROVIDERS = [
            {
                "name": "keycloak",
                "token_key": "access_token",
                "icon": "fa-key",
                "remote_app": {
                    "client_id": "superset",
                    "client_secret": _secret,
                    # Discovery carries the token/auth endpoints; api_base_url is
                    # what FAB's Keycloak branch joins "openid-connect/userinfo"
                    # onto to read groups.
                    "server_metadata_url": _issuer + "/.well-known/openid-configuration",
                    "api_base_url": _issuer + "/protocol/",
                    "client_kwargs": {"scope": "openid email profile"},
                },
            }
        ]
        # Anyone in the realm may sign in (Gamma: read shared dashboards);
        # members of stardelt-admins are synced to Admin on every login, and
        # members of stardelt-users to Gamma + stardelt-analyst (SQL Lab and
        # the datasets of the Trino warehouse, nothing administrative; the role
        # is created by the init Job — #287). Synced on every login, so leaving
        # the group takes the role away at the next sign-in.
        AUTH_USER_REGISTRATION = True
        AUTH_USER_REGISTRATION_ROLE = "Gamma"
        AUTH_ROLES_MAPPING = {
            os.environ.get("STARDELT_ADMIN_GROUP", "stardelt-admins"): ["Admin"],
            "stardelt-users": ["Gamma", "stardelt-analyst"],
        }
        AUTH_ROLES_SYNC_AT_LOGIN = True

        # --- the Superset username is the Keycloak subject (#310) -------------
        # The person who signs in here is the person Trino authorizes: the form
        # login name is not what the catalog knows. After the identity turn-on
        # (authz 8/8) Trino's principal is the token's `sub` and the permission
        # bridge maps that principal to the Lakekeeper user `oidc~<sub>`, so the
        # name Superset impersonates must be that same UUID. Readable names do not
        # disappear: first and last name come from the same userinfo response and
        # Superset shows those.
        #
        # FAB's Keycloak branch (flask_appbuilder/security/manager.py,
        # `get_oauth_user_info`) returns `preferred_username`; this subclass keeps
        # that branch's keys and swaps only the username. `oauth_user_info` is the
        # hook FAB's OAuth view calls (it binds the instance attribute in __init__
        # unless a subclass already provides one), and the fallback names
        # `get_oauth_user_info` because `BaseSecurityManager.oauth_user_info`
        # itself is None in FAB 4.5.5 — checked in the running pod, not guessed.
        class StardeltSecurityManager(SupersetSecurityManager):
            """Sign people in under their Keycloak subject (`sub`), not their login name."""

            @staticmethod
            def _rename_alias_row(subject, email):
                """Adopt the row a person already has from before #310.

                People who signed in before this change have a row under their login
                name, and FAB's `ab_user.email` is UNIQUE *and* NOT NULL — a second row
                for the same address cannot be inserted. Measured on this cluster: the
                next sign-in ended 401 with `duplicate key value violates unique
                constraint "ab_user_email_key"` when the old row already held the
                address (the ticket expected a new row; the column forbids it). Rename
                that row instead: one row per person, the same email and saved queries,
                and the username (the name Trino sees) becomes the `sub`.
                """
                if not email:
                    return
                from flask_appbuilder.security.sqla.models import User
                from superset import db

                alias = db.session.query(User).filter(User.email == email).one_or_none()
                if alias is None or alias.username == subject:
                    return
                if db.session.query(User).filter(User.username == subject).one_or_none():
                    return  # somebody already signs in under the subject: merge nothing
                alias.username = subject
                db.session.commit()

            def oauth_user_info(self, provider, response=None):
                if provider == "keycloak":
                    me = self.appbuilder.sm.oauth_remotes[provider].get(
                        "openid-connect/userinfo"
                    )
                    me.raise_for_status()
                    data = me.json()
                    self._rename_alias_row(data["sub"], data.get("email", ""))
                    return {
                        "username": data["sub"],
                        "first_name": data.get("given_name", ""),
                        "last_name": data.get("family_name", ""),
                        "email": data.get("email", ""),
                        "role_keys": data.get("groups", []),
                    }
                return super().get_oauth_user_info(provider, response)

        CUSTOM_SECURITY_MANAGER = StardeltSecurityManager
    else:
        AUTH_TYPE = AUTH_DB

    # --- one result cache per person (#310) -----------------------------------
    # With impersonation on, a chart's query runs as the viewer; without this flag
    # Superset keys the result cache by the query alone, and user B is served user
    # A's cached chart (measured in platform#279, Q6 — a cross-user data leak).
    # `globals()` is empty here: Superset loads this file as its own module and
    # copies the upper-case names onto superset.config, whose FEATURE_FLAGS is {}.
    # Outside the branch on purpose: switching back to the local form must not
    # silently drop the flag.
    FEATURE_FLAGS = {**globals().get("FEATURE_FLAGS", {}), "CACHE_IMPERSONATION": True}

    # --- Trino service account (platform#278) ---------------------------------
    # The datasource URI carries no password (extraConfigs/import_datasources.yaml):
    # Superset asks this hook for it every time it builds an engine, so the
    # credential lives in exactly one place — Secret trino-password-db, via the pod
    # environment. Rotating the Secret and restarting the pods is the whole story.
    # The hook is global (every database goes through it), so it answers only for
    # our Trino service account and hands every other database its URL password.
    def _stardelt_password_store(url):
        """The Trino service account's password comes from the environment, never from the stored URI.
        The hook is global (every database goes through it), so it answers only for our Trino account."""
        if url.drivername.startswith("trino") and url.username == "superset":
            # No service account on an install without `make install-identity`: the
            # variable is absent, Trino has no authentication, and the
            # credential-free URI stays exactly as it was.
            return os.environ.get("TRINO_SUPERSET_PASSWORD") or url.password
        return url.password

    SQLALCHEMY_CUSTOM_PASSWORD_STORE = _stardelt_password_store

# No secrets in this file: scripts/app-secrets.sh generates them per cluster
# (the install targets run it before this chart) and keeps them across installs
# and uninstalls. `superset 0.15.5` has no `supersetSecretKeySecretName` field,
# and `extraSecretEnv` writes its values into a Secret as literals (a `valueFrom`
# map would render as garbage), so the key is passed as a raw env entry instead:
# `extraEnvRaw` reaches every Superset pod and the init Job.
#
# The Keycloak OAuth client secret is the same pattern: an env entry read from
# stardelt-oidc-clients (generated per cluster by scripts/identity-bootstrap.sh).
# The Python config below only ever sees it through os.environ, so no rendered
# object — Secret or ConfigMap — contains the value.
extraEnvRaw:
  - name: SUPERSET_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: superset-secret-key
        key: secret-key
  - name: SUPERSET_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: superset-admin
        key: password
  # Superset's Trino service account (#79): SQLALCHEMY_CUSTOM_PASSWORD_STORE
  # (configOverrides above) reads it from this environment variable at connect
  # time. `trino-password-db` comes from scripts/identity-bootstrap.sh, so it is
  # optional like the identity entries — a platform installed without
  # `make install-identity` still starts (and needs no Trino credentials, because
  # without the IdP Trino has no authentication).
  - name: TRINO_SUPERSET_PASSWORD
    valueFrom:
      secretKeyRef:
        name: trino-password-db
        key: superset-password
        optional: true
  - name: STARDELT_PUBLIC_URL
    valueFrom:
      configMapKeyRef:
        name: stardelt-identity
        key: publicUrl
        optional: true
  # Identity contract (same keys Nova reads): issuer + admin group, optional so a
  # platform installed without `make install-identity` still starts and keeps the
  # local admin login (see the oauth override below).
  - name: STARDELT_OIDC_ISSUER
    valueFrom:
      configMapKeyRef:
        name: stardelt-identity
        key: issuerUrl
        optional: true
  - name: STARDELT_ADMIN_GROUP
    valueFrom:
      configMapKeyRef:
        name: stardelt-identity
        key: adminGroup
        optional: true
  - name: STARDELT_SUPERSET_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: stardelt-oidc-clients
        key: superset
        optional: true

# Pre-import the Trino database connection on init. Credential-free on purpose:
# the URI carries no secret. The password is supplied at connect time by
# SQLALCHEMY_CUSTOM_PASSWORD_STORE (configOverrides above), from Secret
# trino-password-db — so a rotation never leaves a stale password behind in
# Superset's metadata database (#278).
#
# The init Job also runs scripts/superset-analyst-role.py from this mount. The
# file lives in the repo, not here: `make install` passes it with
# `--set-file extraConfigs.superset-analyst-role\.py=scripts/…` so the ConfigMap
# carries it and there is one copy to edit. A `helm upgrade` of this release
# without that flag fails the init Job loudly rather than silently installing
# without the role.
#
# `impersonate_user: true` (#310) makes every query run as the signed-in person:
# Superset keeps authenticating to Trino as the `superset` service account
# (PASSWORD) and sends the person as `X-Trino-User`; Trino's file access control
# authorizes that through the `impersonation` rule in
# helm-values/trino-identity.yaml, and the person is the Keycloak `sub` — the
# username CUSTOM_SECURITY_MANAGER gives them in configOverrides above.
#
# The import updates this row on every init run, not only on first creation: the
# v0 importer calls `Database.import_from_dict`, which looks the row up by
# database_name and sets every key it knows — `impersonate_user` is in
# `Database.export_fields`, so no hand-written UPDATE is needed for an existing
# install.
extraConfigs:
  import_datasources.yaml: |
    databases:
    - database_name: Trino Warehouse
      sqlalchemy_uri: trino://superset@trino.alpha.dev.stardelt.io:443/warehouse
      impersonate_user: true
      tables: []

# init Job creates admin user + imports the datasource above.
# The chart only offers `init.adminUser.password`, a literal that is interpolated
# into the init script, so it cannot come from a Secret. `init.initscript` is a
# supported values field: below is the chart 0.15.5 default script with the
# `--password` argument read from SUPERSET_ADMIN_PASSWORD (extraEnvRaw above,
# from the superset-admin Secret). Username and profile are not credentials and
# stay in values.
init:
  adminUser:
    username: admin
    firstname: stardelt
    lastname: Admin
    email: admin@stardelt.local
  initscript: |
    #!/bin/sh
    set -eu
    echo "Upgrading DB schema..."
    superset db upgrade
    echo "Initializing roles..."
    superset init
    {{ if .Values.init.createAdmin }}
    echo "Creating admin user..."
    superset fab create-admin \
                    --username {{ .Values.init.adminUser.username }} \
                    --firstname {{ .Values.init.adminUser.firstname }} \
                    --lastname {{ .Values.init.adminUser.lastname }} \
                    --email {{ .Values.init.adminUser.email }} \
                    --password "$SUPERSET_ADMIN_PASSWORD" \
                    || true
    {{- end }}
    {{ if .Values.init.loadExamples }}
    echo "Loading examples..."
    superset load_examples
    {{- end }}
    if [ -f "{{ .Values.extraConfigMountPath }}/import_datasources.yaml" ]; then
      echo "Importing database connections.... "
      superset import_datasources -p {{ .Values.extraConfigMountPath }}/import_datasources.yaml
    fi
    # Normal users' role (#287), after `superset init` and the datasource import
    # so the built-in roles and the database exist. Idempotent: it converges the
    # role to the exact permission set and prints one line.
    echo "Converging the analyst role..."
    python "{{ .Values.extraConfigMountPath }}/superset-analyst-role.py"
    # The password is supplied at connect time by SQLALCHEMY_CUSTOM_PASSWORD_STORE
    # (configOverrides above); the URI above stays credential-free on purpose.
  loadExamples: false

# Components
supersetNode:
  replicas:
    enabled: true
    replicaCount: 1
  # Reloader (make reloader) rolls the pods when the Trino service-account Secret
  # changes. The password is read from the environment at connect time (#278), so
  # a rotation needs nothing but this restart — no init Job, no SQL Lab round trip.
  podAnnotations:
    secret.reloader.stakater.com/reload: trino-password-db
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "1Gi"  }

supersetWorker:
  replicas:
    enabled: true
    replicaCount: 1
  # Async queries and alerts build engines here, so the worker needs the same
  # Secret-triggered restart: a stale TRINO_SUPERSET_PASSWORD breaks background
  # tasks exactly as it broke SQL Lab.
  podAnnotations:
    secret.reloader.stakater.com/reload: trino-password-db
  # Default celery prefork concurrency = CPU count = 24+ on this host, which
  # OOMs the worker pod (each prefork is a full Python process). Cap to 2.
  command:
    - "/bin/sh"
    - "-c"
    - ". {{ .Values.configMountPath }}/superset_bootstrap.sh; celery --app=superset.tasks.celery_app:app worker --concurrency=2"
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "1Gi"  }

supersetCeleryBeat:
  enabled: false

supersetWebsockets:
  enabled: false

# Bundled deps
postgresql:
  enabled: true
  primary:
    persistence:
      size: 2Gi
    resources:
      requests: { cpu: "50m", memory: "256Mi" }
      limits:   { cpu: "1",   memory: "512Mi" }

redis:
  enabled: true
  master:
    persistence:
      size: 1Gi
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits:   { cpu: "1",   memory: "256Mi" }
  replica:
    replicaCount: 0

service:
  type: ClusterIP
  port: 8088
