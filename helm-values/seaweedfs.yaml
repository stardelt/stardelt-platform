# SeaweedFS — S3-compatible storage for the MVP.
# Chart: seaweedfs/seaweedfs 4.25.1, appVersion 4.25.
#
# S3-compatible object store for the lakehouse. Backs Iceberg tables via
# Trino + Lakekeeper.

master:
  replicas: 1
  data:
    type: persistentVolumeClaim
    size: 1Gi
  defaultReplication: "000"
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { cpu: "1",   memory: "256Mi" }

volume:
  replicas: 1
  # PVC so the Iceberg data files survive pod restarts. emptyDir wipes on
  # pod restart, which orphans the Iceberg metadata pointing at the files
  # and surfaces as FileNotFoundException on Trino reads.
  dataDirs:
    - name: data
      type: persistentVolumeClaim
      size: 20Gi
      # Volume slots. The chart's default (0 → auto-configure, 7 on Linux) is a trap
      # on a small install: once the slots are used up, the master cannot create a
      # volume for a *new* collection, and writes to a new bucket block forever —
      # the client sees a hang, the master log says "failed to find writable volumes
      # … Not enough data nodes found", and buckets created earlier keep working.
      maxVolumes: 100
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "2Gi"  }

filer:
  replicas: 1
  data:
    type: persistentVolumeClaim
    size: 1Gi
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { cpu: "1",   memory: "256Mi" }

s3:
  enabled: true
  replicas: 1
  port: 8333
  enableAuth: true
  # Pin credentials so they match the existing s3-creds Secret instead of
  # auto-generating random ones. DEV ONLY: these values are committed to a public repo
  # (and duplicated in manifests/s3-credentials.dev.yaml) — rotate both before any
  # environment holds data you care about.
  credentials:
    admin:
      accessKey: stardelt-access-key
      secretKey: stardelt-secret-key
  createBuckets:
    - name: lakehouse
      anonymousRead: false
    # Destination for the catalog's continuous backups
    # (manifests/cnpg-backup-schedule.yaml).
    - name: backups
      anonymousRead: false
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "2",    memory: "1Gi"  }
