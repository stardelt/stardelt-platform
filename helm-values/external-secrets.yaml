# External Secrets Operator (Apache-2.0): syncs a secret store's values into Kubernetes Secrets
# (decision D23). Opt-in: `make external-secrets`. One replica of each of its three small workloads.
installCRDs: true
replicaCount: 1
resources:
  requests: { cpu: 20m, memory: 48Mi }
  limits: { memory: 192Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
