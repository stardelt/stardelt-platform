# OpenBao (MPL-2.0, the one documented non-permissive component) as the sandbox secret store
# (decision D23, platform#160). Opt-in: `make openbao`. Production installs use the customer's own
# store through External Secrets and never run this.
#
# Standalone, embedded `pebbledb` storage on one volume. The chart's default volume request is
# 10 GiB, the minimum of the dev cluster's volume class. Auto-unseal with a static key mounted from
# Secret `openbao-seal-key` (scripts/openbao-seal-key.sh): after a restart or a pod replacement the
# store opens itself, which was verified by deleting the pod. That key protects the data at rest
# only as well as the cluster protects its Secrets: fine for a sandbox, not for anything else.
injector:
  enabled: false
csi:
  enabled: false
server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  dataStorage:
    enabled: true
    size: 10Gi
  extraVolumes:
    # The chart mounts a Secret at <path>/<name>: /openbao/seal/openbao-seal-key/key
    - { type: secret, name: openbao-seal-key, path: /openbao/seal }
  standalone:
    enabled: true
    config: |
      ui = false

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "pebbledb" {
        path = "/openbao/data/pebbledb"
      }

      seal "static" {
        current_key_id = "key1"
        current_key    = "file:///openbao/seal/openbao-seal-key/key"
      }
