# The stardelt Operator's image (Makefile target `install-operator`). The operator is the one
# component this repo installs from the sibling checkout, so its image was the one without a
# checked-in pin: `make install-operator` used the chart's mutable `tag: dev` and the digest
# the cluster actually ran lived only in the Deployment (2026-11-04, found while rolling out
# operator#210-#214).
#
# `tag@sha256:…` pins the digest; the tag is only a label. After an operator merge, take the
# `Pin it: …` line the Image workflow prints (`gh run view <run> --log | grep 'Pin it'`) and
# update `tag` in a one-line PR; `./scripts/pin-image.sh stardelt-operator` moves the cluster and
# this line together.
#
# Do NOT use the `Digest: sha256:…` line in the same log: that is the buildx export digest,
# not the image manifest, and the kubelet answers `not found` for it. The correct value is
# the one in the `Pin it:` line (and no other way to tell them apart from the log).
image:
  repository: ghcr.io/stardelt/stardelt-operator
  tag: dev@sha256:46a5899caa89ce5807ca05c995e6313b47cd05a00939a03f0c684b77a7f6ff6a
  pullPolicy: IfNotPresent
